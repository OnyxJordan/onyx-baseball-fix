<!-- sport_shell.html: one template for every Onyx Sports page beyond MLB and
     NBA (NFL, college football, NHL, tennis, golf). sports_build.py injects
     the MLB stylesheet (one design system), the sport's data and its key. -->
<style>/*MLB_CSS*/</style>
<style>
.sp-wrap{max-width:1180px;margin:0 auto;padding:16px 16px 120px}
.sec-hdr{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:22px 0 12px}
.sec-count{font-size:12px;color:var(--text3);font-family:monospace}
.empty{padding:26px 18px;border:1px dashed var(--border2);border-radius:14px;text-align:center;color:var(--text3);font-size:13px;line-height:1.6}
.tbl{overflow-x:auto;border:1px solid var(--border2);border-radius:14px;background:var(--bg2)}
.tbl table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}
.gc .tbl table{min-width:440px}
.tbl th{padding:9px 10px;text-align:left;font:700 10px monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);border-bottom:1px solid var(--border2);white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .r{text-align:right}.mono{font-family:monospace}.dim{color:var(--text3)}
.tbl tr.tap{cursor:pointer}.tbl tr.tap:hover td{background:rgba(176,56,249,.06)}
.lg{width:22px;height:22px;object-fit:contain;vertical-align:middle;flex-shrink:0}
.lg.l{width:46px;height:46px}.lg.m{width:30px;height:30px}
.sp-tabs-seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:12px}.sp-tabs-seg::-webkit-scrollbar{display:none}
.sp-tabs-seg button{flex-shrink:0;padding:8px 13px;border-radius:999px;border:1px solid var(--border2);background:rgba(255,255,255,.04);color:var(--text2);font:700 12px 'Space Grotesk',system-ui,sans-serif;cursor:pointer;white-space:nowrap}
.sp-tabs-seg button.on{background:linear-gradient(135deg,#b038f9,#635bff);color:#fff;border-color:transparent}
/* game cards */
.gm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:12px}
.gm{--ocw:62px;position:relative;display:flex;flex-direction:column;gap:6px;padding:12px 14px 10px;border-radius:16px;border:1px solid var(--border2);
  background:radial-gradient(120% 70% at 0% 0%,rgba(176,56,249,.09),transparent 55%),linear-gradient(180deg,rgba(255,255,255,.025),transparent 45%),var(--bg2);
  cursor:pointer;color:var(--text);text-align:left;font:inherit;transition:border-color .2s,transform .2s,box-shadow .2s}
.gm:hover,.gm.sel{border-color:rgba(176,56,249,.6);box-shadow:0 14px 34px -18px rgba(176,56,249,.65)}.gm:hover{transform:translateY(-2px)}
/* Onyx odds board: one row per side, Spread / Total / Money columns, every sport */
.gm-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:6px}
.gm.odds .gm-row,.gm-board .gm-row{grid-template-columns:minmax(0,1fr) auto repeat(3,var(--ocw));column-gap:5px}
.gm-row.lose{opacity:.55}
.gm-id{display:flex;align-items:center;gap:9px;min-width:0}
.gm-nm{min-width:0}.gm-nm b{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;font-size:15px;line-height:1.15;hyphens:manual;-webkit-hyphens:manual;word-break:keep-all;overflow-wrap:normal}
.gm.odds .gm-nm b{font-size:14px}
.gm-nm>span{display:block;font:500 10px monospace;color:var(--text3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gm-nm .rk{display:inline;font:700 10px monospace;color:#d795ff;margin:0 4px 0 0}
.gm-row .sc{font:800 20px monospace;min-width:26px;text-align:right}
.gm-row .sc:empty{min-width:0}.gm.odds .gm-row .sc:empty{margin-left:-5px}.gm.odds .lg.m{width:26px;height:26px}
.gm-oh{font:700 9px monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--text3);padding-top:4px}
.gm-oh>span:nth-child(n+3){text-align:center}
.gm-onyx{display:inline-flex;align-items:center;gap:5px;color:#d795ff}.gm-onyx::before{content:"";width:6px;height:6px;border-radius:2px;background:linear-gradient(135deg,#b038f9,#635bff)}
.oc{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;height:44px;padding:0 4px;border-radius:10px;
  border:1px solid rgba(255,255,255,.08);background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.02));color:var(--text);font:inherit;cursor:pointer;
  transition:background .15s,border-color .15s,box-shadow .15s,transform .15s}
.oc b{font:800 14px monospace;letter-spacing:-.02em}.oc i{font:600 10px monospace;font-style:normal;color:var(--text3);white-space:nowrap}
.oc:hover{border-color:#b038f9;background:linear-gradient(135deg,rgba(176,56,249,.32),rgba(99,91,255,.24));box-shadow:0 6px 18px -8px rgba(176,56,249,.8);transform:translateY(-1px)}
.oc:hover i{color:#e9d5ff}
.oc.dead{cursor:default;opacity:.35;background:transparent;border-style:dashed}
.gm-ft{margin-top:auto;padding-top:6px;display:flex;justify-content:space-between;font:700 9px monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--text3)}
.gm:hover .gm-ft b{color:#d795ff}
.gm-flag{width:22px;height:15px;object-fit:cover;border-radius:3px;flex-shrink:0}
.gm-row .sets{display:flex;gap:5px;font:800 15px monospace}.gm-row .sets span{min-width:12px;text-align:center;opacity:.5}.gm-row .sets span.won{opacity:1}
.gm-row .sv{display:inline-block;width:7px;height:7px;border-radius:50%;background:#61e970;box-shadow:0 0 6px #61e970;margin-left:6px;vertical-align:1px}
.gm-board{--ocw:72px;display:flex;flex-direction:column;gap:6px}
.gm-nm .nm-s{display:none}
@media (max-width:440px){.gm{--ocw:54px;padding:11px 11px 9px}.gm.odds .gm-row,.gm-board .gm-row{column-gap:4px}.oc b{font-size:13px}.oc i{font-size:9px}.gm .lg.m{width:22px;height:22px}.gm-id{gap:6px}.gm-nm .nm-f{display:none}.gm-nm .nm-s{display:inline}}
@media (max-width:380px){.gm{--ocw:52px;padding:11px 10px 9px}.oc b{font-size:13px}.gm-nm b{font-size:14px}}
.gm-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font:700 11px monospace;color:var(--text3);text-transform:uppercase;letter-spacing:.05em}
.gm-top>span:first-child{flex-shrink:0}.gm-top>span:last-child{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gm-top .live{color:#61e970}.gm-top .live::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#61e970;margin-right:6px;animation:oxBlink 1.4s infinite}
.chipx{display:inline-flex;flex-direction:column;align-items:center;min-width:64px;padding:5px 8px;border-radius:10px;border:1px solid rgba(255,255,255,.08);background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.02));cursor:pointer;color:var(--text);font:inherit;transition:background .15s,border-color .15s,box-shadow .15s}
.chipx b{font:800 13px monospace}.chipx span{font:700 9px monospace;letter-spacing:.06em;color:var(--text3);text-transform:uppercase}
.chipx:hover{border-color:#b038f9;background:linear-gradient(135deg,rgba(176,56,249,.32),rgba(99,91,255,.24));box-shadow:0 6px 18px -8px rgba(176,56,249,.8)}
.chipx.dead{opacity:.4;cursor:default}
/* gamecenter */
.gc{margin-top:14px;border:1px solid var(--border2);border-radius:18px;background:linear-gradient(180deg,rgba(33,27,37,.6),var(--bg2));padding:16px;scroll-margin-top:120px}
.gc-hd{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
.gc-side{display:flex;align-items:center;gap:10px;min-width:0}.gc-side.h{justify-content:flex-end;text-align:right}
.gc-side b{display:block;font-size:17px}.gc-side span{font:500 11px monospace;color:var(--text3)}
.gc-mid{text-align:center}.gc-mid .sc{font:800 34px monospace;letter-spacing:.02em}
.gc-mid .st{font:700 11px monospace;color:var(--text3);text-transform:uppercase}
.gc-mid .st.live{color:#61e970}
.gc-nav{position:relative;z-index:30;display:flex;align-items:center;gap:8px;margin:-16px -16px 12px;padding:10px 12px;border-radius:18px 18px 0 0;
  background:rgba(17,14,20,.92);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--border2)}
.gc-back{flex-shrink:0;display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;border:1px solid rgba(176,56,249,.5);background:linear-gradient(135deg,rgba(176,56,249,.25),rgba(99,91,255,.18));color:#fff;font:700 12px 'Space Grotesk',system-ui,sans-serif;cursor:pointer}
.gc-back:hover{border-color:#b038f9}
#gcFloat{position:fixed;left:0;right:0;top:0;z-index:950;padding:calc(env(safe-area-inset-top) + 6px) 12px 6px;transform:translateY(-110%);transition:transform .2s;pointer-events:none}
#gcFloat.on{transform:none;pointer-events:auto}
#gcFloat .gc-nav{margin:0 auto;max-width:1148px;border-radius:16px;border:1px solid var(--border2);box-shadow:0 12px 30px -12px rgba(0,0,0,.8)}
.gc-strip{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;min-width:0;flex:1;-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent)}.gc-strip::-webkit-scrollbar{display:none}
.gc-strip button{flex-shrink:0;display:inline-flex;align-items:center;gap:6px;padding:7px 10px;border-radius:10px;border:1px solid var(--border2);background:rgba(255,255,255,.04);color:var(--text2);font:700 11px monospace;cursor:pointer;white-space:nowrap}
.gc-strip button.on{border-color:#b038f9;color:#fff;background:rgba(176,56,249,.18)}
.gc-strip button .lv{width:6px;height:6px;border-radius:50%;background:#61e970;box-shadow:0 0 6px #61e970}
.gc-strip button em{font-style:normal;color:var(--text3);font-weight:600}
.gc-sec{margin-top:16px}.gc-sec h4{margin:0 0 8px;font:800 11px monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--text3)}
.field{position:relative;height:96px;border-radius:12px;overflow:hidden;background:repeating-linear-gradient(90deg,#123d22 0 10%,#14462a 10% 20%);border:1px solid rgba(97,233,112,.25)}
.field .ez{position:absolute;top:0;bottom:0;width:8%;display:flex;align-items:center;justify-content:center;font:800 10px monospace;color:rgba(255,255,255,.75);writing-mode:vertical-rl;text-orientation:mixed;letter-spacing:.2em}
.field .ez.a{left:0}.field .ez.h{right:0}
.field .yl{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.18)}
.field .yl span{position:absolute;bottom:4px;left:3px;font:700 9px monospace;color:rgba(255,255,255,.55)}
.field .los{position:absolute;top:0;bottom:0;width:3px;margin-left:-1.5px;background:#635bff;box-shadow:0 0 10px #635bff}
.field .fd{position:absolute;top:0;bottom:0;width:3px;margin-left:-1.5px;background:#d795ff}
.field .ball{position:absolute;top:50%;width:18px;height:11px;margin:-5.5px 0 0 -9px;border-radius:50%;background:#8a4b22;box-shadow:0 0 0 2px #fff,0 0 16px rgba(255,255,255,.7);transition:left .6s cubic-bezier(.2,.9,.25,1)}
.sit{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;margin-top:8px;font-size:13px}
.sit b{font:800 14px monospace;color:#d795ff}
.plays{display:flex;flex-direction:column;gap:6px;max-height:420px;overflow-y:auto}
.play{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--bg3);border:1px solid var(--border2);font-size:12.5px}
.play .t{font:700 10px monospace;color:var(--text3);white-space:nowrap}
.play .r{font:800 11px monospace;white-space:nowrap}.play .r.td{color:#61e970}.play .r.to{color:#f87171}
.wp{width:100%;height:110px;display:block}
.cmp{display:grid;grid-template-columns:1fr auto 1fr;gap:6px 10px;align-items:center;font-size:12.5px}
.cmp .v{font:700 13px monospace}.cmp .v.h{text-align:right}.cmp .k{text-align:center;font:700 10px monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--text3)}
.cmp .bar{grid-column:1/-1;height:4px;border-radius:2px;background:rgba(255,255,255,.08);display:flex;overflow:hidden;margin-bottom:6px}
.cmp .bar i{background:#635bff}.cmp .bar i+i{background:#b038f9}
.lines-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.ld{background:var(--bg3);border:1px solid var(--border2);border-radius:12px;padding:9px 11px;display:flex;flex-direction:column;gap:2px}
.ld span{font:700 9px monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--text3)}.ld b{font-size:14px}.ld em{font-style:normal;font-size:11px;color:var(--text2)}
.l5-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:8px}
.l5,.inj{background:var(--bg3);border:1px solid var(--border2);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.l5-h{display:flex;align-items:center;gap:6px;font-size:13px}
.l5-r,.inj-r{display:grid;grid-template-columns:auto auto auto 1fr auto;gap:8px;align-items:center;font-size:12.5px}
.inj-r{grid-template-columns:auto auto 1fr}
.l5-r .res{font:800 11px monospace;width:18px;text-align:center}.l5-r .res.w{color:#61e970}.l5-r .res.l{color:#f87171}
.inj-r .st{font:800 9px monospace;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:6px;background:rgba(255,255,255,.06);color:var(--text2);white-space:nowrap}
.inj-r .st.o{background:rgba(248,113,113,.14);color:#f87171}.inj-r .st.d{background:rgba(215,149,255,.14);color:#d795ff}
.pk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:10px}
.pk{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:14px;border:1px solid rgba(176,56,249,.45);background:linear-gradient(160deg,rgba(176,56,249,.12),var(--bg2) 60%)}
.pk-top{display:flex;justify-content:space-between;gap:8px;font:700 10px monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--text3)}
.pk-main{display:flex;align-items:center;gap:10px}.pk-main b{font-size:16px;line-height:1.3}
.pk-nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:6px}
.pk-nums div{background:var(--bg3);border-radius:10px;padding:6px 8px}.pk-nums span{display:block;font:700 9px monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--text3)}.pk-nums b{font:800 14px monospace}
.pk-res{font:800 13px monospace;text-transform:uppercase;letter-spacing:.06em}.pk-res.w{color:#61e970}.pk-res.l{color:#f87171}
/* golf model */
.gm-rk{flex-shrink:0;width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;font:800 11px monospace;background:linear-gradient(135deg,#b038f9,#635bff);color:#fff}
.gw-row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,2fr) auto;column-gap:10px;row-gap:2px;align-items:center;margin:6px 0;font-size:12px}
.gw-row>span{color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gw-bar{position:relative;height:8px;border-radius:5px;background:rgba(255,255,255,.06)}.gw-bar i{position:absolute;inset:0 auto 0 0;border-radius:5px;background:linear-gradient(90deg,#b038f9,#635bff)}
.gw-bar u{position:absolute;top:-3px;bottom:-3px;width:2px;background:#d795ff;border-radius:1px}
.gw-row b{font:800 13px monospace}.gw-row em{grid-column:2/4;font:600 10px monospace;font-style:normal;color:var(--text3)}.gw-row em.up{color:#61e970}.gw-row em.dn{color:#f87171}
.gh2h{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center}
.gh2h select{width:100%;padding:9px 10px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid var(--border2);color:var(--text);font:600 13px 'Space Grotesk',sans-serif}
.gh2h span{font:700 11px monospace;color:var(--text3)}
.gh2h-res{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;margin-top:12px;text-align:center}
.gh2h-res div{padding:8px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--border2)}.gh2h-res b{display:block;font:800 20px monospace}
.gh2h-res span{display:block;font:700 10px monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gfx-model{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;padding:8px 10px;margin-bottom:10px;border-radius:10px;background:rgba(176,56,249,.1);border:1px solid rgba(176,56,249,.35);font:700 12px monospace}
.gfx-model span{font:700 9px monospace;letter-spacing:.12em;text-transform:uppercase;color:#d795ff}.gfx-model em{font-style:normal;color:var(--text3);font-weight:600}
/* tennis + golf */
.tn-ev{margin-bottom:18px}
.tn-m{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:10px 12px;border-radius:12px;border:1px solid var(--border2);background:var(--bg2)}
.tn-p{display:flex;align-items:center;gap:8px;min-width:0;font-size:14px}.tn-p.w b{color:#61e970}
.tn-p img{width:18px;height:12px;object-fit:cover;border-radius:2px}
.tn-p .sv{width:7px;height:7px;border-radius:50%;background:#61e970;box-shadow:0 0 6px #61e970}
.tn-sets{display:flex;gap:4px;justify-content:flex-end;font:800 14px monospace}.tn-sets span{min-width:16px;text-align:center}
.tn-meta{grid-column:1/-1;font:600 10px monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--text3)}
.tn-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:8px}
.gf-flag{width:18px;height:12px;object-fit:cover;border-radius:2px;vertical-align:middle;margin-right:6px}
.gf-pos{font:800 13px monospace;color:var(--text3)}
.gf-par{font:800 14px monospace}.gf-par.u{color:#61e970}.gf-par.o{color:#f87171}
/* hero art */
.sp-art{position:absolute;right:-2%;top:6%;width:min(46vw,520px);height:min(46vw,520px);opacity:.55;pointer-events:none}
@media (max-width:760px){.sp-art{width:72vw;height:72vw;right:-18%;top:0;opacity:.28}}
.lab{border:1px solid rgba(176,56,249,.35);background:linear-gradient(135deg,rgba(176,56,249,.12),rgba(99,91,255,.08));border-radius:16px;padding:16px 18px;margin-bottom:14px}
.lab .eb{font:700 11px monospace;letter-spacing:.14em;text-transform:uppercase;color:#d795ff;margin-bottom:6px}
.lab h3{margin:0 0 6px;font-size:20px}
.lab p{margin:0 0 8px;font-size:13px;line-height:1.6;color:var(--text2)}
.lab ul{margin:6px 0 0;padding-left:18px;font-size:13px;line-height:1.7;color:var(--text2)}
.wblock{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:16px 18px;margin-top:12px}
.wtitle{font-size:13px;font-weight:700;color:var(--text);margin-bottom:10px}
.wbar{display:flex;height:26px;border-radius:7px;overflow:hidden;gap:2px}
.wseg{display:flex;align-items:center;justify-content:center;min-width:34px;font-family:monospace;font-size:11px;font-weight:800;color:#fff}
.wleg{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:11px;color:var(--text3)}
.wleg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.wnote{font-size:12px;line-height:1.6;color:var(--text3);margin-top:10px}
.wrow{display:grid;grid-template-columns:150px 1fr;gap:10px;font-size:12px;line-height:1.6;color:var(--text3);padding:6px 0;border-top:1px solid var(--border)}
.wrow:first-of-type{border-top:none}.wrow b{color:var(--text)}

<script>
// Injected by sports_build.py. `var`, read before any other script line (CLAUDE.md rule 5).
var SD = /*SPORT_DATA*/{}/*END_SPORT_DATA*/;
var ONYX_REFERRER = 'KR680261';
var GA_MEASUREMENT_ID = 'G-03T8V1N52E';
var C = SD.cfg || {};
var KIND = C.kind || 'football';
var TABS = [['home', 'Home'], ['games', 'Games'], ['board', 'Onyx Board'], ['plays', 'Plays'], ['model', 'Model']];
var currentTab = 'home', OPEN_GAME = null, LIVE = {}, LIVE_EV = null;

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'})[c]); }
function fmtOdds(o) { return o == null ? '-' : (o > 0 ? '+' : '') + o; }
function pct(p, d) { return p == null ? '-' : (p * 100).toFixed(d == null ? 0 : d) + '%'; }
function num(v, d) { return v == null || isNaN(v) ? '-' : (+v).toFixed(d == null ? 1 : d); }
function tipTime(iso) { try { return new Date(iso).toLocaleString('en-US', {weekday: 'short', hour: 'numeric', minute: '2-digit', timeZone: 'America/New_York'}) + ' ET'; } catch (e) { return ''; } }
function track(name, params) { try { if (window.gtag) gtag('event', name, Object.assign({sport: SD.sport}, params || {})); } catch (e) {} }
function lg(url, cls) { return url ? `<img class="lg ${cls || ''}" src="${esc(url)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">` : ''; }
function onyxUrl(sel) {
  if (sel) return 'https://app.onyxodds.com/share?selection=' + encodeURIComponent(sel) + '&referrer=' + ONYX_REFERRER;
  return 'https://app.onyxodds.com/' + (C.onyx_league ? 'leagues/' + C.onyx_league : '') + '?utm_source=onyxsports&referrer=' + ONYX_REFERRER;
}
function bet(sel, label) { track('onyx_click', {link_type: sel ? 'single' : 'fallback', selection: label || ''}); window.open(onyxUrl(sel), '_blank', 'noopener'); }
function game(gid) { return (SD.games || []).find(g => g.gid === gid); }

function stateTxt(g) { return g.state === 'in' ? `<span class="live">${esc(g.detail || 'Live')}</span>` : g.state === 'post' ? esc(g.detail || 'Final') : esc(tipTime(g.start)); }

// ── odds chips (SD.odds from sports_odds.py: Onyx prices, labelled Onyx) ──
function gameOdds(gid) { return ((SD.odds || {}).games || {})[gid] || null; }
function chip(price, label, sel, sub) {
  if (price == null) return `<span class="chipx dead"><b>-</b><span>${esc(sub || label)}</span></span>`;
  return `<button class="chipx" onclick="event.stopPropagation();bet(${sel ? `'${esc(sel)}'` : 'null'},'${esc(label)}')"><b>${fmtOdds(price)}</b><span>${esc(sub || label)}</span></button>`;

const sgn = v => (v > 0 ? '+' : '') + v;
// one odds cell: the line on top (spread / total), the Onyx price below
function oc(price, line, label, sel) {

// Spread / Total / Money for one side of a game (away row carries the Over, home the Under)
function gameCells(g, side) {

  const nm = g[side], sp = o[side + '_spread'], ov = side === 'away';

    o.total != null ? oc(ov ? o.over_price : o.under_price, (ov ? 'O ' : 'U ') + o.total, (ov ? 'Over ' : 'Under ') + o.total, ov ? o.over_sel : o.under_sel) : oc(null, ''),

// the board: an "Onyx" header row, then one row per side; rows = [{id, sc, cells, lose}]

}
function gameBoard(g) {
  const b = oddsRows(['away', 'home'].map(sd => ({id: teamId(g, sd, true), cells: gameCells(g, sd)})));

}

      sg(`${st('live', 'LIVE')}<span class="score-team">${esc(m.p[0].short || m.p[0].name)}</span><span class="score-num">${m.p[0].sets.join(' ')}</span><span class="score-sep">|</span><span class="score-team">${esc(m.p[1].short || m.p[1].name)}</span><span class="score-num">${m.p[1].sets.join(' ')}</span>`, "gotoTab('games')")))

// ── games + gamecenter ─────────────────────────────────────────────

  const b = oddsRows(['away', 'home'].map(sd => ({id: teamId(g, sd), sc: g.state !== 'pre' ? esc(g[sd + '_score']) : '',
    cells: gameCells(g, sd), lose: fin && (sd === 'away' ? !aw : aw)})));
  return `<div class="gm${b.odds ? ' odds' : ''}${OPEN_GAME === g.gid ? ' sel' : ''}" onclick="openGame('${g.gid}')" tabindex="0" onkeydown="if(event.key==='Enter')openGame('${g.gid}')">

    <div class="gm-ft"><span>${b.odds ? 'Tap a price to bet on Onyx' : g.state === 'pre' ? 'Lines post on Onyx soon' : g.state === 'in' ? 'Follow it live in the gamecenter' : ''}</span><b>Gamecenter ›</b></div>
  </div>`;
}
var GFILTER = 'all';
function renderGames() {

  if (KIND === 'tennis') { el.innerHTML = `<div id="ypGames">${yourPlayers()}</div><div id="gcBox">${OPEN_MATCH ? matchCenter(OPEN_MATCH) : ''}</div>` + tnAll(); gcFloatSync(); return; }
  if (KIND === 'golf') { el.innerHTML = `<div id="ypGames">${yourPlayers()}</div>` + gfAll(); return; }
  const games = (SD.games || []).map(live);
  const segs = [['all', 'All'], ['in', 'Live'], ['pre', 'Upcoming'], ['post', 'Final']];

function openGame(gid) {

// gamecenter nav: back to the scoreboard, or straight to another game
function gcBack() {

  if (el) el.scrollIntoView({behavior: 'smooth', block: 'start'});
}
function gcNav(items, cur, back) {

    `<button class="${x.id === cur ? 'on' : ''}" onclick="${x.go}">${x.live ? '<i class="lv"></i>' : ''}${x.t}</button>`).join('')}</div></div>`;

// the shared stylesheet clips the body sideways, which breaks position:sticky, so a copy

function gcFloatSync() {

  const n = document.querySelector('#gc > .gc-nav'), gc = document.getElementById('gc');
  if (!n || !gc) { if (f) f.classList.remove('on'); return; }
  if (!f) { f = document.createElement('div'); f.id = 'gcFloat'; document.body.appendChild(f); }
  if (f.dataset.src !== n.innerHTML) { f.innerHTML = '<div class="gc-nav">' + n.innerHTML + '</div>'; f.dataset.src = n.innerHTML;
    const on = f.querySelector('.gc-strip .on'); if (on) on.parentNode.scrollLeft = on.offsetLeft - 60; }

addEventListener('scroll', gcFloatSync, {passive: true});
// card names never split mid-word (iOS hyphenated "Sacramen-to"): a name whose longest

function fitNames(root) {
  (root || document).querySelectorAll('.gm-nm b').forEach(b => {
    if (!b.clientWidth) return;
    b.style.fontSize = '';
    let fs = parseFloat(getComputedStyle(b).fontSize);
    while (b.scrollWidth > b.clientWidth + 1 && fs > 11) { fs -= 0.5; b.style.fontSize = fs + 'px'; }
  });
}
var _fitRaf = 0;
new MutationObserver(() => { cancelAnimationFrame(_fitRaf); _fitRaf = requestAnimationFrame(() => fitNames()); }).observe(document.documentElement, {childList: true, subtree: true});
addEventListener('resize', () => { cancelAnimationFrame(_fitRaf); _fitRaf = requestAnimationFrame(() => fitNames()); });
function gameNav(cur) {
  const order = g => g.state === 'in' ? 0 : g.state === 'pre' ? 1 : 2;
  const gs = (SD.games || []).map(live).sort((a, b) => order(a) - order(b) || String(a.start || '').localeCompare(String(b.start || '')));
  return gcNav(gs.map(g => ({id: g.gid, live: g.state === 'in', go: `openGame('${esc(g.gid)}')`,
    t: g.state === 'pre' ? `${esc(g.away)} @ ${esc(g.home)} <em>${esc(tipTime(g.start).replace(/ ET$/, ''))}</em>` : `${esc(g.away)} ${esc(g.away_score)}-${esc(g.home_score)} ${esc(g.home)}${g.state === 'post' ? ' <em>F</em>' : ''}`})), cur, 'Scoreboard');
}
var GC_CACHE = {};

  const g = live(game(gid) || {});
  const head = `<div class="gc-hd">
    <div class="gc-side">${lg(g.away_logo, 'l')}<div><b>${esc(g.away_name || g.away)}</b><span>${esc(g.away_rec || '')}</span></div></div>
    <div class="gc-mid"><div class="sc">${g.state === 'pre' ? 'vs' : esc(g.away_score) + ' - ' + esc(g.home_score)}</div><div class="st ${g.state === 'in' ? 'live' : ''}">${stateTxt(g)}</div></div>
    <div class="gc-side h"><div><b>${esc(g.home_name || g.home)}</b><span>${esc(g.home_rec || '')}</span></div>${lg(g.home_logo, 'l')}</div>

  const s = GC_CACHE[gid];

    ${((SD.model || {}).td || []).some(r => r.gid === g.gid) ? `<div class="gc-sec">${tdTable(SD.model.td.filter(r => r.gid === g.gid).slice(0, 14), 'Touchdown scorers')}</div>` : ''}
    <div class="gc-sec" style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn-primary" onclick="bet(null,'game ${esc(g.away)} @ ${esc(g.home)}')">⚡ Bet this game on Onyx</button>
      <button class="btn-secondary" onclick="OPEN_GAME=null;renderGames()">Close</button></div>
    <div id="gcDetail">${s ? gcDetail(s, g) : '<div class="empty">Loading the gamecenter…</div>'}</div></div>`;

var _gcTimer = null;
function loadSummary(gid) {

  clearTimeout(_gcTimer); _gcTimer = null;
  fetch('https://site.api.espn.com/apis/site/v2/sports/' + C.espn[0] + '/summary?event=' + gid)
    .then(r => r.json()).then(j => {
      GC_CACHE[gid] = j;
      const el = document.getElementById('gcDetail');
      ypAlerts();
      if (el && OPEN_GAME === gid) el.innerHTML = gcDetail(j, live(game(gid)));
      ['ypHome', 'ypGames'].forEach(i => { const y = document.getElementById(i); if (y) y.innerHTML = yourPlayers(); });
      // the open live game refreshes on its own every 6s, between scoreboard polls
      if (OPEN_GAME === gid && live(game(gid) || {}).state === 'in' && !document.hidden) _gcTimer = setTimeout(() => loadSummary(gid), 6000);
    }).catch(() => {
      const el = document.getElementById('gcDetail');
      if (el && OPEN_GAME === gid) el.innerHTML = '<div class="empty">Live feed unavailable, retrying shortly.</div>';
    });
}
function teamStatsCmp(s, g) {
  const T = (s.boxscore || {}).teams || [];

        (j.events || []).forEach(e => (e.groupings || []).forEach(gr => (gr.competitions || []).forEach(c => {
          (SD.events || []).forEach(ev => ev.matches.forEach(m => {
            if (m.id !== c.id) return;
            const st = (c.status || {}).type || {};
            m.state = st.state; m.detail = st.shortDetail || st.detail;
            (c.competitors || []).forEach((p, i) => { if (m.p[i]) { m.p[i].sets = (p.linescores || []).map(l => +l.value || 0); m.p[i].win = !!p.winner; m.p[i].serve = !!p.possession; } });
            if (m.state === 'in') anyLive = true;
          }));
        })));
      } else if (KIND === 'golf') {
        (j.events || []).forEach(e => {
          const ev = (SD.events || []).find(x => x.id === e.id); if (!ev) return;
          const c = (e.competitions || [{}])[0];
          ev.board = gfParse(c);
          ev.state = ((e.status || {}).type || {}).state; ev.detail = ((e.status || {}).type || {}).shortDetail;
          if (ev.state === 'in') anyLive = true;
        });
      }
    });
    if (KIND === 'golf') { gfAlerts(); ['ypHome', 'ypGames'].forEach(i => { const y = document.getElementById(i); if (y) y.innerHTML = yourPlayers(); }); }
    if (KIND === 'tennis') { tnAlerts(); ['ypHome', 'ypGames'].forEach(i => { const y = document.getElementById(i); if (y) y.innerHTML = yourPlayers(); }); }
    ticker();
    if (currentTab === 'games' && !(document.activeElement && document.activeElement.tagName === 'INPUT')) {
      if (KIND === 'football' || KIND === 'hockey') { if (OPEN_GAME) { drawGame(OPEN_GAME); } else renderGames(); } else renderGames();
    } else if (currentTab === 'home') renderHome();
    clearTimeout(_poll); _poll = setTimeout(pollLive, anyLive ? 10000 : 30000);
  });
}
// search (ui.js): teams and players on this page
window.OX_SEARCH = function (go) {
  const out = [];
  (SD.games || []).forEach(g => out.push({label: `${g.away_name || g.away} @ ${g.home_name || g.home}`, sub: tipTime(g.start), run: () => openGame(g.gid)}));
  ((SD.model || {}).rows || []).slice(0, 300).forEach(r => out.push({label: r.name, sub: `${r.team} · ${MKT_NAME[r.mkt] || r.mkt} ${num(r.proj)}`, run: () => { go('plays'); }}));
  (SD.events || []).forEach(e => (e.board || []).slice(0, 150).forEach(r => out.push({label: r.name, sub: `${e.name} · ${r.pos} · ${r.to_par}`, run: () => { GQ = String(r.name).toLowerCase(); go('games'); }})));
  return out;
};

function initAnalytics() {
  if (!GA_MEASUREMENT_ID || location.protocol !== 'https:') return;
  window.dataLayer = window.dataLayer || [];
  window.gtag = function () { dataLayer.push(arguments); };
  gtag('js', new Date()); gtag('config', GA_MEASUREMENT_ID);
  const s = document.createElement('script'); s.async = true; s.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA_MEASUREMENT_ID; document.head.appendChild(s);
}
RENDER = {home: renderHome, games: renderGames, board: renderBoard, plays: renderPlays, model: renderModel};
(function boot() {
  buildNav(); ticker(); initAnalytics();
  const art = document.getElementById('heroArt');
  if (art) { art.dataset.oxArt = C.art || 'field'; art.dataset.oxTone = C.tone || 'purple'; art.dataset.oxFade = '0'; }
  const h = (location.hash || '').replace('#', '').split(':');
  if (h[0] === 'games' && h[1]) OPEN_GAME = h[1];
  gotoTab(RENDER[h[0]] ? h[0] : 'home');
  pollLive();
  setTimeout(ypLoop, 2500);
  if ('serviceWorker' in navigator && location.protocol === 'https:') addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
})();
</script>
