<!-- sport_shell.html: one template for every Onyx Sports page beyond MLB and
     NBA (NFL, college football, NHL, tennis, golf). sports_build.py injects
     the MLB stylesheet (one design system), the sport's data and its key. -->
<style>/*MLB_CSS*/</style>
<style>
.sp-wrap{max-width:1180px;margin:0 auto;padding:16px 16px 120px}
.sec-hdr{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:22px 0 12px}
.sec-count{font-size:12px;color:var(--text3);font-family:monospace}
.empty{padding:26px 18px;border:1px dashed var(--border2);border-radius:14px;text-align:center;color:var(--text3);font-size:13px;line-height:1.6}
.tbl{overflow-x:auto;border:1px solid var(--border2);border-radius:14px;background:var(--bg2)}
.tbl table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}
.gc .tbl table{min-width:440px}
.tbl th{padding:9px 10px;text-align:left;font:700 10px monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);border-bottom:1px solid var(--border2);white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .r{text-align:right}.mono{font-family:monospace}.dim{color:var(--text3)}
.tbl tr.tap{cursor:pointer}.tbl tr.tap:hover td{background:rgba(176,56,249,.06)}
.lg{width:22px;height:22px;object-fit:contain;vertical-align:middle;flex-shrink:0}
.lg.l{width:46px;height:46px}.lg.m{width:30px;height:30px}
.sp-tabs-seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:12px}.sp-tabs-seg::-webkit-scrollbar{display:none}
.sp-tabs-seg button{flex-shrink:0;padding:8px 13px;border-radius:999px;border:1px solid var(--border2);background:rgba(255,255,255,.04);color:var(--text2);font:700 12px 'Space Grotesk',system-ui,sans-serif;cursor:pointer;white-space:nowrap}
.sp-tabs-seg button.on{background:linear-gradient(135deg,#b038f9,#635bff);color:#fff;border-color:transparent}
/* game cards */
.gm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:10px}
.gm{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border-radius:14px;border:1px solid var(--border2);background:var(--bg2);cursor:pointer;color:var(--text);text-align:left;font:inherit;transition:border-color .2s,transform .2s}
.gm:hover,.gm.sel{border-color:rgba(176,56,249,.6)}.gm:hover{transform:translateY(-2px)}
.gm-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font:700 11px monospace;color:var(--text3);text-transform:uppercase;letter-spacing:.05em}
.gm-top .live{color:#61e970}.gm-top .live::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#61e970;margin-right:6px;animation:oxBlink 1.4s infinite}
.gm-t{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px}
.gm-t b{font-size:15px}.gm-t .rec{font:500 11px monospace;color:var(--text3);margin-left:6px}
.gm-t .sc{font:800 20px monospace}.gm-t.lose{opacity:.55}
.gm-t .rk{font:700 10px monospace;color:#d795ff;margin-right:4px}
.gm-lines{display:flex;gap:6px;flex-wrap:wrap}
.chipx{display:inline-flex;flex-direction:column;align-items:center;min-width:64px;padding:5px 8px;border-radius:10px;border:1px solid var(--border2);background:rgba(255,255,255,.03);cursor:pointer;color:var(--text);font:inherit}
.chipx b{font:800 13px monospace}.chipx span{font:700 9px monospace;letter-spacing:.06em;color:var(--text3);text-transform:uppercase}
.chipx:hover{border-color:#b038f9}
.chipx.dead{opacity:.4;cursor:default}
/* gamecenter */
.gc{margin-top:14px;border:1px solid var(--border2);border-radius:18px;background:linear-gradient(180deg,rgba(33,27,37,.6),var(--bg2));padding:16px;scroll-margin-top:120px}
.gc-hd{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
.gc-side{display:flex;align-items:center;gap:10px;min-width:0}.gc-side.h{justify-content:flex-end;text-align:right}
.gc-side b{display:block;font-size:17px}.gc-side span{font:500 11px monospace;color:var(--text3)}
.gc-mid{text-align:center}.gc-mid .sc{font:800 34px monospace;letter-spacing:.02em}
.gc-mid .st{font:700 11px monospace;color:var(--text3);text-transform:uppercase}
.gc-mid .st.live{color:#61e970}
.gc-sec{margin-top:16px}.gc-sec h4{margin:0 0 8px;font:800 11px monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--text3)}
.field{position:relative;height:96px;border-radius:12px;overflow:hidden;background:repeating-linear-gradient(90deg,#123d22 0 10%,#14462a 10% 20%);border:1px solid rgba(97,233,112,.25)}
.field .ez{position:absolute;top:0;bottom:0;width:8%;display:flex;align-items:center;justify-content:center;font:800 10px monospace;color:rgba(255,255,255,.75);writing-mode:vertical-rl;text-orientation:mixed;letter-spacing:.2em}
.field .ez.a{left:0}.field .ez.h{right:0}
.field .yl{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.18)}
.field .yl span{position:absolute;bottom:4px;left:3px;font:700 9px monospace;color:rgba(255,255,255,.55)}
.field .los{position:absolute;top:0;bottom:0;width:3px;margin-left:-1.5px;background:#635bff;box-shadow:0 0 10px #635bff}
.field .fd{position:absolute;top:0;bottom:0;width:3px;margin-left:-1.5px;background:#d795ff}
.field .ball{position:absolute;top:50%;width:18px;height:11px;margin:-5.5px 0 0 -9px;border-radius:50%;background:#8a4b22;box-shadow:0 0 0 2px #fff,0 0 16px rgba(255,255,255,.7);transition:left .6s cubic-bezier(.2,.9,.25,1)}
.sit{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;margin-top:8px;font-size:13px}
.sit b{font:800 14px monospace;color:#d795ff}
.plays{display:flex;flex-direction:column;gap:6px;max-height:420px;overflow-y:auto}
.play{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--bg3);border:1px solid var(--border2);font-size:12.5px}
.play .t{font:700 10px monospace;color:var(--text3);white-space:nowrap}
.play .r{font:800 11px monospace;white-space:nowrap}.play .r.td{color:#61e970}.play .r.to{color:#f87171}
.wp{width:100%;height:110px;display:block}
.cmp{display:grid;grid-template-columns:1fr auto 1fr;gap:6px 10px;align-items:center;font-size:12.5px}
.cmp .v{font:700 13px monospace}.cmp .v.h{text-align:right}.cmp .k{text-align:center;font:700 10px monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--text3)}
.cmp .bar{grid-column:1/-1;height:4px;border-radius:2px;background:rgba(255,255,255,.08);display:flex;overflow:hidden;margin-bottom:6px}
.cmp .bar i{background:#635bff}.cmp .bar i+i{background:#b038f9}
.lines-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.ld{background:var(--bg3);border:1px solid var(--border2);border-radius:12px;padding:9px 11px;display:flex;flex-direction:column;gap:2px}
.ld span{font:700 9px monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--text3)}.ld b{font-size:14px}.ld em{font-style:normal;font-size:11px;color:var(--text2)}
.l5-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:8px}
.l5,.inj{background:var(--bg3);border:1px solid var(--border2);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.l5-h{display:flex;align-items:center;gap:6px;font-size:13px}
.l5-r,.inj-r{display:grid;grid-template-columns:auto auto auto 1fr auto;gap:8px;align-items:center;font-size:12.5px}
.inj-r{grid-template-columns:auto auto 1fr}
.l5-r .res{font:800 11px monospace;width:18px;text-align:center}.l5-r .res.w{color:#61e970}.l5-r .res.l{color:#f87171}
.inj-r .st{font:800 9px monospace;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:6px;background:rgba(255,255,255,.06);color:var(--text2);white-space:nowrap}
.inj-r .st.o{background:rgba(248,113,113,.14);color:#f87171}.inj-r .st.d{background:rgba(215,149,255,.14);color:#d795ff}
.pk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:10px}
.pk{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:14px;border:1px solid rgba(176,56,249,.45);background:linear-gradient(160deg,rgba(176,56,249,.12),var(--bg2) 60%)}
.pk-top{display:flex;justify-content:space-between;gap:8px;font:700 10px monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--text3)}
.pk-main{display:flex;align-items:center;gap:10px}.pk-main b{font-size:16px;line-height:1.3}
.pk-nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:6px}
.pk-nums div{background:var(--bg3);border-radius:10px;padding:6px 8px}.pk-nums span{display:block;font:700 9px monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--text3)}.pk-nums b{font:800 14px monospace}
.pk-res{font:800 13px monospace;text-transform:uppercase;letter-spacing:.06em}.pk-res.w{color:#61e970}.pk-res.l{color:#f87171}
/* tennis + golf */
.tn-ev{margin-bottom:18px}
.tn-m{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:10px 12px;border-radius:12px;border:1px solid var(--border2);background:var(--bg2)}
.tn-p{display:flex;align-items:center;gap:8px;min-width:0;font-size:14px}.tn-p.w b{color:#61e970}
.tn-p img{width:18px;height:12px;object-fit:cover;border-radius:2px}
.tn-p .sv{width:7px;height:7px;border-radius:50%;background:#61e970;box-shadow:0 0 6px #61e970}
.tn-sets{display:flex;gap:4px;justify-content:flex-end;font:800 14px monospace}.tn-sets span{min-width:16px;text-align:center}
.tn-meta{grid-column:1/-1;font:600 10px monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--text3)}
.tn-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:8px}
.gf-flag{width:18px;height:12px;object-fit:cover;border-radius:2px;vertical-align:middle;margin-right:6px}
.gf-pos{font:800 13px monospace;color:var(--text3)}
.gf-par{font:800 14px monospace}.gf-par.u{color:#61e970}.gf-par.o{color:#f87171}
/* hero art */
.sp-art{position:absolute;right:-2%;top:6%;width:min(46vw,520px);height:min(46vw,520px);opacity:.55;pointer-events:none}
@media (max-width:760px){.sp-art{width:72vw;height:72vw;right:-18%;top:0;opacity:.28}}
.lab{border:1px solid rgba(176,56,249,.35);background:linear-gradient(135deg,rgba(176,56,249,.12),rgba(99,91,255,.08));border-radius:16px;padding:16px 18px;margin-bottom:14px}
.lab .eb{font:700 11px monospace;letter-spacing:.14em;text-transform:uppercase;color:#d795ff;margin-bottom:6px}
.lab h3{margin:0 0 6px;font-size:20px}
.lab p{margin:0 0 8px;font-size:13px;line-height:1.6;color:var(--text2)}
.lab ul{margin:6px 0 0;padding-left:18px;font-size:13px;line-height:1.7;color:var(--text2)}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:10px 0}
.stat-grid>div{background:var(--bg3);border:1px solid var(--border2);border-radius:12px;padding:10px 12px}
.stat-grid>div>span{display:block;font:700 9px monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--text3)}
.stat-grid b{font:800 18px monospace}
.lean-o{color:#b038f9}.lean-u{color:#9b96ff}
.edge-pos{color:#61e970}.edge-neg{color:var(--text3)}
@media (max-width:560px){.gc-mid .sc{font-size:26px}.gc-side b{font-size:14px}.gc-hd .lg.l{width:34px;height:34px}}
.mc-top{display:flex;justify-content:space-between;gap:8px;font:700 10px monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);margin-bottom:10px}
.mc-top .live{color:#61e970}
.mc-p{display:grid;grid-template-columns:24px minmax(0,1fr) 10px auto 26px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border2)}
.mc-p img{width:22px;height:15px;object-fit:cover;border-radius:2px}
.mc-nm{min-width:0}.mc-nm b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mc-nm span{font:600 10px monospace;color:var(--text3)}
.mc-p.w .mc-nm b{color:#61e970}
.mc-p .sv{width:8px;height:8px;border-radius:50%;background:#61e970;box-shadow:0 0 8px #61e970}
.mc-sets{display:flex;gap:6px;font:800 18px monospace}.mc-sets span{min-width:14px;text-align:center;opacity:.55}.mc-sets span.won{opacity:1}
.mc-sw{font:800 20px monospace;text-align:right;color:#d795ff}
.mc-form{background:var(--bg3);border:1px solid var(--border2);border-radius:12px;padding:10px 12px;font-size:12px;line-height:1.7}
.mc-form b{display:block;font:800 10px monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--text3)}
.mc-form .r{font:800 11px monospace}.mc-form .r.w{color:#61e970}.mc-form .r.l{color:#f87171}
.tn-m.sel{border-color:#b038f9}
.gf-tbl{min-width:0!important}.gf-tbl td,.gf-tbl th{padding:8px 6px}
.gf-hd{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:10px;align-items:center;margin-bottom:10px}
.gf-hd img{width:24px;height:16px;object-fit:cover;border-radius:2px}.gf-hd b{display:block;font-size:18px}.gf-hd span{font:600 11px monospace;color:var(--text3)}
.gf-st{display:flex;gap:6px}.gf-st div{background:var(--bg3);border:1px solid var(--border2);border-radius:10px;padding:5px 9px;text-align:center}
.gf-st span{display:block;font:700 9px monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--text3)}.gf-st b{font:800 16px monospace}
.sc-rd{margin-top:12px}.sc-rh{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:5px}.sc-rh b{font:800 11px monospace;letter-spacing:.08em;text-transform:uppercase}.sc-rh span{font:600 10px monospace;color:var(--text3)}
.sc-row{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:3px;margin-bottom:3px}
.sc-h{border-radius:7px;border:1px solid var(--border2);text-align:center;padding:2px 0;background:rgba(255,255,255,.03);min-width:0}
.sc-h span{display:block;font:600 8px monospace;color:var(--text3)}.sc-h b{display:block;font:800 13px monospace;min-height:16px}
.sc-h.eg{background:#b038f9;border-color:#b038f9}.sc-h.eg b,.sc-h.eg span{color:#fff}
.sc-h.bd{background:rgba(97,233,112,.18);border-color:rgba(97,233,112,.6)}.sc-h.bd b{color:#61e970}
.sc-h.bg{background:rgba(248,113,113,.12);border-color:rgba(248,113,113,.45)}.sc-h.bg b{color:#f87171}
.sc-h.db{background:rgba(248,113,113,.28);border-color:#f87171}.sc-h.db b{color:#fff}
.sc-h.na{opacity:.35}
.sc-key{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font:600 10px monospace;color:var(--text3);margin-top:8px}.sc-key .sc-h{display:inline-block;width:12px;height:12px;padding:0}
.gf-car{display:inline-block;margin-left:4px;font-size:9px;color:var(--text3)}
.gf-x td{padding:0!important;background:rgba(176,56,249,.05)}
.gfx{padding:12px 10px 14px;border-top:1px solid rgba(176,56,249,.35)}
.gfx-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.gfx-cap{font:600 10px monospace;color:var(--text3);margin:8px 0 6px}
.gh-row{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:4px;margin-bottom:4px}
.gh{border-radius:8px;border:1px solid var(--border2);background:#11161a;text-align:center;overflow:hidden}
.gh svg{display:block;width:100%;height:auto}
.gh .fw{fill:none;stroke:#1f5133;stroke-width:9;stroke-linecap:round}
.gh .tee{fill:#2b6b45}.gh .gr{fill:#2f8f55}.gh .pin{stroke:#fff;stroke-width:1.2}
.gh text{font:800 9px monospace;fill:#fff;text-anchor:middle}
.gh span{display:block;font:700 9px monospace;color:var(--text3);padding:1px 0 2px}.gh span i{font-style:normal;margin-left:2px;opacity:.6}
.gh.eg{border-color:#b038f9}.gh.eg .gr{fill:#b038f9}
.gh.bd{border-color:rgba(97,233,112,.7)}.gh.bd .gr{fill:#3fbf5a}
.gh.bg{border-color:rgba(248,113,113,.55)}.gh.bg .gr{fill:#b84a4a}
.gh.db{border-color:#f87171}.gh.db .gr{fill:#d03030}
.gh.na{opacity:.45}.gh.na .gr{fill:#2a3a30}
/* live tracker (football + hockey) */
.bx{width:100%;border-collapse:collapse;table-layout:fixed;font:600 12px monospace;font-variant-numeric:tabular-nums}
.bx th{font:700 9px monospace;letter-spacing:.06em;color:var(--text3);padding:6px 2px;text-align:center;border-bottom:1px solid var(--border2)}
.bx td{padding:7px 2px;text-align:center;border-bottom:1px solid rgba(255,255,255,.05);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bx th:first-child,.bx td:first-child{text-align:left;padding-left:2px}
.bx td.nm{font:700 12px 'Space Grotesk',system-ui,sans-serif;color:var(--text)}
.bx td.nm i{display:inline-block;width:5px;height:5px;border-radius:50%;background:#61e970;margin-right:5px;vertical-align:2px;box-shadow:0 0 6px #61e970}
.bx td.nm em{font-style:normal;color:#d795ff;margin-left:3px}
.bx tr.tap{cursor:pointer}.bx tr.tap:hover td{background:rgba(176,56,249,.06)}.bx tr.sel td{background:rgba(176,56,249,.14)}
.bx tr.tot td{font-weight:800;color:var(--text2);border-bottom:0}
.bx-cap{font:800 10px monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin:12px 0 4px}
.bx-team{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13px;margin:4px 0 2px}
.bx-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:14px}
.fx{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-bottom:10px}
.fx div{background:var(--bg3);border:1px solid var(--border2);border-radius:10px;padding:7px 8px}
.fx span{display:block;font:700 9px monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fx b{font:800 16px monospace}.fx small{display:block;font:600 10px monospace;color:var(--text3)}
.fx .win{border-color:rgba(97,233,112,.55)}.fx .win b{color:#61e970}.fx .loss b{color:#f87171}.fx .pend b{color:#d795ff}
.fl-btn{background:none;border:1px solid var(--border2);border-radius:999px;color:var(--text2);font:700 11px monospace;padding:6px 11px;cursor:pointer;white-space:nowrap}
.fl-btn.on{border-color:#b038f9;color:#d795ff;background:rgba(176,56,249,.12)}
.yp{border:1px solid rgba(176,56,249,.45);border-radius:16px;background:linear-gradient(160deg,rgba(176,56,249,.14),var(--bg2) 60%);padding:12px;margin:0 0 14px}
.yp-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.yp-h b{font:800 11px monospace;letter-spacing:.12em;text-transform:uppercase;color:#d795ff}.yp-h span{font:600 10px monospace;color:var(--text3)}
.yp-list{display:flex;flex-direction:column;gap:8px}
.yp-p{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px;border-radius:12px;background:var(--bg3);border:1px solid var(--border2);cursor:pointer}
.yp-p img{width:40px;height:40px;border-radius:50%;object-fit:cover;object-position:50% 15%;background:var(--bg2)}
.yp-who{min-width:0}.yp-who b{display:block;font-size:15px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.yp-who span{display:block;font:600 10px monospace;color:var(--text3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.yp-who span.live{color:#61e970}
.yp-p .x{background:none;border:0;color:var(--text3);font:800 14px monospace;cursor:pointer;padding:4px}
.yp-legs{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:6px}
.yp-leg{padding:6px 8px;border-radius:10px;background:rgba(255,255,255,.03);border:1px solid var(--border2)}
.yp-leg .t{display:flex;justify-content:space-between;gap:6px;font:700 10px monospace;color:var(--text3)}
.yp-leg .t em{font-style:normal;color:#d795ff;white-space:nowrap}
.yp-leg .v{font:800 16px monospace}.yp-leg .v small{font:600 10px monospace;color:var(--text3);margin-left:4px}
.yp-bar{position:relative;height:5px;border-radius:3px;background:rgba(255,255,255,.08);margin-top:5px;overflow:hidden}
.yp-bar i{position:absolute;left:0;top:0;bottom:0;background:#d795ff;border-radius:3px;transition:width .6s ease}
.yp-bar u{position:absolute;top:-2px;bottom:-2px;width:2px;background:#fff;opacity:.7}
.yp-leg.win{border-color:rgba(97,233,112,.55)}.yp-leg.win .v,.yp-leg.win .t em{color:#61e970}.yp-leg.win .yp-bar i{background:#61e970}
.yp-leg.loss{border-color:rgba(248,113,113,.5)}.yp-leg.loss .v{color:#f87171}.yp-leg.loss .yp-bar i{background:#f87171}
.yp-leg.bump{animation:ypBump .9s ease}@keyframes ypBump{0%{box-shadow:0 0 0 0 rgba(176,56,249,.7)}100%{box-shadow:0 0 0 10px rgba(176,56,249,0)}}
.play.tap{cursor:pointer}.play.tap:hover{border-color:rgba(176,56,249,.55)}.play.on{border-color:#b038f9;background:rgba(176,56,249,.14)}
.play .see{font:700 9px monospace;color:#d795ff;letter-spacing:.06em;white-space:nowrap}
.field .arr{position:absolute;top:50%;height:4px;margin-top:-2px;background:linear-gradient(90deg,rgba(215,149,255,.2),#d795ff);border-radius:2px;box-shadow:0 0 10px rgba(215,149,255,.6)}
.field .arr.neg{background:linear-gradient(90deg,#f87171,rgba(248,113,113,.2))}
.field .pt{position:absolute;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:#fff}
.rink{width:100%;height:auto;display:block;border-radius:14px;background:#f2f4f8}
.rink .ln{fill:none;stroke-width:.6}
.rink .tok{transition:transform .9s cubic-bezier(.2,.9,.25,1)}
.rink .tok text{font:800 3.4px monospace;fill:#fff;text-anchor:middle;dominant-baseline:central}
.rink .pick{fill:none;stroke:#0c0c0c;stroke-width:.7;animation:rkPulse 1.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes rkPulse{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(2.6)}}
.sc-chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0 10px}.sc-chips::-webkit-scrollbar{display:none}
.sc-chips button{flex-shrink:0;padding:6px 10px;border-radius:999px;border:1px solid var(--border2);background:rgba(255,255,255,.03);color:var(--text2);font:700 11px monospace;cursor:pointer;white-space:nowrap}
.sc-chips button.on{border-color:#b038f9;background:rgba(176,56,249,.2);color:#fff}
.play-sel{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:rgba(176,56,249,.14);border:1px solid rgba(176,56,249,.5);margin:8px 0;font-size:13px;line-height:1.45}
.play-sel b{font:800 10px monospace;letter-spacing:.08em;color:#d795ff;display:block}
.play-sel button{margin-left:auto;background:none;border:0;color:var(--text3);font:800 16px monospace;cursor:pointer}
.gc-sub{display:flex;gap:6px;margin:14px 0 4px}.gc-sub button{flex:1;min-width:0;padding:8px 6px;border-radius:999px;border:1px solid var(--border2);background:rgba(255,255,255,.03);color:var(--text2);font:700 11px monospace;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;white-space:nowrap}
.gc-sub button.on{background:linear-gradient(135deg,#b038f9,#635bff);color:#fff;border-color:transparent}
@media (max-width:560px){
  .gc-hd{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"a as" "h hs" "st st";row-gap:8px}
  .gc-hd .gc-side{grid-area:a}.gc-hd .gc-side.h{grid-area:h;flex-direction:row-reverse;justify-content:flex-end;text-align:left}
  .gc-hd .gc-mid{display:contents}.gc-hd .gc-mid .st{grid-area:st;text-align:left;border-top:1px solid var(--border2);padding-top:8px}
  .gc-hd .ssc{display:block;font:800 30px monospace;text-align:right}.gc-hd .ssc.a{grid-area:as}.gc-hd .ssc.h{grid-area:hs}.gc-hd .gc-mid .sc{display:none}
  .gc-hd .gc-side b{font-size:16px}}
.gc-hd .ssc{display:none}
</style>
<link rel="stylesheet" href="onyx.css"><script src="onyx.js" defer></script>
</head>
<body>
<nav class="nav">
  <a class="nav-logo" href="#" onclick="gotoTab('home');return false">
    <svg class="logo-svg" viewBox="0 0 64 64" aria-label="Onyx"><rect x="2" y="2" width="60" height="60" rx="16" fill="#151018" stroke="rgba(176,56,249,.6)" stroke-width="2"/>
      <g transform="translate(19,13) scale(0.26)"><path fill="#b038f9" d="m39.041 109.178 18.493 9.863-33.972 17.945L0 124.384v-84.11l39.041-20.411zm21.918-81.37-18.493-9.863L76.438 0 100 12.603v84.246L60.959 117.26z"/></g></svg>
    <div class="logo-words"><div class="logo-onyx">ONYX</div><div class="logo-sub" id="logoSub"></div></div>
  </a>
  <div class="nav-tabs" id="navTabs"></div>
  <div class="nav-right"><div class="nav-badge" id="navBadge"></div><button class="nav-hamburger" id="navHamburger" aria-label="Menu">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button></div>
</nav>
<div class="score-ticker-bar"><div class="score-ticker-track" id="ticker"></div></div>

<div class="pane active" id="pane-home">
  <div class="home-hero" data-ox-host>
    <canvas class="sp-art" id="heroArt" aria-hidden="true"></canvas>
    <div class="home-hero-inner">
      <div class="hero-live-badge"><span class="hero-live-dot"></span><span id="heroDate"></span></div>
      <h1 class="home-hero-title"><span class="line1" id="heroL1"></span><span class="line2" id="heroL2"></span></h1>
      <p class="home-hero-sub" id="heroSub"></p>
      <div class="home-cta-row">
        <button class="btn-primary" onclick="gotoTab('games')">Live games</button>
        <button class="btn-secondary" onclick="gotoTab('board')">Onyx board</button>
        <button class="btn-secondary" onclick="gotoTab('plays')">Plays</button>
      </div>
    </div>
  </div>
  <div class="home-stats-grid" id="homeStats"></div>
  <div class="sp-wrap" id="homeBody"></div>
</div>
<div class="pane" id="pane-games"><div class="sp-wrap" id="gamesBody"></div></div>
<div class="pane" id="pane-board"><div class="sp-wrap" id="boardBody"></div></div>
<div class="pane" id="pane-plays"><div class="sp-wrap" id="playsBody"></div></div>
<div class="pane" id="pane-model"><div class="sp-wrap" id="modelBody"></div></div>

<script>
// Injected by sports_build.py. `var`, read before any other script line (CLAUDE.md rule 5).
var SD = /*SPORT_DATA*/{}/*END_SPORT_DATA*/;
var ONYX_REFERRER = 'KR680261';
var GA_MEASUREMENT_ID = 'G-03T8V1N52E';
var C = SD.cfg || {};
var KIND = C.kind || 'football';
var TABS = [['home', 'Home'], ['games', 'Games'], ['board', 'Onyx Board'], ['plays', 'Plays'], ['model', 'Model']];
var currentTab = 'home', OPEN_GAME = null, LIVE = {}, LIVE_EV = null;

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'})[c]); }
function fmtOdds(o) { return o == null ? '-' : (o > 0 ? '+' : '') + o; }
function pct(p, d) { return p == null ? '-' : (p * 100).toFixed(d == null ? 0 : d) + '%'; }
function num(v, d) { return v == null || isNaN(v) ? '-' : (+v).toFixed(d == null ? 1 : d); }
function tipTime(iso) { try { return new Date(iso).toLocaleString('en-US', {weekday: 'short', hour: 'numeric', minute: '2-digit', timeZone: 'America/New_York'}) + ' ET'; } catch (e) { return ''; } }
function track(name, params) { try { if (window.gtag) gtag('event', name, Object.assign({sport: SD.sport}, params || {})); } catch (e) {} }
function lg(url, cls) { return url ? `<img class="lg ${cls || ''}" src="${esc(url)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">` : ''; }
function onyxUrl(sel) {
  if (sel) return 'https://app.onyxodds.com/share?selection=' + encodeURIComponent(sel) + '&referrer=' + ONYX_REFERRER;
  return 'https://app.onyxodds.com/' + (C.onyx_league ? 'leagues/' + C.onyx_league : '') + '?utm_source=onyxsports&referrer=' + ONYX_REFERRER;
}
function bet(sel, label) { track('onyx_click', {link_type: sel ? 'single' : 'fallback', selection: label || ''}); window.open(onyxUrl(sel), '_blank', 'noopener'); }
function game(gid) { return (SD.games || []).find(g => g.gid === gid); }
function live(g) { return Object.assign({}, g, LIVE[g.gid] || {}); }
function stateTxt(g) { return g.state === 'in' ? `<span class="live">${esc(g.detail || 'Live')}</span>` : g.state === 'post' ? esc(g.detail || 'Final') : esc(tipTime(g.start)); }

// ── odds chips (SD.odds from sports_odds.py: Onyx prices, labelled Onyx) ──
function gameOdds(gid) { return ((SD.odds || {}).games || {})[gid] || null; }
function chip(price, label, sel, sub) {
  if (price == null) return `<span class="chipx dead"><b>-</b><span>${esc(sub || label)}</span></span>`;
  return `<button class="chipx" onclick="event.stopPropagation();bet(${sel ? `'${esc(sel)}'` : 'null'},'${esc(label)}')"><b>${fmtOdds(price)}</b><span>${esc(sub || label)}</span></button>`;
}
function lineChips(g) {
  const o = gameOdds(g.gid);
  if (!o) return '';
  const sp = v => v == null ? '' : (v > 0 ? '+' : '') + v;
  return `<div class="gm-lines">
    ${o.away_ml != null ? chip(o.away_ml, g.away + ' ML', o.away_ml_sel, g.away + ' ML') : ''}
    ${o.home_ml != null ? chip(o.home_ml, g.home + ' ML', o.home_ml_sel, g.home + ' ML') : ''}
    ${o.home_spread != null ? chip(o.home_spread_price, g.home + ' ' + sp(o.home_spread), o.home_spread_sel, g.home + ' ' + sp(o.home_spread)) : ''}
    ${o.total != null ? chip(o.over_price, 'Over ' + o.total, o.over_sel, 'O ' + o.total) : ''}
    ${o.total != null ? chip(o.under_price, 'Under ' + o.total, o.under_sel, 'U ' + o.total) : ''}
  </div>`;
}

// ── shell ───────────────────────────────────────────────────────────
function buildNav() {
  document.getElementById('logoSub').textContent = C.name || '';
  document.getElementById('navTabs').innerHTML = TABS.map(([k, t]) => `<button class="nav-tab${k === 'home' ? ' active' : ''}" data-tab="${k}" onclick="gotoTab('${k}')">${t}</button>`).join('');
  const d = SD.date ? new Date(SD.date + 'T12:00:00') : null;
  document.getElementById('navBadge').textContent = (SD.label || '') + (d ? ' · ' + d.toLocaleDateString('en-US', {month: 'short', day: 'numeric'}) : '');
}
var RENDER = {};
function gotoTab(t) {
  if (!RENDER[t]) t = 'home';
  currentTab = t;
  document.querySelectorAll('.pane').forEach(p => p.classList.toggle('active', p.id === 'pane-' + t));
  document.querySelectorAll('.nav-tab[data-tab]').forEach(b => b.classList.toggle('active', b.dataset.tab === t));
  RENDER[t]();
  try { history.replaceState(null, '', '#' + t + (t === 'games' && OPEN_GAME ? ':' + OPEN_GAME : '')); } catch (e) {}
  track('tab_view', {tab: t});
  window.scrollTo(0, 0);
}
function ticker() {
  const sg = (inner, click, cls) => `<span class="score-game ${cls || ''}"${click ? ` onclick="${click}"` : ''}>${inner}</span>`;
  const st = (cls, txt) => `<span class="score-state ${cls}">${esc(txt)}</span>`;
  const items = KIND === 'tennis' ? (SD.events || []).flatMap(e => e.matches.filter(m => m.state === 'in').slice(0, 6).map(m =>
      sg(`${st('live', 'LIVE')}<span class="score-team">${esc(m.p[0].short || m.p[0].name)}</span><span class="score-num">${m.p[0].sets.join(' ')}</span><span class="score-sep">|</span><span class="score-team">${esc(m.p[1].short || m.p[1].name)}</span><span class="score-num">${m.p[1].sets.join(' ')}</span>`, "gotoTab('games')")))
    : KIND === 'golf' ? (SD.events || []).flatMap(e => e.board.slice(0, 8).map(r =>
      sg(`<span class="score-state">${esc(r.pos)}</span><span class="score-team">${esc(r.name)}</span><span class="score-num">${esc(r.to_par)}</span>`, "gotoTab('games')")))
    : (SD.games || []).map(g0 => {
      const g = live(g0), pre = g.state === 'pre';
      const as = +g.away_score, hs = +g.home_score;
      const cls = (mine, other) => pre ? '' : mine > other ? 'winning' : mine < other ? 'losing' : '';
      const state = g.state === 'in' ? st('live', g.detail || 'LIVE') : g.state === 'post' ? st('final', 'FINAL') : st('sched', tipTime(g.start));
      const logo = u => u ? `<span class="sticker-logo" style="background-image:url('${esc(u)}')"></span>` : '';
      return sg(`${state}${logo(g.away_logo)}<span class="score-team">${esc(g.away)}</span>${pre ? '' : `<span class="score-num ${cls(as, hs)}">${esc(g.away_score)}</span>`}<span class="score-sep">${pre ? '@' : '|'}</span>${logo(g.home_logo)}<span class="score-team">${esc(g.home)}</span>${pre ? '' : `<span class="score-num ${cls(hs, as)}">${esc(g.home_score)}</span>`}`, `openGame('${g.gid}')`);
    });
  const t = document.getElementById('ticker');
  t.innerHTML = items.length ? items.join('') + items.join('') : '';
  t.parentNode.style.display = items.length ? '' : 'none';
}

// ── home ────────────────────────────────────────────────────────────
var HERO = {
  football: ['Every snap.', 'Every Onyx line.', 'Live drives, down and distance, win probability and every Onyx line on the slate, with player projections built from the box scores.'],
  hockey: ['Every shift.', 'Every Onyx line.', 'Live scores, period by period, shots and scoring plays, with every Onyx line on the slate.'],
  tennis: ['Every set.', 'Every Onyx line.', 'Every ATP and WTA singles match on the tour this week, live set by set, with every Onyx line as it posts.'],
  golf: ['Every round.', 'Every Onyx line.', "This week's leaderboard, round by round, with every Onyx outright and matchup as it posts."],
};
function renderHome() {
  const h = HERO[KIND] || HERO.football;
  const d = SD.date ? new Date(SD.date + 'T12:00:00').toLocaleDateString('en-US', {month: 'long', day: 'numeric', year: 'numeric'}) : '';
  document.getElementById('heroDate').textContent = (SD.label ? SD.label + ' · ' : '') + d;
  document.getElementById('heroL1').textContent = h[0];
  document.getElementById('heroL2').textContent = h[1];
  document.getElementById('heroSub').textContent = h[2];
  const games = (SD.games || []).map(live);
  const nLive = games.filter(g => g.state === 'in').length + (SD.events || []).reduce((a, e) => a + (e.matches || []).filter(m => m.state === 'in').length, 0);
  const priced = Object.keys((SD.odds || {}).games || {}).length + ((SD.odds || {}).props || []).length;
  const stat = (v, l, c) => `<div class="home-stat"><div class="home-stat-val ${c || ''}">${v}</div><div class="home-stat-label">${l}</div></div>`;
  const n = KIND === 'tennis' ? (SD.events || []).reduce((a, e) => a + e.matches.length, 0) : KIND === 'golf' ? (SD.events || []).reduce((a, e) => a + e.board.length, 0) : games.length;
  document.getElementById('homeStats').innerHTML = stat(n, KIND === 'tennis' ? 'Matches' : KIND === 'golf' ? 'Players' : 'Games', 'purple')
    + stat(nLive, 'Live now', 'green') + stat(priced || '-', 'Onyx lines') + stat((SD.model || {}).status === 'live' ? 'Live' : 'Lab', 'Model');
  let body = '';
  if (KIND === 'tennis') {
    const lv = (SD.events || []).flatMap(e => e.matches.filter(m => m.state === 'in').map(m => [e, m]));
    const nx = (SD.events || []).flatMap(e => e.matches.filter(m => m.state === 'pre').map(m => [e, m])).slice(0, 6);
    body = `<div class="sec-hdr"><span class="sec-title">${lv.length ? 'Live now' : 'Up next'}</span></div><div class="tn-grid">${(lv.length ? lv : nx).slice(0, 12).map(([e, m]) => tnMatch(e, m)).join('') || '<div class="empty">No singles matches on the board right now.</div>'}</div>`;
  } else if (KIND === 'golf') {
    const e = (SD.events || [])[0];
    body = e ? `<div class="sec-hdr"><span class="sec-title">${esc(e.name)} · top 10</span><span class="sec-count">${esc(e.detail || '')}</span></div>${gfBoard(e, 10)}
      <button class="btn-secondary" style="margin-top:12px" onclick="gotoTab('games')">Full leaderboard</button>` : '<div class="empty">No tournament on the board this week.</div>';
  } else {
    const order = g => g.state === 'in' ? 0 : g.state === 'pre' ? 1 : 2;
    const up = games.slice().sort((a, b) => order(a) - order(b) || (a.start || '').localeCompare(b.start || '')).slice(0, 6);
    body = `<div class="sec-hdr"><span class="sec-title">${games.some(g => g.state === 'in') ? 'Live now and up next' : 'Up next'}</span><span class="sec-count">${games.length} games</span></div>
      <div class="gm-grid">${up.map(gameCard).join('') || '<div class="empty">No games on the slate.</div>'}</div>`;
    const top = (SD.model || {}).top || [];
    if (top.length) body += `<div class="sec-hdr"><span class="sec-title">Model projections · top of the slate</span></div>${projTable(top.slice(0, 8))}`;
  }
  document.getElementById('homeBody').innerHTML = ((KIND === 'football' || KIND === 'hockey' || KIND === 'tennis' || KIND === 'golf') ? `<div id="ypHome">${yourPlayers()}</div>` : '') + body;
}

// ── games + gamecenter ─────────────────────────────────────────────
function gameCard(g0) {
  const g = live(g0);
  const fin = g.state === 'post', aw = +g.away_score > +g.home_score;
  const rk = r => r ? `<span class="rk">#${r}</span>` : '';
  return `<div class="gm${OPEN_GAME === g.gid ? ' sel' : ''}" onclick="openGame('${g.gid}')" tabindex="0" onkeydown="if(event.key==='Enter')openGame('${g.gid}')">
    <div class="gm-top"><span>${stateTxt(g)}</span><span>${esc(g.tv || '')}</span></div>
    <div class="gm-t${fin && !aw ? ' lose' : ''}">${lg(g.away_logo, 'm')}<div>${rk(g.away_rank)}<b>${esc(g.away_short || g.away)}</b><span class="rec">${esc(g.away_rec || '')}</span></div><span class="sc">${g.state !== 'pre' ? esc(g.away_score) : ''}</span></div>
    <div class="gm-t${fin && aw ? ' lose' : ''}">${lg(g.home_logo, 'm')}<div>${rk(g.home_rank)}<b>${esc(g.home_short || g.home)}</b><span class="rec">${esc(g.home_rec || '')}</span></div><span class="sc">${g.state !== 'pre' ? esc(g.home_score) : ''}</span></div>
    ${lineChips(g)}
  </div>`;
}
var GFILTER = 'all';
function renderGames() {
  const el = document.getElementById('gamesBody');
  if (KIND === 'tennis') { el.innerHTML = `<div id="ypGames">${yourPlayers()}</div><div id="gcBox">${OPEN_MATCH ? matchCenter(OPEN_MATCH) : ''}</div>` + tnAll(); return; }
  if (KIND === 'golf') { el.innerHTML = `<div id="ypGames">${yourPlayers()}</div>` + gfAll(); return; }
  const games = (SD.games || []).map(live);
  const segs = [['all', 'All'], ['in', 'Live'], ['pre', 'Upcoming'], ['post', 'Final']];
  const shown = games.filter(g => GFILTER === 'all' || g.state === GFILTER);
  el.innerHTML = `<div class="sec-hdr"><span class="sec-title">${esc(SD.label || 'Games')} · tap a game for the gamecenter</span><span class="sec-count">${games.length} games</span></div>
    <div class="sp-tabs-seg">${segs.map(([k, t]) => `<button class="${GFILTER === k ? 'on' : ''}" onclick="GFILTER='${k}';renderGames()">${t} ${k === 'all' ? '' : games.filter(g => g.state === k).length}</button>`).join('')}</div>
    <div id="ypGames">${yourPlayers()}</div>
    <div id="gcBox"></div>
    <div class="gm-grid">${shown.map(gameCard).join('') || '<div class="empty">Nothing here right now.</div>'}</div>`;
  if (OPEN_GAME) drawGame(OPEN_GAME);
}
function openGame(gid) {
  OPEN_GAME = gid;
  if (currentTab !== 'games') gotoTab('games'); else renderGames();
  const box = document.getElementById('gcBox');
  if (box) box.scrollIntoView({behavior: 'smooth', block: 'start'});
  track('gamecenter_open', {gid});
}
var GC_CACHE = {};
function drawGame(gid) {
  const box = document.getElementById('gcBox');
  if (!box) return;
  const g = live(game(gid) || {});
  const head = `<div class="gc-hd">
    <div class="gc-side">${lg(g.away_logo, 'l')}<div><b>${esc(g.away_name || g.away)}</b><span>${esc(g.away_rec || '')}</span></div></div>
    <div class="gc-mid"><div class="sc">${g.state === 'pre' ? 'vs' : esc(g.away_score) + ' - ' + esc(g.home_score)}</div><div class="st ${g.state === 'in' ? 'live' : ''}">${stateTxt(g)}</div></div>
    <div class="gc-side h"><div><b>${esc(g.home_name || g.home)}</b><span>${esc(g.home_rec || '')}</span></div>${lg(g.home_logo, 'l')}</div>
    ${g.state !== 'pre' ? `<div class="ssc a">${esc(g.away_score)}</div><div class="ssc h">${esc(g.home_score)}</div>` : ''}</div>`;

      } else if (KIND === 'tennis') {
        (j.events || []).forEach(e => (e.groupings || []).forEach(gr => (gr.competitions || []).forEach(c => {
          (SD.events || []).forEach(ev => ev.matches.forEach(m => {
            if (m.id !== c.id) return;
            const st = (c.status || {}).type || {};
            m.state = st.state; m.detail = st.shortDetail || st.detail;
            (c.competitors || []).forEach((p, i) => { if (m.p[i]) { m.p[i].sets = (p.linescores || []).map(l => +l.value || 0); m.p[i].win = !!p.winner; m.p[i].serve = !!p.possession; } });
            if (m.state === 'in') anyLive = true;
          }));
        })));
      } else if (KIND === 'golf') {
        (j.events || []).forEach(e => {
          const ev = (SD.events || []).find(x => x.id === e.id); if (!ev) return;
          const c = (e.competitions || [{}])[0];
          ev.board = gfParse(c);
          ev.state = ((e.status || {}).type || {}).state; ev.detail = ((e.status || {}).type || {}).shortDetail;
          if (ev.state === 'in') anyLive = true;
        });
      }
    });
    if (KIND === 'golf') { gfAlerts(); ['ypHome', 'ypGames'].forEach(i => { const y = document.getElementById(i); if (y) y.innerHTML = yourPlayers(); }); }
    if (KIND === 'tennis') { tnAlerts(); ['ypHome', 'ypGames'].forEach(i => { const y = document.getElementById(i); if (y) y.innerHTML = yourPlayers(); }); }
    ticker();
    if (currentTab === 'games' && !(document.activeElement && document.activeElement.tagName === 'INPUT')) {
      if (KIND === 'football' || KIND === 'hockey') { if (OPEN_GAME) { drawGame(OPEN_GAME); } else renderGames(); } else renderGames();
    } else if (currentTab === 'home') renderHome();
    clearTimeout(_poll); _poll = setTimeout(pollLive, anyLive ? 10000 : 30000);
  });
}
// search (ui.js): teams and players on this page
window.OX_SEARCH = function (go) {
  const out = [];
  (SD.games || []).forEach(g => out.push({label: `${g.away_name || g.away} @ ${g.home_name || g.home}`, sub: tipTime(g.start), run: () => openGame(g.gid)}));
  ((SD.model || {}).rows || []).slice(0, 300).forEach(r => out.push({label: r.name, sub: `${r.team} · ${MKT_NAME[r.mkt] || r.mkt} ${num(r.proj)}`, run: () => { go('plays'); }}));
  (SD.events || []).forEach(e => (e.board || []).slice(0, 150).forEach(r => out.push({label: r.name, sub: `${e.name} · ${r.pos} · ${r.to_par}`, run: () => { GQ = String(r.name).toLowerCase(); go('games'); }})));
  return out;
};

function initAnalytics() {
  if (!GA_MEASUREMENT_ID || location.protocol !== 'https:') return;
  window.dataLayer = window.dataLayer || [];
  window.gtag = function () { dataLayer.push(arguments); };
  gtag('js', new Date()); gtag('config', GA_MEASUREMENT_ID);
  const s = document.createElement('script'); s.async = true; s.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA_MEASUREMENT_ID; document.head.appendChild(s);
}
RENDER = {home: renderHome, games: renderGames, board: renderBoard, plays: renderPlays, model: renderModel};
(function boot() {
  buildNav(); ticker(); initAnalytics();
  const art = document.getElementById('heroArt');
  if (art) { art.dataset.oxArt = C.art || 'field'; art.dataset.oxTone = C.tone || 'purple'; art.dataset.oxFade = '0'; }
  const h = (location.hash || '').replace('#', '').split(':');
  if (h[0] === 'games' && h[1]) OPEN_GAME = h[1];
  gotoTab(RENDER[h[0]] ? h[0] : 'home');
  pollLive();
  setTimeout(ypLoop, 2500);
  if ('serviceWorker' in navigator && location.protocol === 'https:') addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
})();
</script>
