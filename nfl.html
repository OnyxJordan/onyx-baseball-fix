  const out = [`<div class="sec-hdr"><span class="sec-title">Onyx board · every Onyx line on the slate</span><span class="sec-count">${O.fetched ? 'prices ' + esc(new Date(O.fetched).toLocaleTimeString('en-US', {hour: 'numeric', minute: '2-digit', timeZone: 'America/New_York'})) + ' ET' : ''}</span></div>`];
  if (!O.games && !props.length && !(O.outrights || []).length) {
    out.push(`<div class="lab"><div class="eb">Onyx prices</div><h3>The Onyx feed for ${esc(C.name)} is being wired</h3>
      <p>Every price on this site comes straight from Onyx, never another book. The Onyx lines for ${esc(C.name)} switch on here as soon as the feed is connected, game lines first, then player markets.</p>
      <button class="btn-primary" onclick="bet(null,'board')">⚡ See ${esc(C.name)} on Onyx</button></div>`);
  }
  if (O.games) {
    out.push(`<div class="gm-grid">${games.filter(g => g.state !== 'post' && gameOdds(g.gid)).map(gameCard).join('') || '<div class="empty">No open game lines right now.</div>'}</div>`);
  }
  if (props.length) {
    const mk = [...new Set(props.map(p => p.mkt))];
    const P = props.filter(p => (BMKT === 'all' || p.mkt === BMKT) && (!BQ || (p.name + ' ' + (p.team || '')).toLowerCase().includes(BQ)));
    out.push(`<div class="sec-hdr"><span class="sec-title">Player markets</span><span class="sec-count">${P.length} lines</span></div>
      <input placeholder="Search players, teams" value="${esc(BQ)}" oninput="BQ=this.value.toLowerCase();renderBoard();this.focus();this.setSelectionRange(this.value.length,this.value.length)" style="width:100%;padding:10px 12px;margin-bottom:10px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid var(--border2);color:var(--text);font:500 14px 'Space Grotesk',sans-serif">
      <div class="sp-tabs-seg"><button class="${BMKT === 'all' ? 'on' : ''}" onclick="BMKT='all';renderBoard()">All</button>${mk.map(m => `<button class="${BMKT === m ? 'on' : ''}" onclick="BMKT='${esc(m)}';renderBoard()">${esc(MKT_NAME[m] || m)}</button>`).join('')}</div>
      <div class="tbl"><table><thead><tr><th>Player</th><th>Market</th><th class="r">Line</th>${(SD.model || {}).status ? '<th class="r">Proj</th>' : ''}<th class="r">Over</th><th class="r">Under</th></tr></thead><tbody>
      ${P.slice(0, 400).map(p => `<tr><td><b>${esc(p.name)}</b> <span class="dim">${esc(p.team || '')}</span></td><td class="dim">${esc(MKT_NAME[p.mkt] || p.mkt)}</td><td class="r mono">${esc(p.line)}</td>
        ${(SD.model || {}).status ? `<td class="r mono ${p.proj != null ? (p.proj > p.line ? 'lean-o' : 'lean-u') : 'dim'}">${p.proj != null ? num(p.proj) : '-'}</td>` : ''}
        <td class="r">${chip(p.over, p.name + ' Over ' + p.line, p.over_sel, 'Over')}</td><td class="r">${p.under != null ? chip(p.under, p.name + ' Under ' + p.line, p.under_sel, 'Under') : '<span class="dim">-</span>'}</td></tr>`).join('')}
      </tbody></table></div>`);
  }
  if ((O.outrights || []).length) {
    out.push(`<div class="sec-hdr"><span class="sec-title">Outrights</span></div><div class="tbl"><table><thead><tr><th>Player</th><th>Market</th><th class="r">Onyx</th></tr></thead><tbody>
      ${O.outrights.slice(0, 300).map(o => `<tr><td><b>${esc(o.name)}</b></td><td class="dim">${esc(o.mkt)}</td><td class="r">${chip(o.price, o.name + ' ' + o.mkt, o.sel, 'Onyx')}</td></tr>`).join('')}</tbody></table></div>`);
  }
  el.innerHTML = out.join('');
}
var MKT_NAME = {pass_yds: 'Passing yards', rush_yds: 'Rushing yards', rec_yds: 'Receiving yards', rec: 'Receptions',
                pass_td: 'Passing TDs', anytime_td: 'Anytime TD', goals: 'Goals', shots: 'Shots on goal', points: 'Points', assists: 'Assists', saves: 'Saves'};

// ── plays (model) ───────────────────────────────────────────────────
function projTable(rows) {
  return `<div class="tbl"><table><thead><tr><th>Player</th><th>Market</th><th class="r">Proj</th><th class="r">Last 3</th><th class="r">Season</th><th class="r">Onyx line</th><th class="r">Lean</th></tr></thead><tbody>
    ${rows.map(r => `<tr><td>${r.hs ? `<img class="lg" style="border-radius:50%" src="${esc(r.hs)}" alt="" loading="lazy">` : ''} <b>${esc(r.name)}</b> <span class="dim">${esc(r.team)} ${r.home ? 'vs' : '@'} ${esc(r.opp)}</span></td>
      <td class="dim">${esc(MKT_NAME[r.mkt] || r.mkt)}</td><td class="r mono"><b>${num(r.proj)}</b></td><td class="r mono dim">${esc((r.l3 || []).join(' '))}</td><td class="r mono dim">${num(r.season)}</td>
      <td class="r mono">${r.line != null ? esc(r.line) : '-'}</td><td class="r mono ${r.line != null ? (r.proj > r.line ? 'lean-o' : 'lean-u') : 'dim'}">${r.line != null ? (r.proj > r.line ? 'Over' : 'Under') : '-'}</td></tr>`).join('')}
  </tbody></table></div>`;
}
var PMKT = 'all';
function renderPlays() {
  const M = SD.model || {};
  const el = document.getElementById('playsBody');
  const lab = `<div class="lab"><div class="eb">${M.status === 'live' ? 'Tracked picks' : 'Model in the lab'}</div>
    <h3>${M.status === 'live' ? 'Where the model beats the Onyx line' : 'Picks switch on when the model earns them'}</h3>
    <p>${esc(M.note || `The ${C.name} model is being built and tested. Nothing here is a pick until it has been backtested against real Onyx prices, the same bar the NBA and MLB models had to clear.`)}</p>
    ${(M.tests || []).length ? `<div class="stat-grid">${M.tests.map(t => `<div><span>${esc(t.k)}</span><b>${esc(t.v)}</b><div class="dim" style="font-size:11px">${esc(t.d || '')}</div></div>`).join('')}</div>` : ''}
    ${(M.roadmap || []).length ? `<ul>${M.roadmap.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}</div>`;
  const rows = M.rows || [];
  if (!rows.length) { el.innerHTML = lab; return; }
  const mk = [...new Set(rows.map(r => r.mkt))];
  const shown = rows.filter(r => PMKT === 'all' || r.mkt === PMKT);
  el.innerHTML = lab + `<div class="sec-hdr"><span class="sec-title">${M.status === 'live' ? 'Plays' : 'Model leans · projections, not picks, not graded'}</span><span class="sec-count">${shown.length}</span></div>
    <div class="sp-tabs-seg"><button class="${PMKT === 'all' ? 'on' : ''}" onclick="PMKT='all';renderPlays()">All</button>${mk.map(m => `<button class="${PMKT === m ? 'on' : ''}" onclick="PMKT='${esc(m)}';renderPlays()">${esc(MKT_NAME[m] || m)}</button>`).join('')}</div>
    ${projTable(shown.slice(0, 120))}`;
}
function renderModel() {
  const M = SD.model || {};
  document.getElementById('modelBody').innerHTML = `<div class="lab"><div class="eb">How Onyx ${esc(C.name)} works</div><h3>${esc(M.title || 'The data, the model and what is tested')}</h3>
    ${(M.method || []).map(p => `<p>${esc(p)}</p>`).join('') || `<p>Live scores, the gamecenter and the schedule come from ESPN's public feed, refreshed through the day and polled live on this page. Every price is an Onyx price.</p>`}
    ${(M.tests || []).length ? `<div class="stat-grid">${M.tests.map(t => `<div><span>${esc(t.k)}</span><b>${esc(t.v)}</b><div class="dim" style="font-size:11px">${esc(t.d || '')}</div></div>`).join('')}</div>` : ''}
    <p class="dim" style="font-size:12px">Model ${esc(M.version || 'not live yet')} · data built ${esc(SD.generated ? new Date(SD.generated).toLocaleString('en-US', {timeZone: 'America/New_York'}) + ' ET' : '')}</p></div>
    ${(M.roadmap || []).length ? `<div class="lab"><div class="eb">Next</div><ul>${M.roadmap.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>` : ''}`;
}

// ── live: ESPN scoreboard every 30s (15s while anything is live) ────
var _poll = null;
function pollLive() {
  if (location.protocol === 'file:' || !(C.espn || []).length) return;
  const paths = C.espn;
  Promise.all(paths.map(p => fetch('https://site.api.espn.com/apis/site/v2/sports/' + p + '/scoreboard' + (C.espn_q ? '?' + C.espn_q : '')).then(r => r.json()).catch(() => null))).then(js => {
    let anyLive = false;
    js.forEach((j, pi) => {
      if (!j) return;
      if (KIND === 'football' || KIND === 'hockey') {
        (j.events || []).forEach(e => {
          const c = (e.competitions || [{}])[0], st = (e.status || {}).type || {};
          const t = {}; (c.competitors || []).forEach(x => { t[x.homeAway] = x; });
          LIVE[e.id] = {state: st.state, detail: st.shortDetail || st.detail, away_score: (t.away || {}).score, home_score: (t.home || {}).score,
                        situation: c.situation || null, home_id: ((t.home || {}).team || {}).id};
          if (st.state === 'in') anyLive = true;
        });
      } else if (KIND === 'tennis') {
        (j.events || []).forEach(e => (e.groupings || []).forEach(gr => (gr.competitions || []).forEach(c => {
          (SD.events || []).forEach(ev => ev.matches.forEach(m => {
            if (m.id !== c.id) return;
            const st = (c.status || {}).type || {};
            m.state = st.state; m.detail = st.shortDetail || st.detail;
            (c.competitors || []).forEach((p, i) => { if (m.p[i]) { m.p[i].sets = (p.linescores || []).map(l => +l.value || 0); m.p[i].win = !!p.winner; m.p[i].serve = !!p.possession; } });
            if (m.state === 'in') anyLive = true;
          }));
        })));
      } else if (KIND === 'golf') {
        (j.events || []).forEach(e => {
          const ev = (SD.events || []).find(x => x.id === e.id); if (!ev) return;
          const c = (e.competitions || [{}])[0];
          ev.board = (c.competitors || []).map(p => ({pos: p.order, name: (p.athlete || {}).displayName, flag: ((p.athlete || {}).flag || {}).href, to_par: p.score,
            rounds: (p.linescores || []).map(l => ({s: l.value, d: l.displayValue}))})).sort((a, b) => (a.pos || 999) - (b.pos || 999));
          ev.state = ((e.status || {}).type || {}).state; ev.detail = ((e.status || {}).type || {}).shortDetail;
          if (ev.state === 'in') anyLive = true;
        });
      }
    });
    ticker();
    if (currentTab === 'games' && !(document.activeElement && document.activeElement.tagName === 'INPUT')) {
      if (KIND === 'football' || KIND === 'hockey') { if (OPEN_GAME) { drawGame(OPEN_GAME); } else renderGames(); } else renderGames();
    } else if (currentTab === 'home') renderHome();
    clearTimeout(_poll); _poll = setTimeout(pollLive, anyLive ? 15000 : 30000);
  });
}
// search (ui.js): teams and players on this page
window.OX_SEARCH = function (go) {
  const out = [];
  (SD.games || []).forEach(g => out.push({label: `${g.away_name || g.away} @ ${g.home_name || g.home}`, sub: tipTime(g.start), run: () => openGame(g.gid)}));
  ((SD.model || {}).rows || []).slice(0, 300).forEach(r => out.push({label: r.name, sub: `${r.team} · ${MKT_NAME[r.mkt] || r.mkt} ${num(r.proj)}`, run: () => { go('plays'); }}));
  (SD.events || []).forEach(e => (e.board || []).slice(0, 150).forEach(r => out.push({label: r.name, sub: `${e.name} · ${r.pos} · ${r.to_par}`, run: () => { GQ = String(r.name).toLowerCase(); go('games'); }})));
  return out;
};

function initAnalytics() {
  if (!GA_MEASUREMENT_ID || location.protocol !== 'https:') return;
  window.dataLayer = window.dataLayer || [];
  window.gtag = function () { dataLayer.push(arguments); };
  gtag('js', new Date()); gtag('config', GA_MEASUREMENT_ID);
  const s = document.createElement('script'); s.async = true; s.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA_MEASUREMENT_ID; document.head.appendChild(s);
}
RENDER = {home: renderHome, games: renderGames, board: renderBoard, plays: renderPlays, model: renderModel};
(function boot() {
  buildNav(); ticker(); initAnalytics();
  const art = document.getElementById('heroArt');
  if (art) { art.dataset.oxArt = C.art || 'field'; art.dataset.oxTone = C.tone || 'purple'; art.dataset.oxFade = '0'; }
  const h = (location.hash || '').replace('#', '').split(':');
  if (h[0] === 'games' && h[1]) OPEN_GAME = h[1];
  gotoTab(RENDER[h[0]] ? h[0] : 'home');
  pollLive();
  if ('serviceWorker' in navigator && location.protocol === 'https:') addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
})();
</script>
