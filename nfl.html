  const steps = (E.steps || []).map(st => `<div class="wblock"><div class="wtitle">${esc(st.t)}</div>
    ${st.bars ? wbar(st.bars) : ''}${(st.rows || []).map(r => `<div class="wrow"><b>${esc(r[0])}</b><span>${esc(r[1])}</span></div>`).join('')}
    ${st.note ? `<div class="wnote">${esc(st.note)}</div>` : ''}</div>`).join('');
  const L = E.lane;
  const lane = L ? `<div class="wblock"><div class="wtitle">${L.live ? 'The pick lane · live and graded in public' : 'The pick lane · not live: its backtest did not pass'}</div>
    <div class="wrow"><b>Markets</b><span>${esc(L.markets.join(', '))}</span></div>
    <div class="wrow"><b>Edge</b><span>${(L.edge[0] * 100).toFixed(0)} to ${(L.edge[1] * 100).toFixed(0)}pp over the price's implied chance (bigger gaps are usually news the model missed)</span></div>
    <div class="wrow"><b>Price</b><span>${fmtOdds(L.price[0])} to ${fmtOdds(L.price[1])}, one play per game, ${L.per_slate} a slate at most</span></div>
    <div class="wnote">${L.passed ? 'This lane beat real Onyx prices on games it never saw, so its plays are tracked picks with a public record.' : 'This is the best lane the backtest found, and it did not beat Onyx on the games it never saw. Its plays show as projected leans on the Plays tab, never tracked or graded, until a model version passes.'}</div></div>` : '';
  const f = (E.factors || []).length ? `<div class="factor-grid sp-factors">${E.factors.map(x => factorCard(...x)).join('')}</div>` : '';
  return `<div class="sec-hdr"><span class="sec-title">How a ${KIND === 'tennis' ? 'match price' : KIND === 'golf' ? 'golf read' : 'price'} is built</span></div>${steps}${lane}${f}`;
}
function renderModel() {
  const M = SD.model || {};
  document.getElementById('modelBody').innerHTML = `<div class="lab"><div class="eb">How Onyx ${esc(C.name)} works</div><h3>${esc(M.title || 'The data, the model and what is tested')}</h3>
    ${(M.method || []).map(p => `<p>${esc(p)}</p>`).join('') || `<p>Live scores, the gamecenter and the schedule come from ESPN's public feed, refreshed through the day and polled live on this page. Every price is an Onyx price.</p>`}
    ${(M.tests || []).length ? `<div class="stat-grid">${M.tests.map(t => `<div><span>${esc(t.k)}</span><b>${esc(t.v)}</b><div class="dim" style="font-size:11px">${esc(t.d || '')}</div></div>`).join('')}</div>` : ''}
    <p class="dim" style="font-size:12px">Model ${esc(M.version || 'not live yet')} · ${M.status === 'live' ? 'picks live' : M.status === 'trial' ? 'one lane on trial, the rest leans' : 'leans only'} · data built ${esc(SD.generated ? new Date(SD.generated).toLocaleString('en-US', {timeZone: 'America/New_York'}) + ' ET' : '')}</p></div>
    ${engineHtml(M.engine)}
    ${backtestBlock(M.backtest)}
    ${(M.changelog || []).length ? `<div class="lab"><div class="eb">Changelog · the lab notebook</div><ul>${M.changelog.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>` : ''}
    ${(M.roadmap || []).length ? `<div class="lab"><div class="eb">Next</div><ul>${M.roadmap.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>` : ''}
    ${recordBlock(M.record)}`;
}

// ── Depth: data/<sport>/depth.json, one schema for every team sport (11/2) ──
// {unit, use_label, stats, labels, groups, group_names, pace_label, method, backtest,
//  teams: {abbr: {name, logo, pace, next, players: [{id, n, pos, grp, role, tier, tag, use, proj, now, last}]}}}
var DEPTH = null, DEPTH_ERR = false, DEPTH_TEAM = null, DEPTH_VIEW = 'proj';
var DP_TIERS = ['Starter', 'Rotation', 'Bench', 'Out'];
var DP_GN = {G: 'Guards', F: 'Forwards', C: 'Centers', 'G-F': 'Wings', 'F-C': 'Bigs'};   // when the file names no groups
function dpLoad() {
  if (DEPTH || DEPTH_ERR === 'busy') return;
  DEPTH_ERR = 'busy';
  fetch('data/' + SD.sport + '/depth.json' + (SD.depth_at ? '?v=' + encodeURIComponent(SD.depth_at) : ''))
    .then(r => r.ok ? r.json() : null).catch(() => null)
    .then(d => { DEPTH = d && d.teams ? d : null; DEPTH_ERR = !DEPTH; if (currentTab === 'depth') renderDepth(); });
}
function dpUse(v, unit) {
  if (v == null || isNaN(v)) return '-';
  return /%/.test(unit || '') ? Math.round(v) + '%' : (+v).toFixed(1);
}
function dpVal(v, k) {
  if (v == null || isNaN(v)) return '-';
  if (k === 'gp') return String(Math.round(v));
  return Math.abs(v) >= 10 ? (+v).toFixed(1) : (+v).toFixed(2).replace(/0$/, '');
}
function dpTier(p) { return p.tier || (DP_TIERS.includes(p.role) ? p.role : ''); }
function dpDefaultTeam(T) {
  const h = (location.hash || '').split(':');
  if (h[0] === '#depth' && h[1] && T[decodeURIComponent(h[1])]) return decodeURIComponent(h[1]);
  for (const g of SD.games || []) for (const t of [g.away, g.home]) if (T[t]) return t;
  return Object.keys(T).sort()[0];
}
function dpPick(t) { DEPTH_TEAM = t; renderDepth(); try { history.replaceState(null, '', '#depth:' + encodeURIComponent(t)); } catch (e) {} }
function dpView(v) { DEPTH_VIEW = v; renderDepth(); }
function renderDepth() {
  const el = document.getElementById('depthBody');
  if (!DEPTH) {
    el.innerHTML = `<div class="sec-hdr"><h2>Depth chart</h2></div>` + (DEPTH_ERR === true
      ? `<div class="empty">Depth charts for ${esc(C.name)} arrive with the next data build. Every team's order, roles and projected usage will show here.</div>`
      : `<div class="empty">Loading every ${esc(C.name)} depth chart, with roles, projected usage and per-game projections...</div>`);
    dpLoad();
    return;
  }
  const D = DEPTH, T = D.teams || {};
  if (!DEPTH_TEAM || !T[DEPTH_TEAM]) DEPTH_TEAM = dpDefaultTeam(T);
  const tm = T[DEPTH_TEAM] || {players: []};
  const lab = Object.assign({gp: 'GP'}, D.labels || {});
  const useHd = ({'snap%': 'Snap%', 'use%': 'Use%', min: 'Min', toi: 'TOI'})[D.unit] || 'Use';
  const views = [['proj', 'Projected'], ['now', 'This season'], ['last', 'Last season']];
  const keys = Object.keys(T).sort((a, b) => String(T[a].name || a).localeCompare(String(T[b].name || b)));
  // groups in the file's order, else first appearance
  const gk = p => p.grp || p.pos || 'Other';
  const order = (D.groups || []).slice();
  tm.players.forEach(p => { if (!order.includes(gk(p))) order.push(gk(p)); });
  const V = DEPTH_VIEW;
  const body = order.map(g => {
    const ps = tm.players.filter(p => gk(p) === g);
    if (!ps.length) return '';
    const obj = p => (V === 'proj' ? p.proj : p[V]) || {};
    const cols = (D.stats || []).concat(D.extra || []).filter(k => ps.some(p => obj(p)[k] != null));
    const showGp = V !== 'proj' && ps.some(p => obj(p).gp != null);
    const gu = (D.group_units || {})[g] || D.unit, gHd = ({'snap%': 'Snap%', 'use%': 'Use%', 'start%': 'Starts', min: 'Min', toi: 'TOI'})[gu] || useHd;
    let prev = null;
    const rows = ps.map(p => {
      const o = obj(p), tier = dpTier(p);
      const u = V === 'proj' ? p.use : o.use;
      const brk = prev != null && String(p.role || '').replace(/\d+$/, '') === String(prev).replace(/\d+$/, '') && p.role !== prev && /^[LDG]\d$/.test(p.role || '');
      prev = p.role;
      const tag = p.tag ? `<small class="${tier === 'Out' ? 'out' : p.q || /question/i.test(p.tag) ? 'q' : ''}">${esc(p.tag)}</small>` : '';
      return `<tr class="${tier === 'Out' ? 'out' : tier === 'Bench' ? 'bench' : ''}${brk ? ' brk' : ''}"><td class="pl"><span class="dp-role${tier === 'Starter' ? ' st' : ''}">${esc(p.role || tier || p.pos || '')}</span><b data-oxp="${esc(p.n || '')}" data-oxpt="${esc(DEPTH_TEAM)}">${esc(p.n || '')}</b>${p.pos && p.pos !== g ? ` <span class="dim mono" style="font-size:10px">${esc(p.pos)}</span>` : ''}${tag}</td>
        <td class="r use">${dpUse(u, gu)}</td>${showGp ? `<td class="r mono">${dpVal(o.gp, 'gp')}</td>` : ''}${cols.map(k => `<td class="r mono">${dpVal(o[k], k)}</td>`).join('')}</tr>`;
    }).join('');
    return `<div class="dp-grp"><h4>${esc((D.group_names || {})[g] || DP_GN[g] || g)}</h4><div class="tbl"><table><thead><tr><th class="pl">Player</th><th class="r">${esc(gHd)}</th>${showGp ? '<th class="r">GP</th>' : ''}${cols.map(k => `<th class="r">${esc(lab[k] || k)}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div></div>`;
  }).join('');
  const bt = D.backtest || {};
  // two backtest shapes: rows [{k, n, mae, avg, l3}] (football, hockey) or {minutes_mae, minutes_naive, stats: {k: {model, naive}}}
  const btR = (bt.rows || []).length ? bt.rows : bt.stats ? [{k: useHd === 'Min' ? 'Minutes' : (D.use_label || 'Usage'), mae: bt.minutes_mae, base: bt.minutes_naive, n: bt.n}]
    .concat(Object.keys(bt.stats).map(k => ({k: lab[k] || k, mae: bt.stats[k].model, base: bt.stats[k].naive, n: bt.n}))) : [];
  const two = btR.some(r => r.avg != null);
  const btRows = btR.filter(r => r.mae != null).map(r => {
    const best = two ? Math.min(r.avg, r.l3) : r.base;
    const f = v => v == null || isNaN(v) ? '-' : String(+v);   // as tested: the differences live in the third decimal
    return `<tr><td>${esc(r.k)}</td><td class="${r.mae < best * 0.995 ? 'dp-win' : ''}">${f(r.mae)}</td>${two ? `<td>${f(r.avg)}</td><td>${f(r.l3)}</td>` : `<td>${f(r.base)}</td>`}<td>${r.n ? (+r.n).toLocaleString('en-US') : '-'}</td></tr>`;
  }).join('');
  const btHead = two ? '<th>Model</th><th>Season avg</th><th>Last 3</th>' : '<th>Model</th><th>Baseline</th>';
  const btWin = bt.window || (bt.season ? bt.season + ' season' : '');
  const nx = tm.next && tm.next.opp ? `<span>next ${tm.next.wk ? 'wk ' + esc(tm.next.wk) + ' ' : ''}vs ${esc(tm.next.opp)}</span>` : '';
  el.innerHTML = `<div class="sec-hdr"><h2>Depth chart</h2><span class="dim mono" style="font-size:11px">${D.generated ? 'updated ' + esc(new Date(D.generated).toLocaleString('en-US', {month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit', timeZone: 'America/New_York'})) + ' ET' : ''}</span></div>
    <div class="dp-bar"><select aria-label="Team" onchange="dpPick(this.value)">${keys.map(k => `<option value="${esc(k)}"${k === DEPTH_TEAM ? ' selected' : ''}>${esc(T[k].name || k)}</option>`).join('')}</select>
      <div class="gc-sub">${views.map(([k, t]) => `<button class="${k === V ? 'on' : ''}" onclick="dpView('${k}')">${t}</button>`).join('')}</div></div>
    <div class="dp-team" data-oxt="${esc(DEPTH_TEAM)}">${lg(tm.logo)}<b>${esc(tm.name || DEPTH_TEAM)}</b><div class="dp-meta">${tm.pace != null ? `<span>${esc(D.pace_label || 'Pace')} ${esc(dpVal(tm.pace))}</span>` : ''}${nx}<span>${esc(D.use_label || useHd)}: ${V === 'proj' ? 'projected' : V === 'now' ? 'this season' : 'last season'}</span></div></div>
    <p class="dim" style="font-size:12px;margin:4px 0 0">${V === 'proj' ? 'Projected per game. Tap This season or Last season for what each player has done.' : V === 'now' ? 'Per game this season.' : 'Per game last season.'} A dash means no role in that number.</p>
    ${body || '<div class="empty">No players listed for this team yet.</div>'}
    <div class="lab" style="margin-top:20px"><div class="eb">How the depth chart works</div><p>${esc(D.method || '')}</p>
      ${btRows ? `<div style="overflow-x:auto"><table class="dp-bt"><thead><tr><th>Backtest${btWin ? ' · ' + esc(btWin) : ''}</th>${btHead}<th>Games</th></tr></thead><tbody>${btRows}</tbody></table></div><p class="dim" style="font-size:11px">Average miss per game; lower is better, green where the projection beats ${two ? 'both baselines' : 'the baseline'}.</p>` : ''}</div>`;
}
function dpMenuTile() {   // the menu drawer (ui.js) lists the sport tabs; add Depth to it
  const grid = document.querySelector('.osheet .ogrid');
  if (!TEAMK || !grid || grid.querySelector('[data-tab="depth"]')) return;
  const b = document.createElement('button');
  b.className = 'otile'; b.dataset.tab = 'depth';
  b.innerHTML = '<svg class="oi" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 3h12M2 6.5h9M2 10h12M2 13.5h7"/></svg><div><b>Depth</b><span>Depth charts, roles and usage</span></div>';
  b.addEventListener('click', () => { try { window.OnyxUI && OnyxUI.closeMenu(); } catch (e) {} gotoTab('depth'); });
  const model = grid.querySelector('[data-tab="model"]');
  grid.insertBefore(b, model || null);
}

// ── live: ESPN scoreboard every 30s (15s while anything is live) ────
var _poll = null;
function pollLive() {
  if (location.protocol === 'file:' || !(C.espn || []).length) return;
  const paths = C.espn;
  // college basketball's default scoreboard is not today's games: ask for the slate's day
  const q = [C.espn_q, KIND === 'basketball' && SD.date ? 'dates=' + SD.date.replace(/-/g, '') : ''].filter(Boolean).join('&');
  Promise.all(paths.map(p => fetch('https://site.api.espn.com/apis/site/v2/sports/' + p + '/scoreboard' + (q ? '?' + q : '')).then(r => r.json()).catch(() => null))).then(js => {
    let anyLive = false;
    js.forEach((j, pi) => {
      if (!j) return;
      if (TEAMK) {
        (j.events || []).forEach(e => {
          const c = (e.competitions || [{}])[0], st = (e.status || {}).type || {};
          const t = {}; (c.competitors || []).forEach(x => { t[x.homeAway] = x; });
          LIVE[e.id] = {state: st.state, detail: st.shortDetail || st.detail, away_score: (t.away || {}).score, home_score: (t.home || {}).score,
                        situation: c.situation || null, home_id: ((t.home || {}).team || {}).id};
          if (st.state === 'in') anyLive = true;
        });
      } else if (KIND === 'tennis') {
        (j.events || []).forEach(e => (e.groupings || []).forEach(gr => (gr.competitions || []).forEach(c => {
          (SD.events || []).forEach(ev => ev.matches.forEach(m => {
            if (m.id !== c.id) return;
            const st = (c.status || {}).type || {};
            m.state = st.state; m.detail = st.shortDetail || st.detail;
            (c.competitors || []).forEach((p, i) => { if (m.p[i]) { m.p[i].sets = (p.linescores || []).map(l => +l.value || 0); m.p[i].win = !!p.winner; m.p[i].serve = !!p.possession; } });
            if (m.state === 'in') anyLive = true;
          }));
        })));
      } else if (KIND === 'golf') {
        (j.events || []).forEach(e => {
          const ev = (SD.events || []).find(x => x.id === e.id); if (!ev) return;
          const c = (e.competitions || [{}])[0];
          ev.board = gfParse(c);
          ev.state = ((e.status || {}).type || {}).state; ev.detail = ((e.status || {}).type || {}).shortDetail;
          if (ev.state === 'in') anyLive = true;
        });
      }
    });
    if (KIND === 'golf') { gfAlerts(); ['ypHome', 'ypGames'].forEach(i => { const y = document.getElementById(i); if (y) y.innerHTML = yourPlayers(); }); }
    if (KIND === 'tennis') { tnAlerts(); ['ypHome', 'ypGames'].forEach(i => { const y = document.getElementById(i); if (y) y.innerHTML = yourPlayers(); }); }
    ticker();
    if (currentTab === 'games' && !(document.activeElement && document.activeElement.tagName === 'INPUT')) {
      if (TEAMK) { if (OPEN_GAME) { drawGame(OPEN_GAME); } else renderGames(); } else renderGames();
    } else if (currentTab === 'home') renderHome();
    clearTimeout(_poll); _poll = setTimeout(pollLive, anyLive ? 10000 : 30000);
  });
}
// search (ui.js): teams and players on this page
window.OX_SEARCH = function (go) {
  const out = [];
  (SD.games || []).forEach(g => out.push({label: `${g.away_name || g.away} @ ${g.home_name || g.home}`, sub: tipTime(g.start), run: () => openGame(g.gid)}));
  ((SD.model || {}).rows || []).slice(0, 300).forEach(r => out.push({label: r.name, sub: `${r.team} · ${MKT_NAME[r.mkt] || r.mkt} ${num(r.proj)}`, run: () => { go('plays'); }}));
  (SD.events || []).forEach(e => (e.board || []).slice(0, 150).forEach(r => out.push({label: r.name, sub: `${e.name} · ${r.pos} · ${r.to_par}`, run: () => { GQ = String(r.name).toLowerCase(); go('games'); }})));
  if (TEAMK) {   // depth charts: the page, and each team on the slate
    out.push({label: 'Depth charts', sub: 'PAGE', run: () => go('depth')});
    const seen = {};
    (SD.games || []).forEach(g => [[g.away, g.away_name], [g.home, g.home_name]].forEach(([t, n]) => {
      if (seen[t]) return; seen[t] = 1;
      out.push({label: `${n || t} depth chart`, sub: 'DEPTH', run: () => { DEPTH_TEAM = t; go('depth'); }});
    }));
  }
  return out;
};

function initAnalytics() {
  if (!GA_MEASUREMENT_ID || location.protocol !== 'https:') return;
  window.dataLayer = window.dataLayer || [];
  window.gtag = function () { dataLayer.push(arguments); };
  gtag('js', new Date()); gtag('config', GA_MEASUREMENT_ID);
  const s = document.createElement('script'); s.async = true; s.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA_MEASUREMENT_ID; document.head.appendChild(s);
}
RENDER = {home: renderHome, games: renderGames, board: renderBoard, plays: renderPlays, model: renderModel};
if (TEAMK) RENDER.depth = renderDepth;
(function boot() {
  buildNav(); ticker(); initAnalytics();
  const art = document.getElementById('heroArt');
  if (art) { art.dataset.oxArt = C.art || 'field'; art.dataset.oxTone = C.tone || 'purple'; art.dataset.oxFade = '0'; }
  const h = (location.hash || '').replace('#', '').split(':');
  if (h[0] === 'games' && h[1]) { if (KIND === 'tennis') OPEN_MATCH = tnLiveId(decodeURIComponent(h[1])); else OPEN_GAME = decodeURIComponent(h[1]); }
  if (h[0] === 'depth' && h[1]) DEPTH_TEAM = decodeURIComponent(h[1]);
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => setTimeout(dpMenuTile, 0)); else setTimeout(dpMenuTile, 0);
  gotoTab(RENDER[h[0]] ? h[0] : 'home');
  pollLive();
  if (window.OnyxLive) OnyxLive.mount({sport: SD.sport, home: 'oxLiveHome', games: 'oxLiveGames',
    open: (id, a, h) => { if (KIND === 'tennis') { const m = tnLiveId(id, a, h); if (m) openMatch(m); else gotoTab('games'); } else openGame(id); }});   // live value + spot plays (live.js)
  setTimeout(ypLoop, 2500);
  if ('serviceWorker' in navigator && location.protocol === 'https:') addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
})();
</script>
