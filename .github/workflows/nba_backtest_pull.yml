name: NBA backtest data pull (temporary, dev only)
on:
  push:
    branches: [claude/trusting-cori-4upy6e]
    paths: [tools/nba_backtest_pull.py, .github/workflows/nba_backtest_pull.yml]
permissions:
  contents: read
jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python3 tools/nba_backtest_pull.py
        env:
          OPTICODDS_API_KEY: ${{ secrets.OPTICODDS_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: nba-backtest-data
          path: bt/
