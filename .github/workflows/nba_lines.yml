name: NBA lines (fresh Onyx prices every 10 min, evenings)
# Edges are only as good as the line they are measured against. The full
# refresh (refresh_build.yml) pulls Onyx prices every ~30-35 minutes; NBA props
# move most in the hours before tip. This light run re-pulls ONLY the Onyx NBA
# prices and rebuilds nba.html in lines-only mode (NBA_LINES_ONLY=1): no
# grading, no new picks, no ticket changes, so it never writes a ledger and can
# never race the refresh on one. It commits only data/nba/props.json and
# nba.html. Picks still log in the refresh, at prices pulled seconds earlier
# (nba_build refuses to log off prices older than PICK_MAX_LINE_AGE_MIN).
on:
  schedule:
    # backup only: the loop runs on the sleeper (nba_lines_chain.yml) and the
    # refresh's kick, because scheduled crons proved unreliable. Every 10 min,
    # 6 PM - midnight ET in EDT. Exits in seconds unless a game tips within 4 hours.
    - cron: "5,15,25,35,45,55 22-23 * * *"
    - cron: "5,15,25,35,45,55 0-3 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
  actions: write
# its own group: never cancels or queues behind the full refresh (onyx-build).
# No cancel-in-progress: a run started by the refresh or the sleeper waits for
# one mid-push instead of killing it (a newer pending run replaces an older one).
concurrency:
  group: onyx-nba-lines
  cancel-in-progress: false
jobs:
  lines:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      go: ${{ steps.gate.outputs.go }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Any NBA game still to tip?
        id: gate
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json
          from datetime import datetime, timedelta, timezone
          try:
              s = json.load(open("data/nba/slate.json"))
          except Exception:
              s = {}
          now = datetime.now(timezone.utc)
          def pre(g):   # a game still to tip, within the next 4 hours (lines move most then)
              try:
                  t = datetime.fromisoformat(str(g["start"]).replace("Z", "+00:00"))
                  return g.get("state") == "pre" and now < t <= now + timedelta(hours=4)
              except Exception:
                  return False
          print("go=" + ("true" if any(pre(g) for g in s.get("games", [])) else "false"))
          EOF
      - name: Install dependencies
        if: steps.gate.outputs.go == 'true'
        run: pip install requests
      - name: NBA odds (Onyx book)
        if: steps.gate.outputs.go == 'true'
        run: python3 nba_odds.py
        timeout-minutes: 5
        # Onyx only: no ODDS_API_KEY, so the paid consensus fill (throttled by
        # props_meta.json, which this run does not commit) never runs here
        env:
          OPTICODDS_API_KEY: ${{ secrets.OPTICODDS_API_KEY }}
      - name: NBA build, lines only (no ledger writes)
        if: steps.gate.outputs.go == 'true'
        run: python3 nba_build.py
        timeout-minutes: 3
        env:
          NBA_LINES_ONLY: "1"
      - name: Validate build (blocks commit on failure)
        if: steps.gate.outputs.go == 'true'
        run: python3 validate_build.py
      - name: Commit lines (only props.json and nba.html)
        id: commit
        if: steps.gate.outputs.go == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/nba/props.json data/nba/top.json data/nba/board.json data/nba/tip_lines.json nba.html
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "NBA lines $(date -u +%Y-%m-%dT%H:%M)"
          # main moves under us (the refresh): rebase our two files on top,
          # preferring ours (fresher prices); no ledger file is in this commit
          for i in 1 2 3 4; do
            if git push; then break; fi
            git pull --rebase -X theirs origin main || { git rebase --abort || true; git pull --rebase -s ours origin main || true; }
            python3 -B newest_lines.py || true   # the newer Onyx NBA pull wins the race, not the later push
            sleep $((i * 3))
          done
          git push || { echo "::warning::push lost the race 4x; the next 10-min run recovers"; exit 0; }
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Deploy the latest main, not this run's snapshot
        # a run that pushed first but deploys last must not roll the page back
        if: steps.commit.outputs.changed == 'true'
        run: git fetch -q origin main && git checkout -q origin/main -- .
      - name: Upload Pages artifact
        if: steps.commit.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    needs: lines
    if: needs.lines.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Retry deploy once (Pages API hiccup)
        if: steps.deployment.outcome == 'failure'
        run: sleep 60
      - name: Deploy to GitHub Pages (second attempt)
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
  requeue:
    # the self-driving loop (scheduled crons alone proved unreliable): while a
    # game tips within 4 hours, arm the sleeper, which starts the next run
    needs: lines
    if: always() && needs.lines.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Arm the lines sleeper
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in 1 2 3; do
            gh workflow run nba_lines_chain.yml --repo ${{ github.repository }} --ref main && exit 0
            sleep $((i * 15))
          done
          echo "::warning::could not arm the lines sleeper; the refresh restarts the chain"
