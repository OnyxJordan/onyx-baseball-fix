name: Refresh (lineups + weather + odds, every 30 min)
on:
  schedule:
    # Every 30 minutes across the slate: 11 AM - 11 PM ET
    # (15-23 UTC + 0-3 UTC during EDT). Keeps HR-prop odds and the live
    # edge board fresh through in-game at-bats without over-spending Odds
    # API credits; the OpticOdds feed will sharpen this once wired in.
    - cron: "0,30 15-23 * * *"
    - cron: "0,30 0-3 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: onyx-build
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # full history: fetch_odds judges odds.json freshness by its last
          # commit time, which a shallow clone reports as "just now"
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests
      - name: Fetch fresh data
        run: python3 fetch_data.py
      - name: Fetch odds
        run: python3 fetch_odds.py
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      - name: Fetch Onyx game links
        run: python3 fetch_onyx.py
        env:
          OPTICODDS_API_KEY: ${{ secrets.OPTICODDS_API_KEY }}
      - name: Heal pitcher hands
        run: python3 heal_hands.py
      # grading rode ONLY the once-daily build; when that cron slipped
      # (8/2: no results on the site at noon), yesterday stayed ungraded
      # all day. Refresh runs now settle picks, tickets, calibration, and
      # the recap too — cheap no-ops when there is nothing pending.
      - name: Grade pending picks
        run: python3 grade_picks.py
      - name: Self-calibrate model
        run: python3 calibrate.py
      - name: Write daily recap
        run: python3 generate_recap.py
      - name: Build index.html
        run: python3 auto_build.py
      - name: Persist picks record
        run: python3 update_stats.py
      - name: Commit refresh (only if something changed)
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data index.html
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "nothing to commit"
          else
            git commit -m "Refresh build $(date -u +%Y-%m-%dT%H:%M)"
            # main moves under us (PR merges, sibling runs): rebase our build
            # commit on top and retry, preferring OUR files on conflict (the
            # freshly built data/index are newer and fully regenerable)
            for i in 1 2 3 4; do
              if git push; then break; fi
              echo "push rejected, rebasing onto fresh main (attempt $i)"
              git pull --rebase -X theirs origin main || { git rebase --abort || true; git pull --rebase -s ours origin main || true; }
              sleep $((i * 3))
            done
            git push || { echo "::warning::push lost the race 4x; next 30-min run recovers"; exit 0; }
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload Pages artifact
        if: steps.commit.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        uses: actions/deploy-pages@v4
