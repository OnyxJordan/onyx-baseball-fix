name: Accounts (turn on / update)
# Turns on Onyx Sports accounts (accounts.js): writes the Supabase project URL and its public
# (anon) key into accounts.json on main. The anon key is public by design (row-level security in
# supabase/schema.sql decides what anyone can read); the service key is never used or stored.
#
# One-time setup (Settings -> Secrets and variables -> Actions -> Variables tab):
#   variable SUPABASE_URL        https://<project>.supabase.co   (Supabase -> Project Settings -> API)
#   variable SUPABASE_ANON_KEY   the "anon public" key from the same page
# (Secrets with the same names work too.) Then: Actions -> "Accounts (turn on / update)" -> Run
# workflow. To turn accounts off again, run it with "Turn accounts off" ticked (the site goes back
# to device-only, nothing else changes).
on:
  workflow_dispatch:
    inputs:
      turn_off:
        description: "Turn accounts off (back to device-only)"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: accounts-config
  cancel-in-progress: false
jobs:
  config:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Write accounts.json
        env:
          # a repository variable, or a secret by the same name (the anon key is public either way)
          U: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          K: ${{ vars.SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
          OFF: ${{ inputs.turn_off }}
        run: |
          U=$(printf '%s' "$U" | tr -d '[:space:]'); K=$(printf '%s' "$K" | tr -d '[:space:]')
          if [ "$OFF" = "true" ]; then U=""; K="";
          elif [ -z "$U" ] || [ -z "$K" ]; then
            echo "::error::SUPABASE_URL and SUPABASE_ANON_KEY were not found (URL set: $([ -n "$U" ] && echo yes || echo no), key set: $([ -n "$K" ] && echo yes || echo no)). Add them under Settings -> Secrets and variables -> Actions, as Variables or Secrets, with exactly those names, then run this again."
            exit 1
          fi
          case "$U" in ""|https://*.supabase.co) ;; *) echo "::error::SUPABASE_URL should look like https://<project>.supabase.co"; exit 1;; esac
          if [ -n "$U" ]; then
            code=$(curl -s -o /dev/null -w '%{http_code}' "$U/auth/v1/settings" -H "apikey: $K")
            [ "$code" = "200" ] || { echo "::error::Supabase did not accept the URL and anon key (HTTP $code)"; exit 1; }
          fi
          python3 -c "import json,os; json.dump({'url': os.environ['U'].rstrip('/'), 'anon': os.environ['K']}, open('accounts.json','w')); open('accounts.json','a').write('\n')"
          if git diff --quiet -- accounts.json; then echo "accounts.json unchanged"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add accounts.json
          git commit -m "Accounts: $( [ -n "$U" ] && echo 'turn on' || echo 'turn off' ) (accounts.json)"
          for i in 1 2 3 4; do git pull --rebase origin main && git push origin HEAD:main && break; sleep $((i * 5)); done
