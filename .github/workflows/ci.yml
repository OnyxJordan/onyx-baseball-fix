name: CI (pull requests)

# The repo had NO pull-request check at all: every merge was verified only by
# whoever happened to be careful that day. This runs the same two gates the
# pipeline runs, against the PR's code, before it can reach main.
#
# It needs no secrets. auto_build.py builds from the data already committed in
# data/, which is why a local build works too - so a PR that breaks the build,
# corrupts a lineup or shrinks a ledger fails here rather than on the live site.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# a new push to the PR supersedes the previous check
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          # full history: validate_build diffs ledger row counts against HEAD
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      # Every pipeline script must at least parse on the pipeline's Python.
      # The build steps below never import the fetchers, so a syntax error
      # in one (an f-string that only newer Pythons accept took the NBA fetch
      # down on 10/25 behind continue-on-error) would otherwise pass CI.
      - name: Compile every Python file
        run: python3 -m py_compile *.py tools/*.py

      # No network fetches here on purpose: this validates the BUILD, not the
      # feeds. Using the committed data keeps the check fast and deterministic,
      # and means a flaky upstream API can never fail a PR.
      - name: Build index.html from committed data
        run: |
          python3 -B auto_build.py
          python3 -B update_stats.py

      - name: Validate build
        run: python3 validate_build.py

      # every push path (saved-pick updates, the recap, Onyx Pick alerts) against a fake Supabase that reads filters
      # like PostgREST and a scripted ESPN; nothing is sent (11/9 sweep: a bad timestamp had stopped every My picks push)
      - name: Notification sweep
        run: python3 -B tools/verify_alerts.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # full `playwright` here, not playwright-core: core cannot locate a
      # browser on its own, and the runner has no pre-installed one
      - name: Install headless browser
        run: |
          npm install playwright@1.64.1 playwright-core@1.64.1 --no-save   # pinned 11/5: npm shipped playwright 1.65.0 before its playwright-core
          npx playwright install --with-deps chromium

      # Same gate a human is told to run before shipping a shell change: walks
      # every tab, reads every typeof-guarded global, fails on any uncaught page
      # error or undefined/NaN in rendered text.
      - name: Headless page check (all tabs)
        run: node tools/verify_shell.js

      # NBA page: build from committed data/nba and walk its six tabs
      - name: Build nba.html from committed data
        run: python3 -B nba_build.py

      - name: Headless NBA page check
        run: node tools/verify_nba.js

      # Sport pages (NFL, college football, NHL, tennis, golf): build each from
      # committed data/<sport>/ and walk every tab at phone and desktop size
      - name: Build sport pages from committed data
        run: for s in nfl cfb nhl tennis golf cbb; do python3 -B sports_build.py $s; done

      - name: Headless sport page check
        run: node tools/verify_sports.js

      # Installed-iPhone gate for both pages: a 0 safe-area inset (what iOS
      # sometimes reports) must not put the header or menu under the status
      # bar, and the bottom menu must open, navigate and close.
      - name: Installed app (PWA) check
        run: node tools/verify_pwa.js

      # One account and one tracker on every page (11/2): the header Account
      # control and My picks on all pages at 390 and 1280px, identical, a save
      # star that raises the shared count, no errors, no sideways scroll.
      - name: Account and My picks on every page
        run: node tools/verify_account_ui.js
