name: NBA markets probe (temporary)
on:
  push:
    branches: [claude/trusting-cori-4upy6e]
    paths: [tools/nba_markets_probe.py, .github/workflows/nba_markets_probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
