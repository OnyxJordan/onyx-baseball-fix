name: Daily Onyx Build
on:
  schedule:
    # 11:30 AM ET = 15:30 UTC (EDT, Apr–Nov)
    - cron: "30 15 * * *"
  workflow_dispatch:  # allow manual trigger from Actions tab
permissions:
  contents: write
  pages: write
  id-token: write
# cancel-in-progress mirrors refresh_build.yml: a stuck run must never hold
# the group past the next 30-min refresh tick (8/6 froze the site for a day)
concurrency:
  group: onyx-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # full history: fetch_odds judges odds.json freshness by its last
          # commit time, which a shallow clone reports as "just now"
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests
      - name: Fetch daily data
        run: python3 fetch_data.py
      - name: Fetch odds
        run: python3 fetch_odds.py
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      - name: Fetch Onyx game links
        run: python3 fetch_onyx.py
        env:
          OPTICODDS_API_KEY: ${{ secrets.OPTICODDS_API_KEY }}
      - name: Heal pitcher hands
        run: python3 heal_hands.py
      # unconditional here: the daily build is the one guaranteed full refresh
      - name: Refresh playoff ratings
        run: python3 fetch_playoffs.py
        continue-on-error: true
      - name: Grade pending picks
        run: python3 grade_picks.py
      - name: Self-calibrate model
        run: python3 calibrate.py
      - name: Write daily recap
        run: python3 generate_recap.py
      - name: Build index.html
        run: python3 auto_build.py
      - name: Persist picks record
        run: python3 update_stats.py
      # NBA sister site (nba.html). Fully isolated from MLB: its own scripts
      # and data/nba/, and continue-on-error so an NBA failure can never block
      # or change the MLB build. Its ledger is still guarded by validate_build.
      - name: NBA fetch (OpticOdds first, ESPN backup)
        run: python3 nba_fetch.py
        continue-on-error: true
        timeout-minutes: 8
        env:
          OPTICODDS_API_KEY: ${{ secrets.OPTICODDS_API_KEY }}
      - name: NBA odds (Onyx book, consensus fills gaps)
        run: python3 nba_odds.py
        continue-on-error: true
        timeout-minutes: 5
        env:
          OPTICODDS_API_KEY: ${{ secrets.OPTICODDS_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      - name: NBA build (projections, picks ledger, nba.html)
        run: python3 nba_build.py
        continue-on-error: true
        timeout-minutes: 3
      # Onyx Sports pages beyond MLB and NBA (sport_shell.html, one engine):
      # each sport reads and writes only data/<sport>/ and <sport>.html, and
      # the step is continue-on-error, so no sport can block MLB, NBA or
      # another sport. sports_espn.py refreshes the slate (and the NFL box
      # scores the model reads); sports_build.py builds the page.
      - name: Sports pages (NFL, college football, NHL, tennis, golf)
        run: |
          for s in nfl cfb nhl tennis golf; do
            python3 sports_espn.py $s || echo "::warning::$s slate failed"
            python3 sports_odds.py $s || echo "::warning::$s Onyx prices failed"
            python3 sports_build.py $s || echo "::warning::$s build failed"
          done
        env:
          OPTICODDS_API_KEY: ${{ secrets.OPTICODDS_API_KEY }}
        continue-on-error: true
        timeout-minutes: 12
      # ROADMAP Phase 2, finally built. Blocks the commit when the page is
      # structurally broken, a batting slot is duplicated or missing, or a
      # graded ledger shrank. A non-zero exit here means yesterday's page stays
      # live instead of a broken one replacing it. NOT continue-on-error: the
      # whole point is that it stops the commit.
      - name: Validate build (blocks commit on failure)
        run: python3 validate_build.py

      - name: Commit refreshed data & index
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data index.html nba.html nfl.html cfb.html nhl.html tennis.html golf.html
          git commit -m "Daily build $(date -u +%Y-%m-%d)" || echo "nothing to commit"
          # survive races with sibling runs/PR merges: rebase + retry,
          # preferring OUR freshly built files on any conflict
          for i in 1 2 3 4; do
            if git push; then break; fi
            echo "push rejected, rebasing onto fresh main (attempt $i)"
            git pull --rebase -X theirs origin main || { git rebase --abort || true; git pull --rebase -s ours origin main || true; }
            python3 -B newest_lines.py || true   # the newer Onyx NBA pull wins the race, not the later push
            sleep $((i * 3))
          done
          git push || { echo "::warning::push lost the race 4x; next scheduled run recovers"; exit 0; }
      - name: Deploy the latest main, not this run's snapshot
        # a run that pushed first but deploys last must not roll the page back
        run: git fetch -q origin main && git checkout -q origin/main -- .
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        # the Pages API 503s in bursts (8/17: three midday deploys refused,
        # data commits unharmed) - one retry after a minute rides them out
        continue-on-error: true
      - name: Retry deploy once (Pages API hiccup)
        if: steps.deployment.outcome == 'failure'
        run: sleep 60
      - name: Deploy to GitHub Pages (second attempt)
        id: deployment2
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
