  }).join('');
  const btHead = two ? '<th>Model</th><th>Season avg</th><th>Last 3</th>' : '<th>Model</th><th>Baseline</th>';
  const btWin = bt.window || (bt.season ? bt.season + ' season' : '');
  const nx = tm.next && tm.next.opp ? `<span>next ${tm.next.wk ? 'wk ' + esc(tm.next.wk) + ' ' : ''}vs ${esc(tm.next.opp)}</span>` : '';
  el.innerHTML = `<div class="sec-hdr"><h2>Depth chart</h2><span class="dim mono" style="font-size:11px">${D.generated ? 'updated ' + esc(new Date(D.generated).toLocaleString('en-US', {month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit', timeZone: 'America/New_York'})) + ' ET' : ''}</span></div>
    <div class="dp-bar"><select aria-label="Team" onchange="dpPick(this.value)">${keys.map(k => `<option value="${esc(k)}"${k === DEPTH_TEAM ? ' selected' : ''}>${esc(T[k].name || k)}</option>`).join('')}</select>
      <div class="gc-sub">${views.map(([k, t]) => `<button class="${k === V ? 'on' : ''}" onclick="dpView('${k}')">${t}</button>`).join('')}</div></div>
    <div class="dp-team" data-oxt="${esc(DEPTH_TEAM)}">${lg(tm.logo)}<b>${esc(tm.name || DEPTH_TEAM)}</b><div class="dp-meta">${tm.pace != null ? `<span>${esc(D.pace_label || 'Pace')} ${esc(dpVal(tm.pace))}</span>` : ''}${nx}<span>${esc(D.use_label || useHd)}: ${V === 'proj' ? 'projected' : V === 'now' ? 'this season' : 'last season'}</span></div></div>
    <p class="dim" style="font-size:12px;margin:4px 0 0">${V === 'proj' ? 'Projected per game. Tap This season or Last season for what each player has done.' : V === 'now' ? 'Per game this season.' : 'Per game last season.'} A dash means no role in that number.</p>
    ${body || '<div class="empty">No players listed for this team yet.</div>'}
    <div class="lab" style="margin-top:20px"><div class="eb">How the depth chart works</div><p>${esc(D.method || '')}</p>
      ${btRows ? `<div style="overflow-x:auto"><table class="dp-bt"><thead><tr><th>Backtest${btWin ? ' · ' + esc(btWin) : ''}</th>${btHead}<th>Games</th></tr></thead><tbody>${btRows}</tbody></table></div><p class="dim" style="font-size:11px">Average miss per game; lower is better, green where the projection beats ${two ? 'both baselines' : 'the baseline'}.</p>` : ''}</div>`;
}
function dpMenuTile() {   // the menu drawer (ui.js) lists the sport tabs; add Depth to it
  const grid = document.querySelector('.osheet .ogrid');
  if (!TEAMK || !grid || grid.querySelector('[data-tab="depth"]')) return;
  const b = document.createElement('button');
  b.className = 'otile'; b.dataset.tab = 'depth';
  b.innerHTML = '<svg class="oi" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 3h12M2 6.5h9M2 10h12M2 13.5h7"/></svg><div><b>Depth</b><span>Depth charts, roles and usage</span></div>';
  b.addEventListener('click', () => { try { window.OnyxUI && OnyxUI.closeMenu(); } catch (e) {} gotoTab('depth'); });
  const model = grid.querySelector('[data-tab="model"]');
  grid.insertBefore(b, model || null);
}

// ── live: ESPN scoreboard every 30s (15s while anything is live) ────
var _poll = null;
function pollLive() {
  if (location.protocol === 'file:' || !(C.espn || []).length) return;
  const paths = C.espn;
  // college basketball's default scoreboard is not today's games: ask for the slate's day
  const q = [C.espn_q, KIND === 'basketball' && SD.date ? 'dates=' + SD.date.replace(/-/g, '') : ''].filter(Boolean).join('&');
  Promise.all(paths.map(p => fetch('https://site.api.espn.com/apis/site/v2/sports/' + p + '/scoreboard' + (q ? '?' + q : '')).then(r => r.json()).catch(() => null))).then(js => {
    let anyLive = false;
    js.forEach((j, pi) => {
      if (!j) return;
      if (TEAMK) {
        (j.events || []).forEach(e => {
          const c = (e.competitions || [{}])[0], st = (e.status || {}).type || {};
          const t = {}; (c.competitors || []).forEach(x => { t[x.homeAway] = x; });
          LIVE[e.id] = {state: st.state, detail: st.shortDetail || st.detail, away_score: (t.away || {}).score, home_score: (t.home || {}).score,
                        situation: c.situation || null, home_id: ((t.home || {}).team || {}).id};
          if (st.state === 'in') anyLive = true;
        });
      } else if (KIND === 'tennis') {
        (j.events || []).forEach(e => (e.groupings || []).forEach(gr => (gr.competitions || []).forEach(c => {
          (SD.events || []).forEach(ev => ev.matches.forEach(m => {
            if (m.id !== c.id) return;
            const st = (c.status || {}).type || {};
            m.state = st.state; m.detail = st.shortDetail || st.detail;
            (c.competitors || []).forEach((p, i) => { if (m.p[i]) { m.p[i].sets = (p.linescores || []).map(l => +l.value || 0); m.p[i].win = !!p.winner; m.p[i].serve = !!p.possession; } });
            if (m.state === 'in') anyLive = true;
          }));
        })));
      } else if (KIND === 'golf') {
        (j.events || []).forEach(e => {
          const ev = (SD.events || []).find(x => x.id === e.id); if (!ev) return;
          const c = (e.competitions || [{}])[0];
          ev.board = gfParse(c);
          ev.state = ((e.status || {}).type || {}).state; ev.detail = ((e.status || {}).type || {}).shortDetail;
          if (ev.state === 'in') anyLive = true;
        });
      }
    });
    if (KIND === 'golf') { gfAlerts(); ['ypHome', 'ypGames'].forEach(i => { const y = document.getElementById(i); if (y) y.innerHTML = yourPlayers(); }); }
    if (KIND === 'tennis') { tnAlerts(); ['ypHome', 'ypGames'].forEach(i => { const y = document.getElementById(i); if (y) y.innerHTML = yourPlayers(); }); }
    ticker();
    if (currentTab === 'games' && !(document.activeElement && document.activeElement.tagName === 'INPUT')) {
      if (TEAMK) { if (OPEN_GAME) { drawGame(OPEN_GAME); } else renderGames(); } else renderGames();
    } else if (currentTab === 'home') renderHome();
    clearTimeout(_poll); _poll = setTimeout(pollLive, anyLive ? 10000 : 30000);
  });
}
// search (ui.js): teams and players on this page
window.OX_SEARCH = function (go) {
  const out = [];
  (SD.games || []).forEach(g => out.push({label: `${g.away_name || g.away} @ ${g.home_name || g.home}`, sub: tipTime(g.start), run: () => openGame(g.gid)}));
  ((SD.model || {}).rows || []).slice(0, 300).forEach(r => out.push({label: r.name, sub: `${r.team} · ${MKT_NAME[r.mkt] || r.mkt} ${num(r.proj)}`, run: () => { go('plays'); }}));
  (SD.events || []).forEach(e => (e.board || []).slice(0, 150).forEach(r => out.push({label: r.name, sub: `${e.name} · ${r.pos} · ${r.to_par}`, run: () => { GQ = String(r.name).toLowerCase(); go('games'); }})));
  if (TEAMK) {   // depth charts: the page, and each team on the slate
    out.push({label: 'Depth charts', sub: 'PAGE', run: () => go('depth')});
    const seen = {};
    (SD.games || []).forEach(g => [[g.away, g.away_name], [g.home, g.home_name]].forEach(([t, n]) => {
      if (seen[t]) return; seen[t] = 1;
      out.push({label: `${n || t} depth chart`, sub: 'DEPTH', run: () => { DEPTH_TEAM = t; go('depth'); }});
    }));
  }
  return out;
};

function initAnalytics() {
  if (!GA_MEASUREMENT_ID || location.protocol !== 'https:') return;
  window.dataLayer = window.dataLayer || [];
  window.gtag = function () { dataLayer.push(arguments); };
  gtag('js', new Date()); gtag('config', GA_MEASUREMENT_ID);
  const s = document.createElement('script'); s.async = true; s.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA_MEASUREMENT_ID; document.head.appendChild(s);
}
RENDER = {home: renderHome, games: renderGames, board: renderBoard, plays: renderPlays, model: renderModel};
if (TEAMK) RENDER.depth = renderDepth;
(function boot() {
  buildNav(); ticker(); initAnalytics();
  const art = document.getElementById('heroArt');
  if (art) { art.dataset.oxArt = C.art || 'field'; art.dataset.oxTone = C.tone || 'purple'; art.dataset.oxFade = '0'; }
  const h = (location.hash || '').replace('#', '').split(':');
  if (h[0] === 'games' && h[1]) OPEN_GAME = h[1];
  if (h[0] === 'depth' && h[1]) DEPTH_TEAM = decodeURIComponent(h[1]);
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => setTimeout(dpMenuTile, 0)); else setTimeout(dpMenuTile, 0);
  gotoTab(RENDER[h[0]] ? h[0] : 'home');
  pollLive();
  setTimeout(ypLoop, 2500);
  if ('serviceWorker' in navigator && location.protocol === 'https:') addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
})();
</script>
