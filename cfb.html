<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">

<link rel="manifest" href="manifest.json">

<meta name="apple-mobile-web-app-status-bar-style" content="black">

<script>window.OX_SITE = 'cfb';</script>
<!-- shared app shell: bottom menu, search, toasts, status-bar fix (ui.js) -->
<script src="ui.js" defer></script>

<!-- sport_shell.html: one template for every Onyx Sports page beyond MLB and
     NBA (NFL, college football, NHL, tennis, golf). sports_build.py injects
     the MLB stylesheet (one design system), the sport's data and its key. -->
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{overflow-x:hidden}
:root{--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  /* Onyx brand hub palette: Onyx 800 ground, neutral surfaces, Titanium
     text, Purple 400 leads, Seed greens, Blue 400 + Purple 200 accents.
     Spark (yellow) is deliberately absent - not used on this site. */
  --bg:        #0c0c0c;
  --bg2:       #121212;
  --bg3:       #151515;
  --bg4:       #191919;
  --bg5:       #1f1f1f;
  --border:    #222225;
  --border2:   #2c2c30;
  --border3:   #38383c;
  --text:      #fcfcfc;
  --text2:     #9b9b9b;
  --text3:     #6e6e72;
  /* Real logo colors */
  --logo-purple: #b038f9;
  --logo-blue:   #635bff;
  /* Seed accent — the brand green */
  --green:     #61e970;
  --green2:    #00b000;
  --green3:    #00b000;
  --green-dim: rgba(97,233,112,.12);
  --green-glow:rgba(97,233,112,.06);
  /* Other semantic */
  --red:       #ef4444;
  --red-dim:   rgba(239,68,68,.12);
  --gold:      #d795ff;   /* Purple 200 carries every old amber accent */
  --gold-dim:  rgba(215,149,255,.14);
  --blue-acc:  #635bff;
  --blue-dim:  rgba(99,91,255,.12);
  /* Brand gradient - Purple 400 to Blue 400 to Seed 400 */
  --brand-grad: linear-gradient(90deg, #b038f9 0%, #635bff 50%, #61e970 100%);
  --brand-grad-diag: linear-gradient(135deg, #b038f9 0%, #635bff 60%, #61e970 100%);
}

html{scroll-behavior:smooth;background:var(--bg)}
body{color:var(--text);font-family:'Space Grotesk',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:14px;min-height:100vh;overflow-x:hidden;max-width:100vw}
.mono{font-family:'SF Mono','Fira Code','Fira Mono','Roboto Mono',monospace}

/* ── NAV ─────────────────────────────────────────────────────── */
.nav{
  /* installed PWA draws under the status bar / Dynamic Island: the
     safe-area inset pushes the header (and its tap targets) below it */
  height:calc(58px + var(--sat));
  padding:var(--sat) 20px 0;
  display:flex;align-items:center;gap:0;
  background:rgba(12,12,12,.92);
  border-bottom:1px solid rgba(255,255,255,.06);
  position:sticky;top:0;z-index:200;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  box-shadow:0 1px 0 rgba(255,255,255,.03),0 4px 32px rgba(0,0,0,.5);
}
.nav-logo{display:flex;align-items:center;gap:10px;text-decoration:none;flex-shrink:0;margin-right:28px}
.logo-svg{width:34px;height:34px;flex-shrink:0}
.logo-words{line-height:1}
.logo-onyx{font-size:16px;font-weight:800;letter-spacing:.06em;color:var(--text)}
.logo-sub{font-size:9px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:#d795ff;margin-top:1px}
.nav-tabs{display:flex;gap:0;flex:1}
.nav-tab{
  height:58px;display:flex;align-items:center;gap:7px;
  padding:0 16px;font-size:13px;font-weight:500;
  color:var(--text3);cursor:pointer;
  border-bottom:2px solid transparent;
  transition:all .15s;white-space:nowrap;background:none;border-top:none;border-left:none;border-right:none;
}
.nav-tab:hover{color:var(--text2)}
.nav-tab.active{color:var(--text);border-bottom-color:var(--neon-green);text-shadow:0 0 12px rgba(0,255,136,.3)}
.nav-tab svg{width:15px;height:15px;opacity:.7}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.nav-date{font-size:11px;font-weight:500;letter-spacing:.06em;color:var(--text3);font-family:'SF Mono','Fira Code','Fira Mono','Roboto Mono',monospace}
.nav-badge{
  background:rgba(0,255,136,.08);border:1px solid rgba(0,255,136,.2);
  color:var(--neon-green);padding:3px 10px;border-radius:20px;
  font-size:10px;font-weight:700;font-family:'SF Mono','Fira Code','Fira Mono','Roboto Mono',monospace;
  letter-spacing:.04em;
  box-shadow:0 0 12px rgba(0,255,136,.12);
  text-shadow:0 0 8px rgba(0,255,136,.4);
}

/* ── BRAND LINE ───────────────────────────────────────────────── */
.brand-line{height:1px;background:linear-gradient(90deg,transparent 0%,#635bff 20%,#61e970 50%,#b038f9 80%,transparent 100%);opacity:.9}

/* ── SEARCH ───────────────────────────────────────────────────── */
.search-bar{
  padding:10px 20px;background:var(--bg2);
  border-bottom:1px solid var(--border);
}
.search-inner{
  display:flex;align-items:center;gap:10px;
  background:var(--bg3);border:1px solid var(--border);border-radius:8px;
  padding:9px 14px;transition:border-color .15s;max-width:520px;
}
.search-inner:focus-within{border-color:var(--border3)}
.search-inner svg{width:14px;height:14px;color:var(--text3);flex-shrink:0;fill:none;stroke:currentColor;stroke-width:2}
.search-inner input{
  background:none;border:none;outline:none;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:13px;color:var(--text);width:100%;
}
.search-inner input::placeholder{color:var(--text3)}

/* ── PANE SYSTEM ─────────────────────────────────────────────── */
.pane{display:none;animation:fadeUp .2s ease}
.pane.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:translateY(0)}}

/* ── SECTION HEADER ──────────────────────────────────────────── */
.sec-hdr{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 20px 10px;
}
.sec-title{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3)}
.sec-count{font-size:12px;font-weight:400;color:var(--text3);font-family:'SF Mono','Fira Code','Fira Mono','Roboto Mono',monospace}

/* ── TEAM LOGO BADGE ─────────────────────────────────────────── */
.team-badge{
  width:32px;height:32px;border-radius:8px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-family:'SF Mono','Fira Code','Fira Mono','Roboto Mono',monospace;font-size:9px;font-weight:700;
  overflow:hidden;position:relative;
}
.team-badge-sm{width:24px;height:24px;border-radius:6px;font-size:8px}
.team-badge-lg{width:38px;height:38px;border-radius:9px;font-size:10px}

/* ── HR TARGET CARDS ─────────────────────────────────────────── */
.targets-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(296px,1fr));
  gap:8px;padding:0 20px 12px;
}
.tcard{
  background:var(--bg2);border:1px solid var(--border);border-radius:10px;
  padding:13px 14px;cursor:pointer;transition:border-color .15s, box-shadow .15s;
  position:relative;overflow:hidden;
}
.tcard::after{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:var(--brand-grad);opacity:0;transition:opacity .2s;
}
.tcard:hover{border-color:var(--border3);box-shadow:0 0 0 1px rgba(97,233,112,.08)}
.tcard:hover::after{opacity:1}

.tc-row1{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}
.tc-badge{
  display:flex;align-items:center;justify-content:center;
  width:38px;height:38px;border-radius:9px;flex-shrink:0;
  font-family:'SF Mono','Fira Code','Fira Mono','Roboto Mono',monospace;font-size:10px;font-weight:700;
  overflow:hidden;
}
.tc-meta{flex:1;min-width:0}
.tc-name{font-size:14px;font-weight:700;line-height:1.2;color:var(--text)}
.tc-sub{font-size:11px;color:var(--text3);margin-top:2px}
.tc-pct-wrap{text-align:right;flex-shrink:0}
.tc-pct{font-size:24px;font-weight:800;line-height:1;font-family:'SF Mono','Fira Code','Fira Mono','Roboto Mono',monospace}
.tc-grade{font-size:9px;font-weight:700;letter-spacing:.08em;text-align:right;margin-top:2px;text-transform:uppercase}

/* Pitcher strip */
.tc-pitcher{
  display:flex;align-items:center;gap:7px;
  background:var(--bg4);border:1px solid var(--border);border-radius:7px;
  padding:7px 10px;margin-bottom:8px;
}
.tc-p-name{font-size:12px;font-weight:600;color:var(--text2);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hand-pill{
  padding:1px 6px;border-radius:4px;
  font-size:10px;font-weight:700;font-family:'SF Mono','Fira Code','Fira Mono','Roboto Mono',monospace;flex-shrink:0;
}
.lhp{background:rgba(99,91,255,.2);color:#9d96ff}
.rhp{background:rgba(176,56,249,.2);color:#d070ff}
.tc-p-hr9{font-family:'SF Mono','Fira Code','Fira Mono','Roboto Mono',monospace;font-size:11px;flex-shrink:0}
.tc-p-era{font-family:'SF Mono','Fira Code','Fira Mono','Roboto Mono',monospace;font-size:10px;color:var(--text3);flex-shrink:0}

/* Stats row */
.tc-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-bottom:8px}
.tc-s{background:var(--bg4);border-radius:6px;padding:6px 8px;text-align:center}
.tc-s-val{font-family:'SF Mono','Fira Code','Fira Mono','Roboto Mono',monospace;font-size:13px;font-weight:700;line-height:1}
.tc-s-lbl{font-size:9px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin-top:2px}

/* Bottom row */
.tc-bot{display:flex;align-items:center;justify-content:space-between;padding-top:8px;border-top:1px solid var(--border)}
.tc-dfs{display:flex;gap:5px}
.dfs-chip{
  padding:2px 7px;border-radius:4px;
  font-size:10px;font-weight:700;font-family:'SF Mono','Fira Code','Fira Mono','Roboto Mono',monospace;
}
.dk{background:rgba(99,91,255,.15);color:#60a5fa}
.ap{background:var(--green-dim);color:var(--green)}
.tc-env{display:flex;align-items:center;gap:5px}
.wind-chip{
  padding:1px 7px;border-radius:4px;
  font-size:10px;font-weight:700;font-family:'SF Mono','Fira Code','Fira Mono','Roboto Mono',monospace;
}
.wout{background:rgba(97,233,112,.15);color:#4ade80}
.win{background:rgba(239,68,68,.15);color:#f87171}
.wcross{background:rgba(255,255,255,.07);color:var(--text3)}
.wdome{background:rgba(255,255,255,.05);color:var(--text3)}
.env-mult{font-family:'SF Mono','Fira Code','Fira Mono','Roboto Mono',monospace;font-size:10px;font-weight:600}

/* ── GAME CARD (Onyx odds layout) ────────────────────────────── */
.games-wrap{padding:0 20px 24px}
.odds-col-hdr{
  display:grid;grid-template-columns:1fr 100px 110px 90px;
  padding:6px 14px;
  font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--text3);border-bottom:1px solid var(--border);
}
.game-card{
  border:1px solid var(--border);border-radius:10px;
  overflow:hidden;margin-bottom:8px;
  transition:border-color .15s;
}
.game-card:hover{border-color:var(--border2)}

.game-hdr{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 14px;background:var(--bg3);border-bottom:1px solid var(--border);
}
.game-time{font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--text3);font-family:'SF Mono','Fira Code','Fira Mono','Roboto Mono',monospace}
.game-pills{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.gpill{
  padding:2px 8px;border-radius:4px;
  font-size:10px;font-weight:700;font-family:'SF Mono','Fira Code','Fira Mono','Roboto Mono',monospace;
}
.gpill-ou{background:rgba(99,91,255,.15);color:#60a5fa}
.gpill-venue{background:rgba(255,255,255,.06);color:var(--text3);font-weight:500}
.gpill-env{font-weight:700}

.team-row{
  display:grid;grid-template-columns:1fr 120px 130px 110px;
  padding:11px 14px;border-bottom:1px solid rgba(26,37,53,.7);
  align-items:center;cursor:pointer;transition:background .12s;
}
.team-row:last-of-type{border-bottom:none}
.team-row:hover{background:rgba(255,255,255,.02)}
.team-row.home{background:rgba(255,255,255,.01)}

.tr-info{display:flex;align-items:center;gap:10px;min-width:0}
.tr-text{min-width:0;overflow:hidden}
.tr-name,.tr-pitcher,.tr-top{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr-text{min-width:0}
.tr-name{font-size:13px;font-weight:700;line-height:1.2}
.tr-pitcher{font-size:11px;color:var(--text3);margin-top:2px}
.tr-top{font-size:11px;color:var(--text3);margin-top:2px}
.tr-top strong{color:var(--text2)}

.odds-val{text-align:center}
.odds-main{font-family:'SF Mono','Fira Code','Fira Mono','Roboto Mono',monospace;font-size:13px;font-weight:700;color:var(--text)}
.odds-sub{font-family:'SF Mono','Fira Code','Fira Mono','Roboto Mono',monospace;font-size:11px;color:var(--text3);margin-top:1px}

.ml-pill{
  padding:6px 0;border-radius:7px;text-align:center;
  font-family:'SF Mono','Fira Code','Fira Mono','Roboto Mono',monospace;font-size:13px;font-weight:800;
  min-width:72px;display:inline-block;
}
.ml-fav{background:rgba(97,233,112,.12);border:1px solid rgba(97,233,112,.2);color:#4ade80}
.ml-dog{background:var(--bg4);border:1px solid var(--border);color:var(--text2)}

.game-more{
  padding:7px 14px;text-align:right;font-size:11px;color:var(--text3);
  background:var(--bg3);border-top:1px solid var(--border);cursor:pointer;
  transition:color .12s;
}
.game-more:hover{color:var(--green)}

/* ── RANKINGS TABLE ──────────────────────────────────────────── */
.rank-filters{display:flex;gap:6px;padding:10px 20px;flex-wrap:wrap}
.rfchip{
  padding:4px 12px;border-radius:20px;font-size:11px;font-weight:600;
  background:var(--bg3);border:1px solid var(--border);color:var(--text3);
  cursor:pointer;transition:all .15s;white-space:nowrap;
}
.rfchip:hover{color:var(--text2)}
.rfchip.active{background:var(--green-dim);border-color:rgba(97,233,112,.3);color:var(--green)}
.rfchip.game-active{background:rgba(99,91,255,.1);border-color:rgba(99,91,255,.25);color:#60a5fa}

.rank-wrap{padding:0 20px 24px}
.rank-scroll{overflow:auto;max-height:calc(100vh - 220px);border-radius:8px;border:1px solid var(--border)}
.rank-table{width:100%;border-collapse:collapse;table-layout:fixed}
.rank-table th{
  padding:7px 8px;text-align:right;
  font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--text3);border-bottom:1px solid var(--border);
  cursor:pointer;user-select:none;white-space:nowrap;overflow:hidden;
  background:var(--bg2);position:sticky;top:0;z-index:5;
}
.rank-table th:first-child,.rank-table th:nth-child(2),.rank-table th:nth-child(4){text-align:left}
.rank-table th:hover{color:var(--text2)}
.rank-table th.asc::after{content:' ↑';color:var(--green)}
.rank-table th.desc::after{content:' ↓';color:var(--green)}
.rank-table td{padding:7px 8px;border-bottom:1px solid rgba(26,37,53,.5);vertical-align:middle;text-align:right;overflow:hidden;white-space:nowrap}
.rank-table tr:hover td{background:rgba(255,255,255,.025)!important}
.rn{font-family:'SF Mono','Fira Code','Fira Mono','Roboto Mono',monospace;font-size:11px;color:var(--text3);width:28px}
.rprob{font-family:'SF Mono','Fira Code','Fira Mono','Roboto Mono',monospace;font-size:14px;font-weight:800;text-align:right;white-space:nowrap}
.rmono{font-family:'SF Mono','Fira Code','Fira Mono','Roboto Mono',monospace;font-size:12px;color:var(--text2)}
.env-cell{font-size:10px;font-family:'SF Mono','Fira Code','Fira Mono','Roboto Mono',monospace;line-height:1.7}

/* ── DFS ─────────────────────────────────────────────────────── */
.dfs-hdr{padding:14px 20px 10px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.dfs-toggle{display:flex;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:3px}
.dfs-btn{
  padding:5px 18px;border-radius:6px;font-size:12px;font-weight:700;
  cursor:pointer;transition:all .15s;color:var(--text3);border:none;background:none;
}
.dfs-btn.active{background:var(--green);color:#000}
.dfs-note{font-size:11px;color:var(--text3);font-family:'SF Mono','Fira Code','Fira Mono','Roboto Mono',monospace}

.dfs-wrap{padding:0 20px 24px}
.dfs-scroll{overflow:auto;max-height:calc(100vh - 220px);border-radius:8px;border:1px solid var(--border)}
.dfs-table{width:100%;border-collapse:collapse;table-layout:fixed}
.dfs-table th{
  padding:7px 8px;text-align:right;
  font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--text3);border-bottom:1px solid var(--border);
  white-space:nowrap;overflow:hidden;
  background:var(--bg2);position:sticky;top:0;z-index:5;
}
.dfs-table th:first-child,.dfs-table th:nth-child(2),.dfs-table th:nth-child(3){text-align:left}
.dfs-table td{padding:7px 8px;border-bottom:1px solid rgba(26,37,53,.5);vertical-align:middle;text-align:right;overflow:hidden;white-space:nowrap}
.dfs-table tr:hover td{background:rgba(255,255,255,.025)!important}
.dfs-score{font-family:'SF Mono','Fira Code','Fira Mono','Roboto Mono',monospace;font-size:17px;font-weight:800;text-align:right}
.bar-wrap{width:64px;height:4px;background:var(--bg4);border-radius:2px;display:inline-block;vertical-align:middle}
.bar-fill{height:4px;border-radius:2px;background:var(--brand-grad)}

/* ── POWER ───────────────────────────────────────────────────── */
.power-table{width:100%;border-collapse:collapse;table-layout:fixed}
.power-table th{
  padding:7px 8px;text-align:right;
  font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--text3);border-bottom:1px solid var(--border);
  cursor:pointer;user-select:none;white-space:nowrap;overflow:hidden;
  background:var(--bg2);position:sticky;top:0;z-index:5;
}
.power-table th:first-child,.power-table th:nth-child(2){text-align:left}
.power-table th:hover{color:var(--text2)}
.power-table th.asc::after{content:' ↑';color:var(--green)}
.power-table th.desc::after{content:' ↓';color:var(--green)}
.power-table td{padding:7px 8px;border-bottom:1px solid rgba(26,37,53,.5);vertical-align:middle;text-align:right;overflow:hidden;white-space:nowrap}
.power-table td:first-child,.power-table td:nth-child(2){text-align:left}
.power-table tr:hover td{background:rgba(255,255,255,.025)!important}
.lineup-hdr{padding:12px 20px 8px;border-bottom:1px solid var(--border)}
.lineup-body{padding:16px 20px 32px}
.lu-game-btn{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:7px 10px;cursor:pointer;text-align:left;transition:border-color .15s,background .15s;width:100%}
.lu-game-btn.active{border-color:var(--logo-purple);background:rgba(176,56,249,.08)}
.lu-game-btn:hover{border-color:var(--text3)}
.lu-card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:12px 16px;margin-bottom:8px;display:flex;align-items:center;gap:14px}
.lu-slot{font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--text3);text-transform:uppercase;width:36px;flex-shrink:0}
.lu-name{font-size:14px;font-weight:700;flex:1;min-width:0}
.lu-sub{font-size:10px;color:var(--text3);margin-top:1px}
.lu-pts{font-family:'SF Mono','Fira Code','Fira Mono','Roboto Mono',monospace;font-size:18px;font-weight:800;color:var(--green);min-width:40px;text-align:right}
.lu-sal{font-family:'SF Mono','Fira Code','Fira Mono','Roboto Mono',monospace;font-size:12px;color:var(--text2);min-width:68px;text-align:right}
.lu-val{font-family:'SF Mono','Fira Code','Fira Mono','Roboto Mono',monospace;font-size:11px;color:var(--text3);min-width:44px;text-align:right}
.lu-totals{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:12px 16px;margin-top:4px;display:flex;justify-content:space-between;align-items:center}
.power-note{padding:10px 20px;font-size:11px;color:var(--text3)}
.power-wrap{padding:0 20px 24px}
.power-scroll{overflow:auto;max-height:calc(100vh - 180px);border-radius:8px;border:1px solid var(--border)}

/* ── SCROLLBAR ───────────────────────────────────────────────── */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* Mobile */
@media(max-width:600px){
  .nav{padding:var(--sat) 12px 0}
  .nav-tab{padding:0 11px;font-size:12px}
  .targets-grid{grid-template-columns:1fr;padding:0 12px 12px}
  .sec-hdr,.search-bar,.games-wrap,.rank-wrap,.dfs-wrap,.power-wrap,.rank-filters,.power-note,.dfs-hdr{padding-left:12px;padding-right:12px}
  .odds-col-hdr,.team-row{grid-template-columns:1fr 80px 90px}
  .odds-col-hdr .col-ml,.team-row .col-ml{display:none}
}

/* ── NAV DROPDOWNS ───────────────────────────────────────────── */
.nav-tabs{display:flex;gap:0;align-items:center;flex:1}
.nav-dropdown{position:relative;isolation:isolate}
.nav-dropdown-btn{display:flex;align-items:center;gap:6px;height:58px;padding:0 14px;font-size:13px;font-weight:500;background:none;border:none;border-bottom:2px solid transparent;color:var(--text3);cursor:pointer;transition:all .15s;white-space:nowrap}
.nav-dropdown-btn:hover{color:var(--text2)}
.nav-dropdown-btn.dd-active{color:var(--text);border-bottom-color:var(--neon-green)}
.dd-arrow{font-size:9px;transition:transform .2s;margin-left:2px;opacity:.6}
.nav-dropdown.dd-open .dd-arrow{transform:rotate(180deg)}
.nav-dropdown-menu{display:none;position:absolute;top:calc(100% + 4px);left:0;background:rgba(18,18,18,.97);border:1px solid var(--border2);border-radius:10px;padding:4px;min-width:175px;z-index:99999;box-shadow:0 12px 40px rgba(0,0,0,.9);flex-direction:column;gap:2px;backdrop-filter:blur(20px)}
.nav-dropdown.dd-open .nav-dropdown-menu{display:flex}
.dd-item{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:7px;font-size:13px;font-weight:500;color:var(--text2);background:transparent;border:none;cursor:pointer;transition:all .12s;text-align:left;width:100%;height:auto;border-bottom:none}
.dd-item:hover{background:var(--bg4);color:var(--text)}
.dd-item.active{color:var(--neon-green)}
.dd-item svg,.nav-dropdown-btn svg{width:14px;height:14px;flex-shrink:0;opacity:.7}

/* ── MOBILE HAMBURGER ────────────────────────────────────────── */
.nav-hamburger{
  display:none;
  align-items:center;justify-content:center;
  width:40px;height:40px;border-radius:8px;
  background:none;border:1px solid var(--border2);
  color:var(--text2);cursor:pointer;flex-shrink:0;margin-left:auto;
}
.nav-hamburger svg{width:18px;height:18px}

/* Mobile full-screen nav drawer */
.nav-drawer{
  display:none;
  position:fixed;inset:0;z-index:10000;
  background:rgba(12,12,12,.98);
  backdrop-filter:blur(20px);
  flex-direction:column;
  padding:0;
  overflow-y:auto;
}
.nav-drawer.open{display:flex}
.nav-drawer-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:var(--sat) 20px 0;
  height:calc(58px + var(--sat));
  border-bottom:1px solid var(--border);flex-shrink:0;
}
.nav-drawer-close{
  display:flex;align-items:center;justify-content:center;
  width:36px;height:36px;border-radius:8px;
  background:var(--bg3);border:1px solid var(--border2);
  color:var(--text2);cursor:pointer;
}
.nav-drawer-close svg{width:16px;height:16px}
.nav-drawer-body{padding:12px 16px;flex:1}
.drawer-section{margin-bottom:8px}
.drawer-section-label{
  font-size:9px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
  color:var(--text3);padding:8px 12px 4px;
}
.drawer-item{
  display:flex;align-items:center;gap:12px;
  padding:13px 14px;border-radius:10px;
  font-size:14px;font-weight:500;color:var(--text2);
  background:none;border:none;cursor:pointer;width:100%;text-align:left;
  transition:background .12s,color .12s;
}
.drawer-item:hover,.drawer-item.active{background:var(--bg3);color:var(--text)}
.drawer-item.active{color:var(--neon-green)}
.drawer-item svg{width:16px;height:16px;flex-shrink:0;opacity:.7}
.drawer-divider{height:1px;background:var(--border);margin:8px 0}

@media(max-width:700px){
  /* Nav */
  .nav{padding:var(--sat) 16px 0}
  .nav-tabs{display:none}
  .nav-hamburger{display:flex}
  .nav-right .nav-badge{display:none}
  .nav-logo{margin-right:0}
  /* Hero */
  .home-hero{padding:44px 20px 0;min-height:auto}
  .hero-ticker-wrap{margin:28px -20px 0 -20px;width:calc(100% + 40px);max-width:100vw}
  .score-ticker-bar{height:36px}
  .score-game{padding:0 14px;height:36px}
  .sticker-logo{width:18px;height:18px}
  .home-hero-title{font-size:clamp(38px,10vw,54px)}
  .home-hero-sub{font-size:14px}
  .hero-live-badge{margin-bottom:16px}
  /* Stats */
  .home-stats-grid{grid-template-columns:1fr 1fr}
  /* Content */
  .home-body{padding:28px 16px}
  .flag-grid{grid-template-columns:1fr 1fr}
  .model-notes-grid{grid-template-columns:1fr}
  /* Board */
  .targets-grid{grid-template-columns:1fr;padding:0 12px 12px}
  .games-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  /* Search */
  .search-bar{padding:8px 12px}
  /* Model page */
  .factor-grid{grid-template-columns:1fr}
  .spec-table td:first-child{width:140px;white-space:normal}
  .home-body{padding:24px 16px}
  /* DFS record */
  .pane[id="pane-dfsrecord"]{padding:12px 8px}
}
@media(max-width:400px){
  .home-stats-grid{grid-template-columns:1fr 1fr}
  .flag-grid{grid-template-columns:1fr}
  .home-hero-title{font-size:36px}
  .targets-grid{grid-template-columns:1fr;padding:0 8px 8px}
}


/* ── HOME / LANDING PAGE ────────────────────────────────────── */
#pane-home{padding:0}

/* ════════════════════════════════════════════════════════════════
   HOME — 2026 REDESIGN
   ════════════════════════════════════════════════════════════════ */

/* Google Font — sharp, futuristic display */
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Syne:wght@700;800&display=swap');

:root {
  --font-display: 'Syne', -apple-system, sans-serif;
  --font-body:    'Space Grotesk', -apple-system, sans-serif;
  /* Extended palette */
  --neon-green:   #61e970;
  --neon-purple:  #b038f9;
  --neon-blue:    #635bff;
  --glass-bg:     rgba(18,18,18,.7);
  --glass-border: rgba(255,255,255,.06);
}

/* ── NOISE TEXTURE overlay ── */
#pane-home::after {
  content:'';pointer-events:none;
  position:fixed;inset:0;z-index:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");
  background-size:200px 200px;opacity:.4;
}
#pane-home > * { position:relative;z-index:1; }

/* ── HERO ── */
.home-hero {
  position:relative;overflow:hidden;
  padding:clamp(64px,8vw,110px) clamp(20px,5vw,72px) clamp(56px,7vw,96px);
  min-height:clamp(480px,55vh,680px);
  display:flex;flex-direction:column;justify-content:flex-end;
  background:var(--bg);
}

/* Animated mesh gradient */
.home-hero::before {
  content:'';position:absolute;inset:-60px;z-index:0;
  background:
    radial-gradient(ellipse 55% 55% at 75% 30%, rgba(99,91,255,.14) 0%, transparent 65%),
    radial-gradient(ellipse 45% 45% at 25% 70%, rgba(176,56,249,.10) 0%, transparent 60%),
    radial-gradient(ellipse 60% 40% at 50% 10%,  rgba(0,255,136,.06) 0%, transparent 55%),
    radial-gradient(ellipse 35% 35% at 85% 85%, rgba(10,132,255,.08) 0%, transparent 50%);
  animation:meshShift 12s ease-in-out infinite alternate;
  pointer-events:none;
}
@keyframes meshShift {
  0%   { transform:translate(0,0) scale(1); }
  33%  { transform:translate(-20px,10px) scale(1.03); }
  66%  { transform:translate(15px,-8px) scale(.98); }
  100% { transform:translate(-8px,18px) scale(1.02); }
}

/* Grid lines */
.home-hero::after {
  content:'';position:absolute;inset:0;z-index:0;pointer-events:none;
  background-image:
    linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
  background-size:60px 60px;
  mask-image:radial-gradient(ellipse 80% 80% at 50% 50%, black 30%, transparent 80%);
}

.home-hero-inner {
  position:relative;z-index:2;max-width:860px;
}

/* Live badge */
.hero-live-badge {
  display:inline-flex;align-items:center;gap:7px;
  padding:5px 12px 5px 8px;border-radius:100px;margin-bottom:28px;
  background:rgba(0,255,136,.07);border:1px solid rgba(0,255,136,.18);
  font-family:var(--font-body);font-size:11px;font-weight:600;letter-spacing:.06em;
  color:var(--neon-green);text-transform:uppercase;
  animation:badgePulse 3s ease-in-out infinite;
}
@keyframes badgePulse {
  0%,100% { box-shadow:0 0 0 0 rgba(0,255,136,.15); }
  50%      { box-shadow:0 0 0 6px rgba(0,255,136,.0); }
}
.hero-live-dot {
  width:7px;height:7px;border-radius:50%;background:var(--neon-green);
  box-shadow:0 0 6px var(--neon-green);
  animation:dotBlink 1.4s ease-in-out infinite;
}
@keyframes dotBlink {
  0%,100%{opacity:1} 50%{opacity:.3}
}

/* Giant title */
.home-hero-title {
  font-family:var(--font-display);
  font-size:clamp(48px,8vw,96px);
  font-weight:800;line-height:.95;letter-spacing:-.03em;
  color:var(--text);margin-bottom:0;
}
.home-hero-title .line1 { display:block; }
.home-hero-title .line2 {
  display:block;
  background:linear-gradient(90deg, #b038f9 0%, #d795ff 55%, #635bff 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
  background-size:200% auto;
  animation:gradientShift 6s linear infinite;
}
@keyframes gradientShift {
  0%{background-position:0% center}
  100%{background-position:200% center}
}

/* Sub */
.home-hero-sub {
  font-family:var(--font-body);
  font-size:clamp(14px,1.8vw,18px);line-height:1.65;
  color:var(--text2);max-width:540px;
  margin-top:clamp(20px,2.5vw,32px);margin-bottom:clamp(28px,3.5vw,44px);
}

/* CTA buttons */
.home-cta-row { display:flex;gap:14px;flex-wrap:wrap; }
.btn-primary {
  display:inline-flex;align-items:center;gap:9px;
  padding:13px 26px;border-radius:10px;
  font-family:var(--font-body);font-size:13px;font-weight:600;letter-spacing:.02em;
  background:linear-gradient(135deg,#b038f9,#8d16b8);color:#fff;
  border:none;cursor:pointer;
  box-shadow:0 0 24px rgba(176,56,249,.3),inset 0 1px 0 rgba(255,255,255,.2);
  transition:all .2s;text-decoration:none;
}
.btn-primary:hover {
  transform:translateY(-2px);
  box-shadow:0 0 40px rgba(176,56,249,.45),0 8px 24px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.25);
}
.btn-primary svg{width:15px;height:15px}
.btn-secondary {
  display:inline-flex;align-items:center;gap:9px;
  padding:13px 26px;border-radius:10px;
  font-family:var(--font-body);font-size:13px;font-weight:600;letter-spacing:.02em;
  background:rgba(255,255,255,.04);color:var(--text);
  border:1px solid var(--glass-border);cursor:pointer;
  backdrop-filter:blur(12px);
  transition:all .2s;text-decoration:none;
}
.btn-secondary:hover {
  background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.12);
  transform:translateY(-2px);
}
.btn-secondary svg{width:15px;height:15px}

/* Scrolling ticker */
.hero-ticker-wrap {
  position:relative;z-index:2;
  border-top:1px solid var(--glass-border);
  background:rgba(12,12,12,.85);backdrop-filter:blur(8px);
  overflow:hidden;height:36px;display:flex;align-items:center;
  /* Full-bleed out of hero padding */
  margin:auto -72px -96px -72px;
  margin-top:clamp(28px,4vw,44px);
}
.hero-ticker {
  display:flex;gap:0;white-space:nowrap;
  animation:tickerScroll 40s linear infinite;
  will-change:transform;
}
.hero-ticker:hover { animation-play-state:paused; }
@keyframes tickerScroll {
  0%   { transform:translateX(0); }
  100% { transform:translateX(-50%); }
}
.ticker-item {
  display:inline-flex;align-items:center;gap:8px;
  padding:0 24px;font-family:var(--font-body);font-size:11px;font-weight:500;
  color:var(--text3);border-right:1px solid var(--glass-border);
}
.ticker-item .ticker-name { color:var(--text2);font-weight:600; }
.ticker-item .ticker-pct  { color:var(--neon-green);font-weight:700;font-family:monospace; }
.ticker-item .ticker-odds { color:var(--text3); }
.ticker-sep { color:var(--border2);padding:0 4px; }

/* ── STAT CARDS GRID ── */
.home-stats-grid {
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:1px;background:var(--border);
  border-bottom:1px solid var(--border);
}
.home-stat {
  padding:clamp(16px,2.5vw,28px) clamp(16px,3vw,32px);
  background:var(--bg2);
  position:relative;overflow:hidden;
  transition:background .2s;
}
.home-stat:hover { background:var(--bg3); }
.home-stat::after {
  content:'';position:absolute;bottom:0;left:0;right:0;height:2px;
  background:var(--brand-grad);transform:scaleX(0);transform-origin:left;
  transition:transform .3s ease;
}
.home-stat:hover::after { transform:scaleX(1); }
.home-stat-val {
  font-family:var(--font-display);
  font-size:clamp(28px,4vw,44px);font-weight:800;line-height:1;
  color:var(--text);
  transition:transform .3s;
}
.home-stat:hover .home-stat-val { transform:scale(1.04); }
.home-stat-val.green  { color:#b038f9; text-shadow:0 0 20px rgba(176,56,249,.3); }
.home-stat-val.purple { color:#d795ff; text-shadow:0 0 20px rgba(215,149,255,.3); }
.home-stat-val.blue   { color:#9b96ff; text-shadow:0 0 20px rgba(155,150,255,.3); }
.home-stat-label {
  font-family:var(--font-body);
  font-size:10px;font-weight:600;letter-spacing:.14em;
  text-transform:uppercase;color:var(--text3);margin-top:6px;
}

/* ── TODAY SECTION ── */
.home-body { padding:clamp(24px,4vw,52px) clamp(16px,4vw,40px); }
.home-section { margin-bottom:clamp(40px,5vw,64px); }

.home-section-tag {
  font-family:var(--font-body);
  font-size:9px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;
  color:var(--neon-green);margin-bottom:10px;
  display:inline-flex;align-items:center;gap:8px;
}
.home-section-tag::before {
  content:'';display:block;width:18px;height:1px;
  background:var(--neon-green);opacity:.5;
}
.home-section-title {
  font-family:var(--font-display);
  font-size:clamp(20px,3vw,28px);font-weight:700;
  color:var(--text);margin-bottom:18px;line-height:1.2;
}

/* Game flags grid */
.flag-grid {
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
  gap:10px;margin-top:20px;
}
.flag-card {
  background:var(--bg2);border:1px solid var(--border);border-radius:12px;
  padding:16px 18px;display:flex;flex-direction:column;gap:6px;
  transition:border-color .15s,transform .15s;
  position:relative;overflow:hidden;
}
.flag-card::before {
  content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
  border-radius:0;
}
.flag-card.danger::before  { background:var(--red); }
.flag-card.warn::before    { background:var(--gold); }
.flag-card.good::before    { background:var(--neon-green); }
.flag-card.neutral::before { background:var(--border3); }
.flag-card:hover { border-color:var(--border3);transform:translateY(-1px); }
.flag-matchup {
  font-family:var(--font-body);
  font-size:11px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;color:var(--text3);
}
.flag-status { font-size:13px;font-weight:600; }
.flag-status.danger { color:var(--red); }
.flag-status.warn   { color:var(--gold); }
.flag-status.good   { color:var(--neon-green); }
.flag-status.neutral{ color:var(--text2); }

/* Model notes */
.model-notes-grid {
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  gap:10px;margin-top:20px;
}
.model-note {
  background:var(--bg2);border:1px solid var(--border);border-radius:12px;
  padding:18px 20px;
}
.model-note-label {
  font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--text3);margin-bottom:7px;
  font-family:var(--font-body);
}
.model-note-val {
  font-size:13px;line-height:1.55;color:var(--text2);
  font-family:var(--font-body);
}
.model-note-val.danger { color:var(--red); }
.model-note-val.warn   { color:var(--gold); }

/* ── RESPONSIVE ── */
@media(max-width:900px) {
  .home-stats-grid { grid-template-columns:repeat(2,1fr); }
}


/* ── FACTOR CARDS (Model page) ───────────────────────────────── */
.factor-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-top:24px}
.factor-card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:18px 18px 16px;transition:border-color .15s;position:relative;overflow:hidden}
.factor-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--brand-grad);transform:scaleX(0);transform-origin:left;transition:transform .25s ease}
.factor-card:hover{border-color:var(--border3)}
.factor-card:hover::before{transform:scaleX(1)}
.factor-icon{width:36px;height:36px;border-radius:8px;margin-bottom:12px;display:flex;align-items:center;justify-content:center;background:var(--bg3);border:1px solid var(--border2);flex-shrink:0}
.factor-icon svg{width:17px;height:17px;color:var(--green);flex-shrink:0}
.factor-title{font-size:13px;font-weight:700;color:var(--text);margin-bottom:6px}
.factor-desc{font-size:12px;line-height:1.6;color:var(--text3)}
.factor-tag{display:inline-block;margin-top:10px;font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;border-radius:4px;background:var(--green-dim);color:var(--green);border:1px solid rgba(97,233,112,.2)}
.factor-tag.blue{background:var(--blue-dim);color:var(--blue-acc);border-color:rgba(99,91,255,.2)}
.factor-tag.purple{background:rgba(176,56,249,.1);color:var(--logo-purple);border-color:rgba(176,56,249,.2)}
.factor-tag.gold{background:var(--gold-dim);color:var(--gold);border-color:rgba(215,149,255,.2)}

/* ── TIMELINE (Model page) ───────────────────────────────────── */
.timeline{margin-top:20px;position:relative;padding-left:28px}
.timeline::before{content:'';position:absolute;left:7px;top:6px;bottom:6px;width:1px;background:var(--border2)}
.tl-item{position:relative;margin-bottom:24px}
.tl-item:last-child{margin-bottom:0}
.tl-dot{position:absolute;left:-28px;top:3px;width:15px;height:15px;border-radius:50%;background:var(--bg3);border:2px solid var(--border2);display:flex;align-items:center;justify-content:center}
.tl-dot.active{border-color:var(--green);background:rgba(97,233,112,.1)}
.tl-dot.active::after{content:'';width:5px;height:5px;border-radius:50%;background:var(--green)}
.tl-date{font-size:10px;font-weight:600;letter-spacing:.05em;color:var(--text3);font-family:'SF Mono','Fira Code','Fira Mono','Roboto Mono',monospace;margin-bottom:4px}
.tl-title{font-size:13px;font-weight:700;color:var(--text);margin-bottom:4px}
.tl-body{font-size:12px;line-height:1.6;color:var(--text3)}

/* ── SPEC TABLE (Model page) ─────────────────────────────────── */
.spec-table{width:100%;border-collapse:collapse;margin-top:16px;font-size:12px}
.spec-table th{padding:8px 12px;text-align:left;font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text3);border-bottom:1px solid var(--border)}
.spec-table td{padding:9px 12px;border-bottom:1px solid var(--border);color:var(--text2);vertical-align:top}
.spec-table td:first-child{color:var(--text);font-weight:600;white-space:nowrap;width:200px}
.spec-table tr:last-child td{border-bottom:none}
.spec-table tr:hover td{background:var(--bg3)}
.mono-val{font-family:'SF Mono','Fira Code','Fira Mono','Roboto Mono',monospace;color:var(--green);font-size:11px}

/* ── SHARED SECTION PROSE (home + model) ────────────────────── */
.home-section-body{font-size:14px;line-height:1.75;color:var(--text2)}
.home-section-body p{margin-bottom:14px}
.home-section-body p:last-child{margin-bottom:0}

/* ── LIVE SCORE TICKER ───────────────────────────────────────── */
.ticker-item.live-hr {
  background:rgba(0,255,136,.08);
  border-right-color:rgba(0,255,136,.2);
}
.ticker-item.live-hr .ticker-name { color:var(--neon-green); }
.ticker-item.live-hr .ticker-pct  { color:var(--neon-green); text-shadow:0 0 8px rgba(0,255,136,.5); }
.ticker-item.live-loss {
  background:rgba(239,68,68,.07);
  border-right-color:rgba(239,68,68,.2);
}
.ticker-item.live-loss .ticker-name { color:#f87171; }
.ticker-item.live-loss .ticker-odds { color:#f87171; }
.ticker-pulse {
  display:inline-block;width:6px;height:6px;border-radius:50%;
  background:var(--neon-green);box-shadow:0 0 5px var(--neon-green);
  animation:dotBlink 1.2s ease-in-out infinite;margin-right:2px;flex-shrink:0;
}
.ticker-item.live-loss .ticker-pulse { background:#f87171;box-shadow:0 0 5px #f87171; }
.ticker-score {
  font-family:monospace;font-size:10px;color:var(--text3);
  background:var(--bg3);padding:1px 5px;border-radius:3px;
}
.ticker-item.live-hr .ticker-score { background:rgba(0,255,136,.1);color:var(--neon-green); }
.ticker-item.live-loss .ticker-score { background:rgba(239,68,68,.1);color:#f87171; }

/* ── SCORE TICKER BAR ────────────────────────────────────────── */
.score-ticker-bar {
  background:var(--bg2);
  border-bottom:1px solid var(--border);
  height:38px;overflow:hidden;display:flex;align-items:center;
  position:relative;
}
.score-ticker-bar::before,
.score-ticker-bar::after {
  content:'';position:absolute;top:0;bottom:0;width:32px;z-index:2;
  pointer-events:none;
}
.score-ticker-bar::before { left:0;  background:linear-gradient(90deg,var(--bg2),transparent); }
.score-ticker-bar::after  { right:0; background:linear-gradient(270deg,var(--bg2),transparent); }
.score-ticker-track {
  display:flex;white-space:nowrap;gap:0;
  animation:scoreTicker 60s linear infinite;
  will-change:transform;
  -webkit-transform:translateZ(0);
  transform:translateZ(0);
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
}
.score-ticker-track:hover { animation-play-state:paused; }
@keyframes scoreTicker {
  0%   { transform:translateX(0); }
  100% { transform:translateX(-50%); }
}
.score-game {
  display:inline-flex;align-items:center;gap:7px;
  padding:0 20px;height:38px;cursor:default;
  border-right:1px solid var(--border);
  font-size:11px;transition:background .15s;
  flex-shrink:0;
}
.score-game:hover { background:var(--bg3); }
.score-team { font-weight:700;font-size:11px;color:var(--text2);font-family:monospace; }
.score-num  { font-weight:800;font-size:13px;font-family:monospace;min-width:14px;text-align:center; }
.score-num.winning { color:var(--text); }
.score-num.losing  { color:var(--text3); }
.score-sep  { color:var(--border3);font-size:10px; }
.score-state {
  font-size:9px;font-weight:700;letter-spacing:.04em;
  font-family:monospace;color:var(--text3);min-width:28px;text-align:center;
  white-space:nowrap;
}
.score-state.live   { color:var(--neon-green);animation:dotBlink 1.4s ease-in-out infinite; }
.score-state.final  { color:var(--text3); }
.score-state.sched  { color:var(--text3);opacity:.6; }

.sticker-logo {
  width:22px;height:22px;border-radius:5px;flex-shrink:0;
  background-size:contain;background-repeat:no-repeat;background-position:center;
  background-color:var(--bg3);
  display:inline-block;
}

/* Worst edge plays in ticker */
.ticker-item.ticker-bad .ticker-name { color:var(--text2); }
.ticker-item.ticker-bad .ticker-pct  { color:#f87171; }
.ticker-item.ticker-bad { background:rgba(239,68,68,.05); border-right-color:rgba(239,68,68,.15); }
.ticker-section-sep { padding:0 8px; border-right:none; }

/* ── GAMECENTER ──────────────────────────────────────────────── */
.score-game { cursor:pointer; }
.gc-wrap { padding:14px 16px 40px; max-width:1100px; margin:0 auto; }
.gc-strip { display:block; padding:4px 0 12px; }
.gc-chip {
  display:inline-flex; align-items:center; gap:7px; padding:7px 12px;
  background:var(--bg2); border:1px solid var(--border); border-radius:9px;
  font-size:11px; font-family:monospace; font-weight:700; color:var(--text2);
  cursor:pointer; white-space:nowrap; flex-shrink:0; transition:all .15s;
}
.gc-chip:hover { background:var(--bg3); }
.gc-chip.active {
  border-color:transparent; color:var(--text);
  background:linear-gradient(var(--bg3),var(--bg3)) padding-box,
             linear-gradient(90deg,#b038f9,#635bff) border-box;
}
.gc-chip .gcc-state { font-size:9px; color:var(--text3); }
.gc-chip .gcc-state.live { color:var(--neon-green); animation:dotBlink 1.4s ease-in-out infinite; }
.gc-header {
  display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:12px;
  background:var(--bg2); border:1px solid var(--border); border-radius:14px;
  padding:22px 24px; margin-bottom:14px; position:relative; overflow:hidden;
}
.gc-header::before {
  content:''; position:absolute; top:0; left:0; right:0; height:2px;
  background:linear-gradient(90deg,transparent,#b038f9,#635bff,transparent);
}
.gc-side { display:flex; align-items:center; gap:14px; }
.gc-side.home { justify-content:flex-end; }
.gc-logo { width:52px; height:52px; border-radius:10px; background-size:contain; background-repeat:no-repeat; background-position:center; background-color:var(--bg3); flex-shrink:0; }
.gc-tname { font-size:15px; font-weight:800; }
.gc-trec  { font-size:10px; color:var(--text3); font-family:monospace; margin-top:2px; }
.gc-tscore { font-size:44px; font-weight:800; font-family:monospace; line-height:1; }
.gc-tscore.losing { color:var(--text3); }
.gc-mid { text-align:center; min-width:130px; }
.gc-state { font-size:12px; font-weight:800; font-family:monospace; letter-spacing:.05em; }
.gc-state.live { color:var(--neon-green); }
.gc-state.final { color:var(--text2); }
.gc-outs { font-size:10px; color:var(--text3); font-family:monospace; margin-top:3px; }
.gc-diamond { margin:8px auto 0; display:block; }
.gc-diamond rect { fill:var(--bg4); stroke:var(--border2); stroke-width:1; }
.gc-diamond rect.on { fill:var(--neon-green); stroke:var(--neon-green); filter:drop-shadow(0 0 4px rgba(0,255,136,.6)); }
.gc-card {
  background:var(--bg2); border:1px solid var(--border); border-radius:12px;
  padding:14px 16px; margin-bottom:14px; overflow-x:auto;
}
.gc-card-title { font-size:10px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--text3); margin-bottom:10px; }
.gc-line { width:100%; border-collapse:collapse; font-family:monospace; font-size:12px; }
.gc-line th, .gc-line td { padding:5px 7px; text-align:center; border-bottom:1px solid rgba(26,37,53,.5); }
.gc-line th { font-size:9px; color:var(--text3); font-weight:700; }
.gc-line td:first-child, .gc-line th:first-child { text-align:left; font-weight:800; }
.gc-line td.cur { background:rgba(176,56,249,.12); }
.gc-line .rhe { font-weight:800; border-left:1px solid var(--border2); }
.gc-matchup { display:grid; grid-template-columns:1fr 1fr auto auto; gap:16px; align-items:center; }
.gc-mu-role { font-size:9px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--text3); }
.gc-mu-name { font-size:14px; font-weight:800; margin:3px 0 2px; background:linear-gradient(90deg,#b038f9,#635bff); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
.gc-mu-line { font-size:11px; color:var(--text2); font-family:monospace; }
.gc-count { text-align:right; font-family:monospace; font-size:10px; color:var(--text3); }
.gc-dots { display:flex; gap:4px; justify-content:flex-end; margin:2px 0; align-items:center; }
.gc-dot { width:9px; height:9px; border-radius:50%; background:var(--bg4); border:1px solid var(--border2); }
.gc-dot.on-b { background:#635bff; border-color:#635bff; }
.gc-dot.on-s { background:#b038f9; border-color:#b038f9; }
.gc-dot.on-o { background:#f87171; border-color:#f87171; }
/* ── app-style scoreboard grid ── */
.sb-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:10px; margin-bottom:16px; }
@media (max-width:760px) {
  .sb-grid { grid-template-columns:repeat(2,1fr); gap:8px; }
  .sb-card { padding:10px 10px; gap:6px; }
  .sb-score { font-size:18px; }
  .sb-ml { font-size:9px; padding:2px 5px; }
  .sb-side { min-width:40px; }
  .sb-state { font-size:10px; }
  .sb-state.sched { font-size:9px; }
  .sb-ab { font-size:12px; }
}
.sb-card { background:var(--card); border:1px solid var(--border2); border-radius:14px; padding:12px 13px; display:flex; justify-content:space-between; gap:8px; cursor:pointer; transition:border-color .15s, transform .12s; min-width:0; overflow:hidden; }
.sb-card.sched { flex-direction:column; gap:9px; }
/* live/final cards: teams center against the taller state column */
.sb-card:not(.sched) { align-items:center; }
.sb-card:not(.sched) .sb-teams { justify-content:center; }
.sb-card:not(.sched) .sb-side { gap:4px; }
.sb-toprow { display:flex; justify-content:space-between; align-items:center; gap:8px; border-bottom:1px solid rgba(26,37,53,.55); padding-bottom:7px; }
.sb-toprow .sb-state.sched { min-width:0; overflow:hidden; text-overflow:ellipsis; }
.sb-toprow .sb-ou { flex-shrink:0; }
.sb-team .sticker-logo, .sb-team .sb-ab, .sb-team .sb-ml { flex-shrink:0; }
.sb-card.sched .sb-ml { min-width:64px; text-align:center; }
.sb-card:hover { border-color:rgba(176,56,249,.4); transform:translateY(-2px); }
.sb-card:active { transform:scale(.97); }
.sb-card.sel { border-color:rgba(176,56,249,.65); box-shadow:0 0 14px rgba(176,56,249,.15); }
.sb-card.live { border-color:rgba(176,56,249,.4); animation:sbGlow 3.2s ease-in-out infinite; }
@keyframes sbGlow { 0%,100% { box-shadow:0 0 0 rgba(176,56,249,0); } 50% { box-shadow:0 0 18px rgba(176,56,249,.2); } }
.sb-in { animation:sbIn .45s cubic-bezier(.2,.9,.3,1.3) backwards; }
@keyframes sbIn { from { opacity:0; transform:translateY(12px) scale(.96); } }
.sb-score { display:inline-block; }
.sb-score.bump { animation:sbBump 1s ease; }
@keyframes sbBump { 0% { transform:scale(1); } 30% { transform:scale(1.4); color:#4ade80; } 100% { transform:scale(1); } }
.sb-teams { flex:1; display:flex; flex-direction:column; gap:9px; min-width:0; }
.sb-team { display:flex; align-items:center; gap:8px; min-width:0; }
.sb-ab { font-weight:800; font-size:13px; letter-spacing:.02em; }
.sb-score { margin-left:auto; font-family:monospace; font-size:20px; font-weight:900; line-height:1; }
.sb-score.lose { color:var(--text3); }
.sb-ml { margin-left:auto; font-family:monospace; font-size:10px; font-weight:700; color:var(--text2); background:var(--bg3); border:1px solid var(--border2); border-radius:6px; padding:3px 7px; transition:all .15s; }
.sb-ml:hover { border-color:rgba(176,56,249,.65); color:#fff; box-shadow:0 0 8px rgba(176,56,249,.3); }
.sb-side { display:flex; flex-direction:column; align-items:flex-end; justify-content:center; gap:5px; min-width:58px; flex-shrink:0; }
.sb-state { font-family:monospace; font-size:11px; font-weight:700; letter-spacing:.03em; white-space:nowrap; }
.sb-state.live { color:#4ade80; display:flex; align-items:center; gap:5px; }
.sb-state.fin { color:var(--text3); }
.sb-state.sched { color:var(--text2); }
.sb-ou { font-family:monospace; font-size:9px; color:var(--text3); }
.sb-dot { width:7px; height:7px; border-radius:50%; background:#4ade80; animation:sbPulse 1.6s ease-in-out infinite; }
@keyframes sbPulse { 50% { opacity:.3; } }
.sb-dia rect { fill:var(--bg4); stroke:var(--border2); stroke-width:1; }
.sb-dia rect.on { fill:#b038f9; stroke:#b038f9; }
.sb-oc { display:flex; align-items:center; gap:6px; }
.sb-outs { display:flex; gap:3px; }
.sb-outs span { width:6px; height:6px; border-radius:50%; background:var(--bg4); border:1px solid var(--border2); }
.sb-outs span.on { background:#f87171; border-color:#f87171; }
.sb-count { font-family:monospace; font-size:10px; font-weight:800; color:var(--text2); }
/* ── Onyx bet bar (the funnel) ── */
.gc-betbar { display:flex; align-items:center; gap:10px; flex-wrap:wrap; background:linear-gradient(90deg, rgba(176,56,249,.12), rgba(64,96,240,.10)); border:1px solid rgba(176,56,249,.4); border-radius:14px; padding:10px 12px; margin-bottom:14px; }
.gc-bet-cta { font-family:monospace; font-size:12px; font-weight:800; letter-spacing:.04em; color:#fff; background:linear-gradient(90deg,#b038f9,#635bff); border-radius:9px; padding:10px 16px; cursor:pointer; white-space:nowrap; transition:all .15s; }
.gc-bet-cta:hover { box-shadow:0 0 16px rgba(176,56,249,.55); transform:translateY(-1px); }
.gc-bet-chips { display:flex; gap:6px; flex-wrap:wrap; }
.gc-bet-chip { font-family:monospace; font-size:11px; font-weight:700; color:var(--text2); background:var(--bg3); border:1px solid var(--border2); border-radius:8px; padding:7px 11px; cursor:pointer; transition:all .15s; white-space:nowrap; }
.gc-bet-chip:hover { border-color:rgba(176,56,249,.65); color:#fff; box-shadow:0 0 8px rgba(176,56,249,.3); }
/* ── HR watch headshot strip ── */
.gc-hs-row { display:flex; gap:12px; overflow-x:auto; padding:4px 2px 10px; scrollbar-width:thin; }
.gc-hs { flex:none; width:74px; text-align:center; cursor:pointer; transition:transform .12s; }
.gc-hs:active { transform:scale(.94); }
.gc-hs-img { width:58px; height:58px; margin:0 auto; border-radius:50%;
  background-repeat:no-repeat; background-position:center;
  box-shadow:inset 0 0 0 2px rgba(176,56,249,.65), 0 0 14px rgba(176,56,249,.25); }
.gc-hs.hit .gc-hs-img { box-shadow:inset 0 0 0 2px #d795ff, 0 0 16px rgba(215,149,255,.55); }
/* small ringed headshot for tables (rankings). The ring is drawn INSET so
   the ring + full spot disc live entirely inside this element's own box;
   tight overflow:hidden ancestors (table cells, tc-badge) can never slice
   the circle. Disc at 86% clears the 1.5px inset ring at every size. */
.rk-hs { width:30px; height:30px; border-radius:50%; flex-shrink:0; display:inline-block;
  background-color:#12101d; background-size:86%; background-position:center; background-repeat:no-repeat;
  box-shadow:inset 0 0 0 1.5px rgba(176,56,249,.65); margin:0 3px 0 2px; align-self:center; vertical-align:middle; }
.gc-hs-pct { font-family:monospace; font-size:11px; font-weight:800; color:#c9a6ff; margin-top:5px; }
.gc-hs.hit .gc-hs-pct { color:#d795ff; }
.gc-hs-name { font-size:10px; font-weight:700; color:var(--text2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.gc-hs-odds { font-family:monospace; font-size:9px; color:var(--text3); }
/* ── HR-in-N-parks chips ── */
.gc-parks { display:inline-flex; align-items:center; gap:4px; font-family:monospace; font-size:9px; font-weight:800;
  padding:2px 7px; border-radius:20px; background:rgba(176,56,249,.14); color:#c9a6ff; border:1px solid rgba(176,56,249,.35); white-space:nowrap; }
.gc-parks.nd { background:linear-gradient(90deg,rgba(215,149,255,.22),rgba(251,113,36,.18)); color:#d795ff; border-color:rgba(215,149,255,.55);
  box-shadow:0 0 10px rgba(215,149,255,.25); }
.gc-parks.scrape { background:rgba(96,165,250,.12); color:#93c5fd; border-color:rgba(96,165,250,.35); }
/* ── NO DOUBTER popup ── */
/* parlay builder: floating slip + armed-mode glow on every odds button */
#parlayFab { position:fixed; right:14px; bottom:calc(14px + var(--sab)); z-index:9990;
  display:flex; flex-direction:column; align-items:flex-end; gap:8px;
  width:min(320px, calc(100vw - 28px)); pointer-events:none; }
#parlayFab > * { pointer-events:auto; }
/* phones / installed PWA: the bottom app nav owns the bottom edge — dock
   the parlay pill ABOVE it so it never covers Markets/Rankings taps */
@media (max-width:760px) {
  #parlayFab { bottom:calc(86px + var(--sab)); right:10px; }
}
.pb-fab { background:linear-gradient(135deg,#7a2ce0,#b038f9); color:#fff; font-size:12px; font-weight:800;
  padding:10px 15px; border-radius:22px; cursor:pointer; box-shadow:0 4px 18px rgba(122,44,224,.45);
  user-select:none; letter-spacing:.02em; }
.pb-fab.on { background:linear-gradient(135deg,#00b000,#61e970); box-shadow:0 4px 18px rgba(97,233,112,.4); }
.pb-fab b { background:rgba(0,0,0,.25); border-radius:10px; padding:1px 7px; margin-left:4px; }
.pb-panel { background:#151515; border:1.5px solid rgba(176,56,249,.5); border-radius:14px;
  padding:10px 12px; width:100%; box-shadow:0 8px 30px rgba(0,0,0,.65);
  max-height:min(55vh, 420px); overflow-y:auto; }
.pb-head { font-size:10px; font-weight:900; letter-spacing:.12em; color:#b038f9; margin-bottom:7px;
  display:flex; justify-content:space-between; align-items:center; }
.pb-clear { color:var(--text3); font-weight:700; cursor:pointer; letter-spacing:0; font-size:10px; }
.pb-leg { display:flex; align-items:center; gap:8px; padding:5px 0; border-bottom:1px solid var(--border);
  font-size:12px; }
.pb-lbl { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:700; }
.pb-odds { font-family:monospace; font-size:11px; font-weight:700; color:var(--text2); flex-shrink:0; }
.pb-x { color:#ef4444; font-weight:900; cursor:pointer; padding:0 3px; flex-shrink:0; }
.pb-foot { display:flex; justify-content:space-between; align-items:center; gap:8px; padding-top:8px;
  flex-wrap:wrap; }
.pb-warn { font-size:10px; font-weight:700; color:#d795ff; padding-top:5px; width:100%; }
.pb-pay { font-size:11px; font-weight:700; color:var(--text2); }
.pb-pay b { color:#61e970; }
.pb-go { background:linear-gradient(135deg,#7a2ce0,#b038f9); color:#fff; font-size:11px; font-weight:800;
  padding:7px 12px; border-radius:9px; cursor:pointer; white-space:nowrap; }
body.parlay-armed .onyx-bet-btn, body.parlay-armed .sb-ml, body.parlay-armed .slam-odds,
body.parlay-armed .mkt-chip, body.parlay-armed .mkt-ou, body.parlay-armed .gc-bet-chip {
  box-shadow:0 0 0 1.5px rgba(97,233,112,.75), 0 0 9px rgba(97,233,112,.3) !important; }

/* broadcast camera for the live at-bat scene: punch in on contact, pan
   with the flight; the HR shot tracks longer and hands off to the modal */
.gc-scene .gc-cam { transform-box:view-box; transform-origin:166px 82px; }
.gc-scene.cam-inplay .gc-cam { animation:gcCamPlay 1.9s cubic-bezier(.3,.08,.25,1) both; }
.gc-scene.cam-hr .gc-cam { animation:gcCamHR 2.7s cubic-bezier(.3,.08,.25,1) both; }
@keyframes gcCamPlay {
  0% { transform:none; }
  22% { transform:scale(1.32); }
  34% { transform:scale(1.34); }
  72% { transform:scale(1.1) translate(26px,14px); }
  100% { transform:none; }
}
@keyframes gcCamHR {
  0% { transform:none; }
  17% { transform:scale(1.45); }
  27% { transform:scale(1.48); }
  62% { transform:scale(1.22) translate(58px,40px); }
  84% { transform:scale(1.22) translate(60px,42px); }
  100% { transform:none; }
}
.gc-hrpop { position:fixed; left:50%; top:calc(84px + var(--sat)); transform:translateX(-50%);
  z-index:9000; width:min(400px, calc(100vw - 32px)); background:linear-gradient(160deg,#191129,#0b0f1c 70%);
  border:1px solid rgba(215,149,255,.5); border-radius:18px; padding:16px 18px 14px; cursor:pointer;
  box-shadow:0 12px 50px rgba(0,0,0,.7), 0 0 34px rgba(215,149,255,.22);
  animation:gcPopIn .5s cubic-bezier(.2,1.4,.4,1) both; }
.gc-hrpop.bye { animation:gcPopOut .35s ease-in both; }
.gc-hrpop .ring { position:absolute; inset:-1px; border-radius:18px; border:2px solid rgba(215,149,255,.8); pointer-events:none;
  animation:gcShock 1.2s ease-out .15s 2; opacity:0; }
.gc-hrpop .tag { font-size:10px; font-weight:900; letter-spacing:.24em; text-transform:uppercase;
  background:linear-gradient(90deg,#d795ff,#8d16b8); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
.gc-hrpop .who { display:flex; align-items:center; gap:12px; margin-top:8px; }
.gc-hrpop .nm { font-size:17px; font-weight:800; color:#fff; line-height:1.15; }
.gc-hrpop .ln { font-family:monospace; font-size:11px; color:var(--text2); margin-top:3px; }
.gc-hrpop .parksline { margin-top:10px; display:flex; gap:6px; align-items:center; flex-wrap:wrap; }

/* live board badges */

  background:rgba(255,255,255,.06); color:var(--text3); margin-left:6px; white-space:nowrap; }
.pa-flag { font-size:9px; font-weight:600; color:var(--text3); font-family:monospace; margin-left:6px; white-space:nowrap; }

/* player drill-down modal */
.pmodal-back { position:fixed; inset:0; padding-top:var(--sat); background:rgba(5,6,10,.75); backdrop-filter:blur(6px);
  z-index:100000; display:none; align-items:flex-start; justify-content:center; padding:60px 16px; overflow-y:auto; }
.pmodal-back.open { display:flex; }
.pmodal { background:var(--bg2); border:1px solid var(--border2); border-radius:16px;
  width:100%; max-width:520px; overflow:hidden; position:relative; }

  background:linear-gradient(90deg,#b038f9,#635bff); }
.pmodal-head { display:flex; align-items:center; gap:12px; padding:20px 22px 14px; }
.pmodal-close { margin-left:auto; background:none; border:none; color:var(--text3); font-size:20px; cursor:pointer; }
.pmodal-name { font-size:18px; font-weight:800; }

.pmodal-prob .cap { font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--text3); }

.pmodal-stat .v { font-size:14px; font-weight:800; font-family:monospace; }

.pml5-row { display:flex; gap:7px; }

.pml5-g.hr { background:rgba(0,255,136,.08); border-color:rgba(0,255,136,.3); }
.pml5-g .d { font-size:8px; color:var(--text3); font-family:monospace; }
.pml5-g .o { font-size:9px; color:var(--text2); font-weight:700; margin:2px 0; }

/* calibration buckets */
.cal-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:10px; padding:4px 20px 18px; }
.cal-cell { background:var(--bg2); border:1px solid var(--border); border-radius:10px; padding:12px 12px 10px; text-align:center; }

.cal-cell .n { font-size:9px; color:var(--text3); }

/* notification bell */
.notif-bell { background:none; border:1px solid var(--border2); border-radius:8px; color:var(--text3);
  width:30px; height:30px; cursor:pointer; font-size:14px; line-height:1; transition:all .15s; }
.notif-bell.on { color:var(--neon-green); border-color:rgba(0,255,136,.4); box-shadow:0 0 8px rgba(0,255,136,.15); }

/* ── MODERNIZATION PASS ─────────────────────────────────────── */
/* ambient depth behind everything */
body::after {
  content:''; position:fixed; inset:0; z-index:-1; pointer-events:none;
  background:
    radial-gradient(900px 500px at 85% -10%, rgba(64,96,240,.07), transparent 60%),
    radial-gradient(700px 420px at 10% 110%, rgba(176,56,249,.06), transparent 60%);
}
/* nav identity: gradient underline on the active tab */
.nav-tab { position:relative; }
.nav-tab.active { border-bottom-color:transparent; text-shadow:none; }
.nav-tab.active::after {
  content:''; position:absolute; left:10px; right:10px; bottom:-1px; height:2px;
  border-radius:2px; background:linear-gradient(90deg,#b038f9,#635bff);
  box-shadow:0 0 10px rgba(176,56,249,.55);
}
#liveCount .nav-live-dot {
  display:inline-block; width:6px; height:6px; border-radius:50%;
  background:var(--neon-green); box-shadow:0 0 6px var(--neon-green);
  margin-right:5px; animation:dotBlink 1.4s ease-in-out infinite;
}
/* one card language everywhere */
.model-note, .flag-card, .cal-cell, .tcard, .gc-card, .mkt-card, .gc-header {
  transition:border-color .18s, transform .18s, box-shadow .18s;
}
.model-note:hover, .flag-card:hover, .cal-cell:hover {
  border-color:var(--border2); transform:translateY(-1px);
}
.tcard:hover, .mkt-card:hover, .gc-card:hover {
  border-color:rgba(176,56,249,.35);
  box-shadow:0 6px 24px rgba(0,0,0,.35), 0 0 0 1px rgba(176,56,249,.12);
}
/* number motion when live data changes */
@keyframes bumpNum { 0%{transform:scale(1)} 35%{transform:scale(1.3);color:var(--neon-green)} 100%{transform:scale(1)} }
.bump { animation:bumpNum .7s ease; display:inline-block; }
/* skeleton loading */
@keyframes skshine { 0%{transform:translateX(-100%)} 100%{transform:translateX(100%)} }
.skel { position:relative; overflow:hidden; background:var(--bg3); border:1px solid var(--border); border-radius:12px; }
.skel::after { content:''; position:absolute; inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.06),transparent);
  animation:skshine 1.2s infinite; }
/* mobile: rankings collapses to the columns that matter */
@media(max-width:700px){
  .rank-table th:nth-child(5), .rank-table td:nth-child(5),
  .rank-table th:nth-child(6), .rank-table td:nth-child(6),
  .rank-table th:nth-child(8), .rank-table td:nth-child(8),
  .rank-table th:nth-child(9), .rank-table td:nth-child(9),
  .rank-table th:nth-child(10), .rank-table td:nth-child(10),
  .rank-table th:nth-child(11), .rank-table td:nth-child(11),
  .rank-table th:nth-child(12), .rank-table td:nth-child(12) { display:none; }
  .rank-table { table-layout:auto; }
}
/* daily recap */
.recap-card {
  position:relative; overflow:hidden; cursor:pointer;
  background:var(--bg2); border:1px solid var(--border); border-radius:14px;
  padding:20px 22px; margin-bottom:26px; transition:border-color .18s, box-shadow .18s;
}

  background:linear-gradient(90deg,#b038f9,#635bff); }
.recap-card:hover { border-color:rgba(176,56,249,.4); box-shadow:0 6px 24px rgba(0,0,0,.35); }
.recap-tag { font-size:10px; font-weight:700; letter-spacing:.12em; text-transform:uppercase;
  background:linear-gradient(90deg,#b038f9,#635bff); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
.recap-head { font-size:20px; font-weight:800; margin:6px 0 4px; }
.recap-sub { font-size:12px; color:var(--text2); font-family:monospace; }
.recap-cta { font-size:12px; font-weight:700; color:#b38cff; margin-top:10px; }
.rc-entry { padding:14px 0; border-bottom:1px solid rgba(26,37,53,.6); }
.rc-entry:last-child { border-bottom:none; }
.rc-title { font-size:14px; font-weight:800; display:flex; align-items:center; gap:8px; }
.rc-badge { font-size:9px; font-weight:800; padding:2px 8px; border-radius:4px; }
.rc-badge.hit  { background:rgba(0,255,136,.15); color:var(--neon-green); }

.rc-story { font-size:12.5px; line-height:1.75; color:var(--text2); margin-top:6px; }
/* gamecenter: win probability strip + scoring plays */
.gc-wp-wrap { position:relative; height:64px; }
.gc-wp-wrap svg { position:absolute; inset:0; width:100%; height:100%; }
.gc-wp-lbl { position:absolute; right:4px; font-size:10px; font-weight:800; font-family:monospace; background:rgba(12,12,12,.75); padding:1px 6px; border-radius:5px; }

.gc-play .inn { flex:0 0 44px; font-family:monospace; font-size:10px; font-weight:700; color:var(--text3); padding-top:2px; }
.gc-play .sc { flex:0 0 52px; font-family:monospace; font-size:11px; font-weight:800; text-align:right; padding-top:1px; }
.gc-play .tx { flex:1; color:var(--text2); }

/* ── MARKETS (Kalshi-style win probability) ─────────────────── */
.mkt-wrap { padding:14px 16px 40px; max-width:900px; margin:0 auto; }
.mkt-card {
  background:var(--bg2); border:1px solid var(--border); border-radius:14px;
  margin-bottom:16px; overflow:hidden;
}
.mkt-head { display:flex; align-items:center; justify-content:space-between; padding:14px 18px 6px; }
.mkt-title { font-size:14px; font-weight:800; }
.mkt-sub { font-size:11px; color:var(--text3); font-family:monospace; margin-top:2px; }
.mkt-sub .live { color:var(--neon-green); animation:dotBlink 1.4s ease-in-out infinite; font-weight:700; }
.mkt-chart { position:relative; height:150px; padding:8px 64px 8px 10px; }
.mkt-chart svg { position:absolute; inset:8px 64px 8px 10px; width:calc(100% - 74px); height:calc(100% - 16px); overflow:visible; }
.mkt-endlbl { position:absolute; right:8px; transform:translateY(-50%); text-align:left; font-family:monospace; line-height:1.1; }

.mkt-grid { position:absolute; inset:8px 64px 8px 10px; pointer-events:none; }
.mkt-grid div { position:absolute; left:0; right:0; border-top:1px dashed rgba(255,255,255,.06); font-size:8px; color:var(--text3); font-family:monospace; }

.mkt-rows { border-top:1px solid var(--border); }

.mkt-row:last-child { border-bottom:none; }
.mkt-row .sticker-logo { width:26px; height:26px; }
.mkt-team { flex:1; font-size:13px; font-weight:700; }
.mkt-team .ml { font-size:10px; color:var(--text3); font-family:monospace; font-weight:400; margin-left:7px; }
.mkt-pct { font-size:17px; font-weight:800; font-family:monospace; min-width:58px; text-align:right; }
.mkt-delta { font-size:10px; font-family:monospace; min-width:34px; text-align:left; }
.mkt-delta.up { color:#4ade80; } .mkt-delta.dn { color:#f87171; } .mkt-delta.fl { color:var(--text3); }
.mkt-chip {
  min-width:86px; text-align:center; padding:8px 0; border-radius:9px;
  font-size:12px; font-weight:700; font-family:monospace;
  background:var(--bg3); border:1px solid var(--border2);
  cursor:pointer; transition:all .15s;
}
.mkt-chip:hover { border-color:rgba(176,56,249,.6); box-shadow:0 0 10px rgba(176,56,249,.25); transform:translateY(-1px); }
.onyx-bet-btn { display:inline-flex; align-items:center; gap:5px; margin-left:auto;
  font-size:10px; font-weight:800; font-family:monospace; letter-spacing:.04em;
  color:#fff; background:linear-gradient(90deg,#b038f9,#635bff);
  border:1px solid rgba(176,56,249,.7); border-radius:6px; padding:5px 11px;
  cursor:pointer; transition:all .15s; white-space:nowrap; }
.onyx-bet-btn:hover { box-shadow:0 0 14px rgba(176,56,249,.5); transform:translateY(-1px); filter:brightness(1.12); }
.mkt-chip.yes { color:#4ade80; } .mkt-chip.no { color:#f87171; }
.mkt-chip.rl { color:#c084fc; min-width:70px; }
.mkt-ou { font-family:monospace; font-size:10px; font-weight:700; color:var(--text2);

  padding:4px 8px; cursor:pointer; transition:all .15s; }
.mkt-ou:hover { border-color:rgba(176,56,249,.6); color:#fff; box-shadow:0 0 8px rgba(176,56,249,.25); }
.mkt-note { padding:8px 18px 12px; font-size:9px; color:var(--text3); font-family:monospace; letter-spacing:.04em; }
.mkt-head { cursor:pointer; }
.mkt-histbtn { display:inline-flex; align-items:center; gap:5px; background:var(--bg3);
  border:1px solid var(--border2); border-radius:8px; color:var(--text2); font-size:11px;
  font-weight:700; padding:6px 11px; cursor:pointer; white-space:nowrap; transition:all .15s; }
.mkt-histbtn:hover { color:var(--text); border-color:rgba(176,56,249,.5); }
.mkt-card.open .mkt-histbtn { color:#b38cff; border-color:rgba(176,56,249,.5); }
.mkt-chev { font-size:11px; color:inherit; transition:transform .2s; display:inline-block; }
.mkt-card.open .mkt-chev { transform:rotate(180deg); }
.mkt-chart.big { height:230px; }
.mkt-axis { position:relative; height:18px; margin:0 64px 4px 10px; }
.mkt-axis span { position:absolute; transform:translateX(-50%); font-size:9px; color:var(--text3); font-family:monospace; white-space:nowrap; }
.mkt-hist { border-top:1px solid var(--border); max-height:240px; overflow-y:auto; }
.mkt-hist table { width:100%; border-collapse:collapse; font-family:monospace; font-size:11px; }
.mkt-hist th { position:sticky; top:0; background:var(--bg2); padding:7px 18px; font-size:9px; font-weight:700;
  letter-spacing:.08em; text-transform:uppercase; color:var(--text3); text-align:right; border-bottom:1px solid var(--border); }
.mkt-hist th:first-child { text-align:left; }
.mkt-hist td { padding:6px 18px; text-align:right; border-bottom:1px solid rgba(26,37,53,.4); color:var(--text2); }
.mkt-hist td:first-child { text-align:left; color:var(--text3); }
.mkt-hist .mv-up { color:#4ade80; } .mkt-hist .mv-dn { color:#f87171; }
@media(max-width:640px){

  .mkt-pct { font-size:14px; min-width:42px; }

  .mkt-chip { flex:1; }
  .mkt-chip.rl { flex:0 0 74px; }

@media(max-width:760px){
  .gc-boxes { grid-template-columns:1fr; }
  /* game header: both teams always fully on screen */
  .gc-header { padding:14px 10px; gap:6px; }
  .gc-side { gap:7px; flex:1; min-width:0; }
  .gc-tscore { font-size:28px; }
  .gc-logo { width:32px; height:32px; }
  .gc-tname { font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:62px; }
  .gc-trec { font-size:9px; }
  .gc-mid { min-width:92px; }
  .gc-matchup { grid-template-columns:1fr; }
  .gc-count { text-align:left; }

  /* board game table: drop the duplicate O/U column (it lives in the

  .team-row { grid-template-columns:1fr 82px 84px; padding:10px 10px; }
  .team-row > div:nth-child(3) { display:none; }
  .tr-name { font-size:12px; }
  .tr-pitcher, .tr-top { font-size:10px; }

  .game-pills .gpill-venue { display:none; }
}

/* ── ONYX BRAND SKIN (8/14): clean, sleek pass per the brand hub.
   Purple 400 leads on interactive, Seed only for live/positive, neutral
   Onyx surfaces, sentence-case labels instead of tracked-out mono caps.
   Overrides live at the end of the sheet on purpose - the base rules
   above keep working, this layer only calms them down. ── */
.gc-card { border-radius:16px; background:var(--bg2); border-color:var(--border); }

  const st = (cls, txt) => `<span class="score-state ${cls}">${esc(txt)}</span>`;
  const items = KIND === 'tennis' ? (SD.events || []).flatMap(e => e.matches.filter(m => m.state === 'in').slice(0, 6).map(m =>
      sg(`${st('live', 'LIVE')}<span class="score-team">${esc(m.p[0].short || m.p[0].name)}</span><span class="score-num">${m.p[0].sets.join(' ')}</span><span class="score-sep">|</span><span class="score-team">${esc(m.p[1].short || m.p[1].name)}</span><span class="score-num">${m.p[1].sets.join(' ')}</span>`, "gotoTab('games')")))
    : KIND === 'golf' ? (SD.events || []).flatMap(e => e.board.slice(0, 8).map(r =>
      sg(`<span class="score-state">${esc(r.pos)}</span><span class="score-team">${esc(r.name)}</span><span class="score-num">${esc(r.to_par)}</span>`, "gotoTab('games')")))
    : (SD.games || []).map(g0 => {
      const g = live(g0), pre = g.state === 'pre';

      const state = g.state === 'in' ? st('live', g.detail || 'LIVE') : g.state === 'post' ? st('final', 'FINAL') : st('sched', tipTime(g.start));

    });

  const lanePass = (M.engine || {}).lane;
  const pickHtml = M.status === 'live' ? `<div class="sec-hdr"><span class="sec-title">Today's plays</span><span class="sec-count">${picks.length}</span></div>
    ${picks.length ? playCards(picks) : '<div class="empty">No play clears the bar on this slate. A quiet slate is the screens working.</div>'}`
    : `<div class="sec-hdr"><span class="sec-title">Today's plays · spreads, totals and props</span><span class="sec-count">${proj.length}</span></div>
    <p class="dim" style="font-size:12px;line-height:1.6;margin:0 0 10px">Where the model's chance beats Onyx's price by a point or more, best value first, two per game at most. Confidence is the model's chance the play wins. Leans while the ${esc(C.name)} model is still in the lab: not tracked or graded until it beats Onyx's prices in a backtest.</p>
    ${proj.length ? playCards(proj) : '<div class="empty">No line on this slate beats the Onyx price by a point. A quiet slate is the screens working.</div>'}`;
  const rows = M.rows || [];
  const gameRows = rows.filter(r => r.kind), propRows = rows.filter(r => !r.kind);
  let body = (M.td || []).length ? tdTable(M.td.slice(0, 60), 'Touchdown scorers · anytime and first TD') : '';
  if (gameRows.length) body += `<div class="sec-hdr"><span class="sec-title">Game lines · ${M.status === 'live' ? 'model vs Onyx' : 'leans'}</span><span class="sec-count">${gameRows.length}</span></div>${gameLeanTable(gameRows.slice(0, 150))}`;
  if (propRows.length) {
    const mk = [...new Set(propRows.map(r => r.mkt))];
    const shown = propRows.filter(r => PMKT === 'all' || r.mkt === PMKT);
    body += `<div class="sec-hdr"><span class="sec-title">Player projections${M.status === 'live' ? '' : ' · leans'}</span><span class="sec-count">${shown.length}</span></div>
    <div class="sp-tabs-seg"><button class="${PMKT === 'all' ? 'on' : ''}" onclick="PMKT='all';renderPlays()">All</button>${mk.map(m => `<button class="${PMKT === m ? 'on' : ''}" onclick="PMKT='${esc(m)}';renderPlays()">${esc(MKT_NAME[m] || m)}</button>`).join('')}</div>
    ${projTable(shown.slice(0, 120))}`;
  }
  el.innerHTML = lab + pickHtml + body + recordBlock(M.record) + (!rows.length && M.status !== 'live' ? '' : '');
}
var ENGINE_ICON = {
  clock: '<circle cx="8" cy="8" r="6.5"/><path d="M8 4v4l2.5 2"/>',
  pace: '<path d="M2 12a6 6 0 0 1 12 0"/><path d="M8 12l3-4"/>',
  shield: '<path d="M8 1.5l5 2v4c0 3.5-2.5 5.8-5 7-2.5-1.2-5-3.5-5-7v-4z"/>',
  chart: '<path d="M2 13h12M4 10l3-3 2 2 4-5"/>',
  scale: '<path d="M8 2v12M3 14h10M3 5h10M3 5l-1.5 4h3zM13 5l-1.5 4h3z"/>',
  bell: '<path d="M2 13c2 0 3-10 6-10s4 10 6 10"/>',

};
function factorCard(icon, title, desc, tag, tone) {
  return `<div class="factor-card"><div class="factor-icon"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">${ENGINE_ICON[icon] || ''}</svg></div>
    <div class="factor-title">${esc(title)}</div><div class="factor-desc">${esc(desc)}</div><span class="factor-tag ${tone || ''}">${esc(tag)}</span></div>`;
}
function wbar(parts) {
  const C = ['#3a3a4a', '#b038f9', '#635bff', '#d795ff'];
  return `<div class="wbar">${parts.map(([lab, v], i) => `<div class="wseg" style="flex:${v};background:${C[i % C.length]}" title="${esc(lab)} ${Math.round(v)}%"><span>${Math.round(v)}%</span></div>`).join('')}</div>
    <div class="wleg">${parts.map(([lab, v], i) => `<span><i style="background:${C[i % C.length]}"></i>${esc(lab)}</span>`).join('')}</div>`;
}
function engineHtml(E) {
  if (!E) return '';
  const steps = (E.steps || []).map(st => `<div class="wblock"><div class="wtitle">${esc(st.t)}</div>
    ${st.bars ? wbar(st.bars) : ''}${(st.rows || []).map(r => `<div class="wrow"><b>${esc(r[0])}</b><span>${esc(r[1])}</span></div>`).join('')}
    ${st.note ? `<div class="wnote">${esc(st.note)}</div>` : ''}</div>`).join('');
  const L = E.lane;
  const lane = L ? `<div class="wblock"><div class="wtitle">${L.live ? 'The pick lane · live and graded in public' : 'The pick lane · in the lab'}</div>

    <div class="wrow"><b>Edge</b><span>${(L.edge[0] * 100).toFixed(0)} to ${(L.edge[1] * 100).toFixed(0)}pp over the price's implied chance (bigger gaps are usually news the model missed)</span></div>
    <div class="wrow"><b>Price</b><span>${fmtOdds(L.price[0])} to ${fmtOdds(L.price[1])}, one play per game, ${L.per_slate} a slate at most</span></div>
    <div class="wnote">${L.passed ? 'This lane beat real Onyx prices on games it never saw, so its plays are tracked picks with a public record.' : 'This is the best lane the backtest found, and it did not beat Onyx on the games it never saw. Its plays show as projected leans on the Plays tab, never tracked or graded, until a model version passes.'}</div></div>` : '';
  const f = (E.factors || []).length ? `<div class="factor-grid sp-factors">${E.factors.map(x => factorCard(...x)).join('')}</div>` : '';

}
function renderModel() {

// ── live: ESPN scoreboard every 30s (15s while anything is live) ────
var _poll = null;
function pollLive() {
  if (location.protocol === 'file:' || !(C.espn || []).length) return;
  const paths = C.espn;
  Promise.all(paths.map(p => fetch('https://site.api.espn.com/apis/site/v2/sports/' + p + '/scoreboard' + (C.espn_q ? '?' + C.espn_q : '')).then(r => r.json()).catch(() => null))).then(js => {
    let anyLive = false;
    js.forEach((j, pi) => {
      if (!j) return;
      if (KIND === 'football' || KIND === 'hockey') {
        (j.events || []).forEach(e => {
          const c = (e.competitions || [{}])[0], st = (e.status || {}).type || {};
          const t = {}; (c.competitors || []).forEach(x => { t[x.homeAway] = x; });
          LIVE[e.id] = {state: st.state, detail: st.shortDetail || st.detail, away_score: (t.away || {}).score, home_score: (t.home || {}).score,
                        situation: c.situation || null, home_id: ((t.home || {}).team || {}).id};
          if (st.state === 'in') anyLive = true;
        });
      } else if (KIND === 'tennis') {
        (j.events || []).forEach(e => (e.groupings || []).forEach(gr => (gr.competitions || []).forEach(c => {
          (SD.events || []).forEach(ev => ev.matches.forEach(m => {
            if (m.id !== c.id) return;
            const st = (c.status || {}).type || {};
            m.state = st.state; m.detail = st.shortDetail || st.detail;
            (c.competitors || []).forEach((p, i) => { if (m.p[i]) { m.p[i].sets = (p.linescores || []).map(l => +l.value || 0); m.p[i].win = !!p.winner; m.p[i].serve = !!p.possession; } });
            if (m.state === 'in') anyLive = true;
          }));
        })));
      } else if (KIND === 'golf') {
        (j.events || []).forEach(e => {
          const ev = (SD.events || []).find(x => x.id === e.id); if (!ev) return;
          const c = (e.competitions || [{}])[0];
          ev.board = gfParse(c);
          ev.state = ((e.status || {}).type || {}).state; ev.detail = ((e.status || {}).type || {}).shortDetail;
          if (ev.state === 'in') anyLive = true;
        });
      }
    });
    if (KIND === 'golf') { gfAlerts(); ['ypHome', 'ypGames'].forEach(i => { const y = document.getElementById(i); if (y) y.innerHTML = yourPlayers(); }); }
    if (KIND === 'tennis') { tnAlerts(); ['ypHome', 'ypGames'].forEach(i => { const y = document.getElementById(i); if (y) y.innerHTML = yourPlayers(); }); }
    ticker();
    if (currentTab === 'games' && !(document.activeElement && document.activeElement.tagName === 'INPUT')) {
      if (KIND === 'football' || KIND === 'hockey') { if (OPEN_GAME) { drawGame(OPEN_GAME); } else renderGames(); } else renderGames();
    } else if (currentTab === 'home') renderHome();
    clearTimeout(_poll); _poll = setTimeout(pollLive, anyLive ? 10000 : 30000);
  });
}
